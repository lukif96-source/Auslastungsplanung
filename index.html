<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLPRO | Terminal V9.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap');

        :root {
            /* Brutal Fintech Palette */
            --bg-base: #000000;
            --bg-panel: #0A0A0A;
            --bg-elevated: #141414;
            --border-dim: #1F1F1F;
            --border-focus: #333333;
            
            /* Accents */
            --volt: #D4FF00; /* Aggressive Fintech Neon Green */
            --volt-dim: rgba(212, 255, 0, 0.1);
            --cyan: #00E5FF;
            --danger: #FF3366;
            --danger-dim: rgba(255, 51, 102, 0.1);
            
            /* Text */
            --text-main: #EDEDED;
            --text-muted: #88888B;
            --text-dark: #444446;
            
            /* Typography & Shapes */
            --font-ui: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --rad: 4px; /* Sharp corners */
        }

        *, *::before, *::after { box-sizing: border-box; }
        
        body {
            background: var(--bg-base); color: var(--text-main); font-family: var(--font-ui);
            margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh;
            user-select: none; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--border-focus); }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* --- TERMINAL AUTH GATEWAY --- */
        .auth-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .auth-card {
            background: var(--bg-panel); border: 1px solid var(--border-dim);
            padding: 40px; width: 360px; border-radius: var(--rad); box-shadow: 0 0 40px rgba(0,0,0,1);
        }
        .auth-card h2 { font-family: var(--font-mono); margin: 0 0 5px 0; color: #fff; font-size: 20px; font-weight: 800; letter-spacing: -1px; }
        .auth-card h2 span { color: var(--volt); }
        .auth-card p { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-family: var(--font-mono); margin-bottom: 30px; letter-spacing: 1px; }
        .auth-card label { display: block; text-align: left; font-size: 9px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 15px; }
        .auth-card input { 
            width: 100%; padding: 12px; margin-top: 5px; background: var(--bg-base); 
            border: 1px solid var(--border-dim); border-radius: var(--rad); color: var(--text-main); font-family: var(--font-mono); font-size: 12px; transition: 0.2s;
        }
        .auth-card input:focus { outline: none; border-color: var(--volt); }
        .auth-card button { 
            width: 100%; padding: 12px; margin-top: 25px; background: var(--volt); border: none; 
            font-weight: 800; cursor: pointer; border-radius: var(--rad); color: #000; font-size: 12px;
            text-transform: uppercase; letter-spacing: 1px; transition: 0.1s; font-family: var(--font-mono);
        }
        .auth-card button:hover { background: #fff; }

        /* --- TOP NAV (HUD) --- */
        .hud { 
            height: 60px; background: var(--bg-panel); border-bottom: 1px solid var(--border-dim); 
            display: flex; align-items: center; padding: 0 20px; gap: 20px; z-index: 3000; flex-shrink: 0; 
        }
        .brand { display: flex; align-items: baseline; gap: 8px; }
        .logo { font-family: var(--font-mono); font-size: 18px; font-weight: 800; color: #fff; letter-spacing: -1px; }
        .logo span { color: var(--volt); }
        .sys-badge { background: var(--border-dim); color: var(--text-muted); font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 2px; font-family: var(--font-mono); letter-spacing: 1px; }

        .kpi-board { display: flex; gap: 1px; background: var(--border-dim); border: 1px solid var(--border-dim); border-radius: var(--rad); overflow: hidden; margin-left: 20px; }
        .kpi-card { background: var(--bg-panel); padding: 8px 16px; min-width: 120px; display: flex; flex-direction: column; }
        .kpi-lbl { font-size: 9px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
        .kpi-val { font-family: var(--font-mono); font-size: 16px; font-weight: 500; color: var(--text-main); margin-top: 2px; }
        .kpi-val small { font-size: 10px; color: var(--text-muted); }
        .kpi-val.highlight { color: var(--volt); }

        .palette-container { display: flex; align-items: center; flex-grow: 1; overflow-x: auto; gap: 6px; padding: 0 10px; border-left: 1px solid var(--border-dim); margin-left: 10px; }
        .palette-item { 
            padding: 6px 12px; border-radius: var(--rad); font-size: 10px; font-weight: 600; cursor: pointer; 
            border: 1px solid var(--border-dim); background: var(--bg-base); display: flex; align-items: center; gap: 8px; color: var(--text-muted); transition: 0.1s; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .palette-item:hover { border-color: var(--border-focus); color: var(--text-main); }
        .palette-item.active { border-color: var(--volt); color: #fff; background: var(--bg-elevated); }
        .palette-color-dot { width: 8px; height: 8px; border-radius: 2px; }
        .btn-add { 
            width: 26px; height: 26px; border-radius: var(--rad); background: var(--border-dim); border: none; 
            font-size: 14px; font-family: var(--font-mono); cursor: pointer; color: var(--text-main); transition: 0.1s; display: flex; align-items: center; justify-content: center;
        }
        .btn-add:hover { background: var(--text-main); color: #000; }

        .controls { display: flex; gap: 6px; align-items: center; }
        .btn { 
            background: var(--bg-base); border: 1px solid var(--border-dim); padding: 7px 12px; font-size: 10px; 
            font-weight: 600; cursor: pointer; border-radius: var(--rad); text-transform: uppercase; color: var(--text-muted); transition: 0.1s; font-family: var(--font-mono); letter-spacing: 0.5px;
        }
        .btn:hover { border-color: var(--border-focus); color: var(--text-main); }
        .btn.active { background: var(--text-main); color: #000; border-color: var(--text-main); }
        .btn.primary { color: var(--volt); border-color: var(--volt-dim); }
        .btn.primary:hover { background: var(--volt); color: #000; }

        /* --- MAIN LAYOUT --- */
        .main-wrapper { display: flex; flex: 1; overflow: hidden; background: var(--bg-base); }
        .viewport { flex: 1; overflow: auto; position: relative; }

        /* --- TERMINAL GRID --- */
        table { border-collapse: separate; border-spacing: 0; width: max-content; }
        th, td { border-bottom: 1px solid var(--border-dim); border-right: 1px solid var(--border-dim); text-align: center; }
        
        #gridHead th { position: sticky; top: 0; background: var(--bg-panel); font-size: 9px; font-weight: 700; color: var(--text-muted); z-index: 100; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border-focus); }
        #gridHead tr:nth-child(1) th { height: 24px; background: var(--bg-base); color: var(--text-dark); border-bottom: 1px solid var(--border-dim); }
        #gridHead tr:nth-child(2) th { height: 20px; }
        #gridHead tr:nth-child(3) th { height: 36px; }
        
        td:first-child { 
            position: sticky; left: 0; z-index: 80; background: var(--bg-panel); width: 140px !important; 
            text-align: left; padding-left: 15px; font-weight: 600; border-right: 1px solid var(--border-focus); color: var(--text-main); font-family: var(--font-mono); font-size: 11px; letter-spacing: -0.5px;
        }
        
        .project-cell { height: 40px; cursor: crosshair; font-size: 9px; font-weight: 700; text-transform: uppercase; transition: 0s; color: #fff; letter-spacing: 0.5px; }
        .project-cell:hover { outline: 1px solid var(--text-main); outline-offset: -1px; z-index: 10; }
        .monday-start { border-left: 1px solid var(--border-focus) !important; }
        
        .day-num { font-family: var(--font-mono); font-size: 14px; font-weight: 500; color: var(--text-main); }
        .day-short { font-size: 8px; color: var(--text-dark); }

        .stat-row td { background: var(--bg-panel) !important; color: var(--text-main); font-weight: 600; padding: 8px; font-family: var(--font-mono); font-size: 10px; border-top: 1px solid var(--border-focus); }
        .stat-row td:first-child { color: var(--text-muted) !important; }

        /* --- CONTROL CENTER (SIDEBAR) --- */
        .sidebar { 
            width: 300px; background: var(--bg-panel); border-left: 1px solid var(--border-dim); 
            display: flex; flex-direction: column; z-index: 2000;
        }
        .sidebar-header { padding: 15px 20px; border-bottom: 1px solid var(--border-dim); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h3 { margin: 0; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .status-dot { width: 6px; height: 6px; background: var(--volt); border-radius: 50%; box-shadow: 0 0 8px var(--volt); }
        
        .sidebar-content { flex: 1; overflow-y: auto; padding: 20px; }
        
        .todo-input-group { display: flex; gap: 6px; margin-bottom: 15px; }
        .todo-input-group input { 
            flex: 1; padding: 10px; background: var(--bg-base); border: 1px solid var(--border-dim); 
            border-radius: var(--rad); font-size: 11px; color: var(--text-main); font-family: var(--font-mono);
        }
        .todo-input-group input:focus { outline: none; border-color: var(--border-focus); }
        .todo-input-group button { background: var(--border-dim); border: none; padding: 0 12px; border-radius: var(--rad); cursor: pointer; color: var(--text-main); font-family: var(--font-mono); }
        .todo-input-group button:hover { background: var(--text-main); color: #000; }

        .todo-item { 
            display: flex; align-items: flex-start; gap: 10px; padding: 10px; border-bottom: 1px solid var(--border-dim);
            transition: 0.1s; 
        }
        .todo-item:hover { background: var(--bg-elevated); }
        .todo-item.done { opacity: 0.3; }
        .todo-item.done span { text-decoration: line-through; }
        .todo-item input[type="checkbox"] { margin-top: 2px; cursor: pointer; accent-color: var(--border-focus); }
        .todo-item span { flex: 1; font-size: 11px; line-height: 1.4; color: var(--text-main); }
        .todo-item .del-todo { color: var(--danger); cursor: pointer; font-family: var(--font-mono); font-size: 10px; opacity: 0; }
        .todo-item:hover .del-todo { opacity: 1; }

        .sys-info { margin-top: 30px; padding-top: 15px; border-top: 1px solid var(--border-dim); font-size: 10px; color: var(--text-dark); font-family: var(--font-mono); line-height: 1.8; }
        .sys-info span { color: var(--text-main); }

        /* --- MODALS & CONTEXT --- */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 5000; display: none; }
        .modal { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0; 
            background: var(--bg-panel); border: 1px solid var(--border-dim); padding: 30px; border-radius: var(--rad); 
            display: none; z-index: 5001; width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,1); 
        }
        .modal.show { opacity: 1; }
        .modal h2 { margin: 0 0 20px 0; font-family: var(--font-mono); font-size: 14px; text-transform: uppercase; color: var(--text-main); border-bottom: 1px solid var(--border-dim); padding-bottom: 10px; }
        .modal label { display: block; font-size: 9px; font-family: var(--font-mono); color: var(--text-muted); text-transform: uppercase; margin-top: 15px; }
        .modal input, .modal select { 
            width: 100%; padding: 10px; background: var(--bg-base); border: 1px solid var(--border-dim); 
            border-radius: var(--rad); margin-top: 5px; color: var(--text-main); font-family: var(--font-mono); font-size: 12px;
        }
        .modal input[type="color"] { padding: 2px 5px; height: 36px; cursor: pointer; }
        .m-btns { display: flex; gap: 8px; margin-top: 25px; }
        .m-btn { flex: 1; padding: 10px; border: none; font-weight: 600; border-radius: var(--rad); cursor: pointer; font-size: 11px; text-transform: uppercase; font-family: var(--font-mono); }
        .m-save { background: var(--text-main); color: #000; }
        .m-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border-dim); }
        .m-cancel:hover { color: var(--text-main); border-color: var(--text-main); }

        #actionGridCtx { display:none; position:fixed; z-index:9000; background:var(--bg-panel); border:1px solid var(--border-focus); border-radius:var(--rad); padding:4px; width:200px; box-shadow:0 10px 30px rgba(0,0,0,0.8); }
        #actionGridCtx button { display:block; width:100%; border:none; background:none; text-align:left; padding:8px 10px; font-size:10px; font-family:var(--font-mono); cursor:pointer; color:var(--text-main); text-transform:uppercase; border-radius:2px; }
        #actionGridCtx button:hover { background:var(--bg-elevated); }
        #actionGridCtx hr { border:none; border-top:1px solid var(--border-dim); margin:4px 0; }
        .danger-text { color: var(--danger) !important; }

        .toast-stack { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast { background: var(--bg-elevated); color: var(--text-main); border: 1px solid var(--border-focus); padding: 10px 16px; border-radius: var(--rad); font-size: 11px; font-family: var(--font-mono); opacity: 0; transform: translateY(10px); transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

<!-- AUTH SECURE GATEWAY -->
<div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
        <h2>SOL<span>PRO</span></h2>
        <p>Terminal // Authentication</p>
        <label>Operator ID (Email)</label>
        <input type="email" id="loginEmail" placeholder="id@solpro.at" autocomplete="off">
        <label>Passkey</label>
        <input type="password" id="loginPass" placeholder="••••••••">
        <button id="loginBtn" onclick="handleLogin()">INITIATE SESSION</button>
        <div id="authStatus" style="margin-top:15px; font-size:10px; font-family:var(--font-mono); color:var(--danger);"></div>
    </div>
</div>

<!-- TOP NAV HUD -->
<div class="hud">
    <div class="brand">
        <div class="logo">SOL<span>PRO</span></div>
        <div class="sys-badge">V9.0</div>
    </div>
    
    <div class="kpi-board">
        <div class="kpi-card">
            <span class="kpi-lbl">CAPACITY</span>
            <span class="kpi-val" id="kpiCapRate">0%</span>
        </div>
        <div class="kpi-card">
            <span class="kpi-lbl">ALLOCATED</span>
            <span class="kpi-val" id="kpiTotalDays">0 <small>DAYS</small></span>
        </div>
        <div class="kpi-card">
            <span class="kpi-lbl">VOLUME</span>
            <span class="kpi-val highlight" id="kpiTotalKwp">0 <small>KWP</small></span>
        </div>
    </div>

    <div class="palette-container" id="paletteUI"></div>

    <div class="controls">
        <button class="btn" id="userBtn" style="display:none" onclick="openUserManagement()">SYS_ADMIN</button>
        <button class="btn" onclick="refreshAllData()">SYNC</button>
        <button class="btn primary" id="lockStateBtn" onclick="toggleSystemLock()">PLAN MODE</button>
        <div class="seg-group">
            <button class="btn active" onclick="setView('monat', this)">M</button>
            <button class="btn" onclick="setView('jahr', this)">Y</button>
        </div>
        <button class="btn" onclick="handleLogout()">EXIT</button>
    </div>
</div>

<!-- MAIN VIEWPORT -->
<div class="main-wrapper">
    <div class="viewport" id="scrollPort">
        <table id="theTable"><thead id="gridHead"></thead><tbody id="gridBody"></tbody></table>
    </div>
    
    <!-- CONTROL CENTER SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>TERMINAL_CMD</h3>
            <div class="status-dot" title="System Online"></div>
        </div>
        <div class="sidebar-content">
            <div class="todo-input-group">
                <input type="text" id="todoInput" placeholder="> append_task...">
                <button onclick="addTodo()">ADD</button>
            </div>
            <div id="todoList"></div>
            
            <div class="sys-info">
                > OPERATOR: <span id="userEmailDisp">...</span><br>
                > CLEARANCE: <span id="userRoleDisp">...</span><br>
                > DB_STATUS: <span style="color:var(--volt)">SECURE</span>
            </div>
        </div>
    </div>
</div>

<div id="actionGridCtx"></div>
<div class="overlay" id="p_overlay" onclick="closeModals()"></div>

<!-- MODALS -->
<div class="modal" id="paletteModal">
    <h2 id="pModalTitle">PROJECT_CFG</h2>
    <label>IDENTIFIER</label><input type="text" id="palNameInput" autocomplete="off">
    <label>LOAD (KWP)</label><input type="number" id="palKwpInput">
    <label>TAG COLOR</label><input type="color" id="palColorInput">
    <input type="hidden" id="palEditId">
    <div class="m-btns">
        <button class="m-btn m-save" onclick="savePaletteItem()">COMMIT</button>
        <button class="m-btn m-cancel" onclick="closeModals()">ABORT</button>
    </div>
    <button class="m-btn" id="palDelBtn" onclick="deletePaletteItem()" style="display:none; width:100%; margin-top:10px; background:transparent; color:var(--danger); border:1px solid var(--danger);">PURGE_RECORD</button>
</div>

<div class="modal" id="userModal">
    <h2>SYS_ADMIN_PANEL</h2>
    <div id="userList" style="max-height:280px; overflow-y:auto; margin-top:10px;"></div>
    <div class="m-btns">
        <button class="m-btn m-cancel" onclick="closeModals()">CLOSE</button>
    </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script>
    /* ==========================================
       SUPABASE CORE SETUP
       ========================================== */
    const SUPABASE_URL = "https://iuxklqcpexoziqxrohwa.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VteOTQ6g28z9Dvo-QUG8jw_hehaZpWu";
    const solproSupa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let userRole = 'viewer';
    let projects = [], plannerGrid = {}, deactivatedBuses = [], todos = [];
    let activeProjectId = "ERASER", isDrawing = false, selectedCells = [], isAppLockedForEditing = false;
    const baseFlottenListe = ["SOL 2", "SOL 3", "SOL 4", "SOL 12", "SOL 16"];
    
    // ==========================================
    // AUTHENTICATION
    // ==========================================
    async function handleLogin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPass').value;
        const status = document.getElementById('authStatus');
        const btn = document.getElementById('loginBtn');

        if(!email || !password) return (status.innerText = "ERR: MISSING_CREDENTIALS");
        btn.innerText = "VERIFYING..."; btn.disabled = true;

        try {
            const { data, error } = await solproSupa.auth.signInWithPassword({ email, password });
            if (error) throw error;
            currentUser = data.user;
            await fetchUserRole();
            document.getElementById('authOverlay').style.display = 'none';
            startApp();
        } catch (e) {
            status.innerText = "ERR: " + e.message.toUpperCase();
        } finally {
            btn.innerText = "INITIATE SESSION"; btn.disabled = false;
        }
    }

    async function fetchUserRole() {
        const { data } = await solproSupa.from('profiles').select('role').eq('id', currentUser.id).single();
        if (data) userRole = data.role;
        else {
            await solproSupa.from('profiles').insert([{ id: currentUser.id, email: currentUser.email, role: 'viewer' }]);
            userRole = 'viewer';
        }
        document.getElementById('userRoleDisp').innerText = userRole.toUpperCase();
        document.getElementById('userEmailDisp').innerText = currentUser.email.split('@')[0].toUpperCase();
        if(userRole === 'admin') document.getElementById('userBtn').style.display = 'block';
    }

    function handleLogout() { solproSupa.auth.signOut(); window.location.reload(); }

    // ==========================================
    // TO-DO ENGINE
    // ==========================================
    async function loadTodos() {
        const { data } = await solproSupa.from('todos').select('*').eq('user_id', currentUser.id).order('id', { ascending: false });
        todos = data || [];
        renderTodos();
    }

    async function addTodo() {
        const input = document.getElementById('todoInput');
        const task = input.value.trim();
        if(!task) return;

        const { data, error } = await solproSupa.from('todos').insert([{ 
            task: task, user_id: currentUser.id, is_completed: false 
        }]).select().single();

        if(error) return showToast("ERR_SAVE", "error");
        input.value = ""; todos.unshift(data); renderTodos();
    }

    async function toggleTodo(id, currentStatus) {
        await solproSupa.from('todos').update({ is_completed: !currentStatus }).eq('id', id);
        await loadTodos();
    }

    async function deleteTodo(id) {
        await solproSupa.from('todos').delete().eq('id', id);
        await loadTodos();
    }

    function renderTodos() {
        const list = document.getElementById('todoList');
        list.innerHTML = '';
        todos.forEach(t => {
            const div = document.createElement('div');
            div.className = `todo-item ${t.is_completed ? 'done' : ''}`;
            div.innerHTML = `
                <input type="checkbox" ${t.is_completed ? 'checked' : ''} onclick="toggleTodo('${t.id}', ${t.is_completed})">
                <span>${t.task}</span>
                <div class="del-todo" onclick="deleteTodo('${t.id}')">DEL</div>
            `;
            list.appendChild(div);
        });
    }

    // ==========================================
    // PERMISSIONS
    // ==========================================
    const canPlan = () => (userRole === 'admin' || userRole === 'editor');
    const canDelete = () => (userRole === 'admin');

    // ==========================================
    // APP CORE
    // ==========================================
    async function startApp() {
        buildGrid();
        await refreshAllData();
        await loadTodos();
        renderProjectsToTopPalette();
        setupMouseDragPainting();
        setupGlobalUiHandlers();
        
        if(userRole === 'viewer') {
            isAppLockedForEditing = true;
            let btn = document.getElementById('lockStateBtn');
            btn.className = 'btn readonly'; btn.innerText = 'READ_ONLY';
        }
    }

    async function refreshAllData() {
        try {
            const { data: pData } = await solproSupa.from('projects').select('*');
            projects = pData || [];
            const { data: gData } = await solproSupa.from('planner_grid').select('*');
            plannerGrid = {};
            (gData || []).forEach(row => { plannerGrid[row.cell_id] = row.project_id; });
            const { data: fData } = await solproSupa.from('fleet_status').select('*');
            deactivatedBuses = (fData || []).filter(row => row.is_offline).map(row => row.bus_id);
            
            fullGridRepaintUI_Logic();
            renderProjectsToTopPalette();
            showToast("DB_SYNC_OK", "success");
        } catch (e) { showToast("ERR_SYNC", "error"); }
    }

    function buildGrid() {
        const thead = document.getElementById('gridHead'); const tbody = document.getElementById('gridBody');
        let currentDay = new Date(2026, 7, 17); const endDate = new Date(2026, 11, 31); const dateArray = [];
        while(currentDay <= endDate) { if(currentDay.getDay()!==0 && currentDay.getDay()!==6) dateArray.push(new Date(currentDay)); currentDay.setDate(currentDay.getDate()+1); }
        
        let trMonat = `<tr><th rowspan="3" class="fixed-corner" style="border-right: 1px solid var(--border-focus);"><div class="logo" style="font-size:16px;">SOL<span>PRO</span></div></th>`;
        let trKW = `<tr>`, trTage = `<tr>`;
        let lastM=-1, mSpans=[], lastKW=-1, kwSpans=[];
        dateArray.forEach(d => {
            let m=d.getMonth(), kw=getKalenderWocheMath(d);
            if(m!==lastM){ mSpans.push({label:d.toLocaleString('de-DE',{month:'short'}).toUpperCase(), count:1}); lastM=m; } else mSpans[mSpans.length-1].count++;
            if(kw!==lastKW){ kwSpans.push({label:'W'+kw, count:1}); lastKW=kw; } else kwSpans[kwSpans.length-1].count++;
        });
        mSpans.forEach(ms => trMonat += `<th colspan="${ms.count}">${ms.label}</th>`);
        kwSpans.forEach(ks => trKW += `<th colspan="${ks.count}">${ks.label}</th>`);
        dateArray.forEach(d => {
            let iso = d.toISOString().split('T')[0];
            trTage += `<th id="th-${iso}" class="${d.getDay()===1?'monday-start':''}"><div class="day-num">${d.getDate()}</div><div class="day-short">${d.toLocaleString('de-DE',{weekday:'short'})}</div></th>`;
        });
        thead.innerHTML = trMonat + `</tr>` + trKW + `</tr>` + trTage + `</tr>`;
        baseFlottenListe.forEach(w => {
            let sf = w.replace(/\s+/g,'_');
            let rw = `<tr id="row_${sf}" class="worker-row is-active"><td><div class="worker-controls"><span>${w}</span></div></td>`;
            dateArray.forEach(d => {
                let iso = d.toISOString().split('T')[0];
                rw += `<td id="CELL_${sf}_${iso}" class="project-cell${(d.getDay()===1?' monday-start':'')}" data-date-ts="${d.getTime()}"></td>`;
            });
            tbody.insertAdjacentHTML('beforeend', rw + `</tr>`);
        });
        let fRow = `<tr class="stat-row"><td>AGGREGATE</td>`;
        dateArray.forEach(d => fRow += `<td id="COUNT_${d.toISOString().split('T')[0]}">0</td>`);
        tbody.insertAdjacentHTML('beforeend', fRow + `</tr>`);
    }

    function setupMouseDragPainting() {
        document.addEventListener('mousedown', e => {
            if (e.target.classList.contains('project-cell') && e.button === 2) {
                if(isAppLockedForEditing || !canPlan()) return; e.preventDefault(); selectedCellDomID = e.target.id;
                bautHtmlFurDasActionContextMenu(); let cm=document.getElementById('actionGridCtx'); cm.style.display="block"; cm.style.left=e.clientX+"px"; cm.style.top=e.clientY+"px"; return;
            }
            if (e.target.classList.contains('project-cell') && e.button === 0) {
                if(isAppLockedForEditing || !canPlan()) return;
                isDrawing = true; selectedCells = [e.target.id]; e.target.classList.add('selecting');
                e.target.style.outline = "1px solid var(--text-main)";
            }
        });
        document.addEventListener('mouseover', e => { 
            if(isDrawing && e.target.classList.contains('project-cell') && !selectedCells.includes(e.target.id)) { 
                selectedCells.push(e.target.id); e.target.classList.add('selecting'); e.target.style.outline = "1px solid var(--text-main)";
            } 
        });
        document.addEventListener('mouseup', e => { 
            if(isDrawing && e.button === 0 && selectedCells.length > 0) { verarbeiteMalerZugAufGrid(); } 
            document.querySelectorAll('.selecting').forEach(nd => { nd.classList.remove('selecting'); nd.style.outline=""; }); isDrawing = false; 
        });
        document.addEventListener('contextmenu', e => { if (e.target.classList.contains('project-cell')) e.preventDefault(); });
    }

    async function verarbeiteMalerZugAufGrid() {
        for(let cid of selectedCells) {
            if(activeProjectId === "ERASER") {
                delete plannerGrid[cid];
                await solproSupa.from('planner_grid').delete().eq('cell_id', cid);
            } else {
                plannerGrid[cid] = activeProjectId;
                await solproSupa.from('planner_grid').upsert({ cell_id: cid, project_id: activeProjectId });
            }
        }
        fullGridRepaintUI_Logic(); renderProjectsToTopPalette(); selectedCells = [];
    }

    function bautHtmlFurDasActionContextMenu() {
        let ActionPanel = document.getElementById('actionGridCtx');
        let prj = projects.find(p => p.id === activeProjectId);
        let content = `
            ${(activeProjectId !== 'ERASER' && activeProjectId !== 'SYS_VACATION' && prj)
            ? `<button onclick="fireAction('FILL_PROJECT')" style="color:${prj.color};">FILL_WEEK [${prj.name}]</button><hr>` : ''}
            <button onclick="fireAction('FILL_URLAUB')">SET_WEEK_OFFLINE</button>
            <hr>
            ${canDelete() ? `<button onclick="fireAction('DELETE_WEEK')" class="danger-text">PURGE_WEEK</button>` : ''}
            ${canDelete() ? `<button onclick="fireAction('DELETE_CELL')" class="danger-text">PURGE_CELL</button>` : ''}
        `;
        ActionPanel.innerHTML = content;
    }

    async function fireAction(cmd) {
        document.getElementById('actionGridCtx').style.display = 'none';
        if(!selectedCellDomID) return;
        
        if(cmd === 'DELETE_CELL') { 
            delete plannerGrid[selectedCellDomID]; 
            await solproSupa.from('planner_grid').delete().eq('cell_id', selectedCellDomID);
            fullGridRepaintUI_Logic(); renderProjectsToTopPalette(); return; 
        }
        let parts = selectedCellDomID.split('_');
        let targetDateStr = parts.pop(); parts.shift();
        let targetBusID = parts.join('_');
        let targetKW = getKalenderWocheMath(new Date(targetDateStr));
        
        document.querySelectorAll(`.project-cell`).forEach(async cell => {
            if(cell.id.includes(targetBusID)) {
                let cellKW = getKalenderWocheMath(new Date(Number(cell.getAttribute('data-date-ts'))));
                if(cellKW === targetKW) {
                    if(cmd === 'DELETE_WEEK') { 
                        delete plannerGrid[cell.id]; 
                        solproSupa.from('planner_grid').delete().eq('cell_id', cell.id);
                    }
                    if(cmd === 'FILL_URLAUB') { 
                        plannerGrid[cell.id] = "SYS_VACATION"; 
                        solproSupa.from('planner_grid').upsert({ cell_id: cell.id, project_id: "SYS_VACATION" });
                    }
                    if(cmd === 'FILL_PROJECT' && activeProjectId) { 
                        plannerGrid[cell.id] = activeProjectId; 
                        solproSupa.from('planner_grid').upsert({ cell_id: cell.id, project_id: activeProjectId });
                    }
                }
            }
        });
        fullGridRepaintUI_Logic(); renderProjectsToTopPalette();
    }

    function renderProjectsToTopPalette() {
        let container = document.getElementById('paletteUI');
        if(!container) return;
        container.innerHTML = canPlan() ? `<button class="btn-add" onclick="oeffneProjectCreatorModal()">+</button>` : '';
        projects.forEach(p => {
            let counts = Object.keys(plannerGrid).filter(k => plannerGrid[k] === p.id).length;
            let el = document.createElement('div');
            el.className = `palette-item ${activeProjectId === p.id ? 'active' : ''}`;
            el.innerHTML = `<div class="palette-color-dot" style="background:${p.color};"></div><b>${p.name}</b> <span style="opacity:0.5;">${counts}T</span>`;
            el.onclick = () => { activeProjectId = p.id; renderProjectsToTopPalette(); };
            el.oncontextmenu = (e) => { e.preventDefault(); e.stopPropagation(); if(!canPlan()) return; document.getElementById('palEditId').value = p.id; document.getElementById('palNameInput').value = p.name; document.getElementById('palKwpInput').value = p.kwp || 0; document.getElementById('palColorInput').value = p.color; document.getElementById('palDelBtn').style.display = canDelete() ? "block" : "none"; document.getElementById('pModalTitle').innerText = "EDIT_CFG"; openPaletteModal(); };
            container.appendChild(el);
        });
        [{ id: 'ERASER', label: 'ERASER', c: '#fff' }, { id: 'SYS_VACATION', label: 'OFFLINE', c: '#f59e0b' }].forEach(t => {
            let el = document.createElement('div'); el.className = `palette-item ${(activeProjectId === t.id ? 'active' : '')}`; 
            el.innerHTML = `<div class="palette-color-dot" style="background:${t.c};"></div><b>${t.label}</b>`;
            el.onclick = () => { activeProjectId = t.id; renderProjectsToTopPalette(); };
            container.appendChild(el);
        });
    }

    function oeffneProjectCreatorModal() {
        if(!canPlan()) return showToast('ERR_NO_AUTH', 'error');
        if(isAppLockedForEditing) return;
        document.getElementById('pModalTitle').innerText = "NEW_CFG"; document.getElementById('palEditId').value = ""; document.getElementById('palNameInput').value = ""; document.getElementById('palKwpInput').value = ""; document.getElementById('palDelBtn').style.display = 'none';
        openPaletteModal();
    }

    async function savePaletteItem() {
        let name = document.getElementById('palNameInput').value.trim(); 
        let kwp = parseFloat(document.getElementById('palKwpInput').value) || 0;
        let id = document.getElementById('palEditId').value;
        if(!name) return showToast('ERR_MISSING_DATA', 'error');
        
        let projData = { name, kwp, color: document.getElementById('palColorInput').value };
        if(id) {
            projData.id = id;
            await solproSupa.from('projects').upsert(projData);
        } else {
            const { data } = await solproSupa.from('projects').insert([projData]).select().single();
            projects.push(data);
            activeProjectId = data.id;
        }
        closeModals(); await refreshAllData(); renderProjectsToTopPalette();
    }

    async function deletePaletteItem() {
        if(!canDelete()) return;
        let id = document.getElementById('palEditId').value; 
        await solproSupa.from('projects').delete().eq('id', id);
        await solproSupa.from('planner_grid').delete().eq('project_id', id);
        closeModals(); await refreshAllData(); renderProjectsToTopPalette();
    }

    async function openUserManagement() {
        if(userRole !== 'admin') return;
        const { data: users } = await solproSupa.from('profiles').select('*');
        const userListDiv = document.getElementById('userList');
        userListDiv.innerHTML = '';
        users.forEach(u => {
            const row = document.createElement('div');
            row.className = 'user-row';
            row.innerHTML = `<span style="font-family:var(--font-mono);">${u.email}</span><select onchange="updateUserRole('${u.id}', this.value)">
                <option value="viewer" ${u.role === 'viewer' ? 'selected' : ''}>VIEWER</option>
                <option value="editor" ${u.role === 'editor' ? 'selected' : ''}>EDITOR</option>
                <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>ADMIN</option>
            </select>`;
            userListDiv.appendChild(row);
        });
        document.getElementById('p_overlay').style.display = 'block';
        document.getElementById('userModal').style.display = 'block';
        setTimeout(() => document.getElementById('userModal').classList.add('show'), 10);
    }

    async function updateUserRole(userId, newRole) {
        await solproSupa.from('profiles').update({ role: newRole }).eq('id', userId);
        showToast(`ROLE_UPDATED`, "success");
    }

    function setupGlobalUiHandlers() {
        document.addEventListener('click', e => { if(!e.target.closest('#actionGridCtx') && e.button !== 2) document.getElementById('actionGridCtx').style.display = 'none'; });
    }
    function closeModals() {
        document.querySelectorAll('.modal').forEach(m => { m.classList.remove('show'); setTimeout(()=>m.style.display='none', 200); });
        document.getElementById('p_overlay').style.display = 'none';
    }
    function openPaletteModal() {
        document.getElementById('p_overlay').style.display = 'block';
        const m = document.getElementById('paletteModal');
        m.style.display = 'block';
        setTimeout(() => m.classList.add('show'), 10);
        document.getElementById('palNameInput').focus();
    }
    function toggleSystemLock() {
        if(!canPlan()) return;
        isAppLockedForEditing = !isAppLockedForEditing; 
        let btn = document.getElementById('lockStateBtn');
        if(isAppLockedForEditing){ btn.className = 'btn readonly'; btn.innerText = 'READ_ONLY'; }
        else { btn.className = 'btn primary'; btn.innerText = 'PLAN_MODE'; }
    }
    
    function fullGridRepaintUI_Logic() {
        document.querySelectorAll('.project-cell').forEach(c => { c.style.backgroundColor="transparent"; c.innerText=""; });
        Object.keys(plannerGrid).forEach(k => {
            let p = projects.find(x=>x.id===plannerGrid[k]); let cell = document.getElementById(k);
            if(!cell) return;
            if(plannerGrid[k] === "SYS_VACATION") { cell.style.background="repeating-linear-gradient(45deg, #1A1A1A, #1A1A1A 8px, #0A0A0A 8px, #0A0A0A 16px)"; cell.innerText="OFF"; cell.style.color= "var(--warn)"; return; }
            if(p) { cell.style.backgroundColor=p.color; cell.innerText=p.name; cell.style.color="#000"; }
        });
        evalDashboardMathemations();
    }
    
    function evalDashboardMathemations() {
        let netWork=0, lost=0, maxPossible=0;
        let activeBuses = baseFlottenListe.length - deactivatedBuses.length;
        document.querySelectorAll('[id^="COUNT_"]').forEach(f => {
            let dt = f.id.replace('COUNT_','');
            let dayLost=0, dayWork=0;
            Object.keys(plannerGrid).forEach(k => { if(k.includes(dt) && !deactivatedBuses.some(b=>k.includes(b))) { if(plannerGrid[k] === "SYS_VACATION") dayLost++; else dayWork++; } });
            let capThisDay = activeBuses - dayLost; netWork += dayWork; lost += dayLost; maxPossible += (capThisDay > 0 ? capThisDay : 0);
            f.innerText = dayWork + "/" + (capThisDay > 0 ? capThisDay : 0);
            f.style.color = (capThisDay > 0 && dayWork >= capThisDay) ? "var(--volt)" : "var(--text-muted)";
        });
        let rate = maxPossible > 0 ? Math.round((netWork/maxPossible)*100) : 0;
        document.getElementById('kpiCapRate').innerText = rate + "%";
        document.getElementById('kpiCapRate').style.color = rate >= 80 ? "var(--volt)" : "var(--text-main)";
        document.getElementById('kpiTotalDays').innerText = netWork + " T";
        let totalKwp = 0;
        new Set(Object.values(plannerGrid)).forEach(pid => {
            let p = projects.find(x => x.id === pid);
            if(p) totalKwp += (p.kwp || 0);
        });
        document.getElementById('kpiTotalKwp').innerHTML = totalKwp + " <small>KWP</small>";
    }
    
    function getKalenderWocheMath(d){ let x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()+4-(x.getDay()||7)); return Math.ceil((((x-new Date(x.getFullYear(),0,1))/86400000)+1)/7); }
    function showToast(msg, type) {
        const stack = document.getElementById('toastStack');
        const t = document.createElement('div'); t.className = `toast`; t.style.borderLeft = `3px solid ${type === 'success' ? 'var(--volt)' : (type === 'error' ? 'var(--danger)' : 'var(--text-muted)')}`;
        t.innerText = msg; stack.appendChild(t);
        requestAnimationFrame(()=>t.classList.add('show'));
        setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 300); }, 3000);
    }
    function setView(m, b){ /* Placeholder for View Logic */ }
</script>
