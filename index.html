<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF, charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLPRO | Executive Terminal V10.2</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap');

        :root {
            --bg-base: #080a0f;
            --bg-panel: #111827;
            --bg-elevated: #1f2937;
            --border: #2d3748;
            --border-focus: #a4c639;
            --volt: #a4c639;
            --volt-glow: rgba(164, 198, 57, 0.2);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --danger: #f43f5e;
            --success: #10b981;
            --rad: 4px;
            --font-mono: 'JetBrains Mono', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; }
        body {
            background: var(--bg-base); color: var(--text-main); font-family: 'Inter', sans-serif;
            margin: 0; overflow: hidden; display: flex; flex-//direction: column; height: 100vh;
            user-select: none; -webkit-font-smoothing: antialiased;
        }

        /* AUTH GATEWAY */
        .auth-overlay {
            position: fixed; inset: 0; background: #000; z-index: 10000;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px);
        }
        .auth-card {
            background: var(--bg-panel); border: 1px solid var(--border);
            padding: 40px; border-radius: var(--rad); width: 380px; text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,1);
        }
        .auth-card h2 { font-family: 'Orbitron'; margin: 0 0 20px 0; color: #fff; font-size: 22px; letter-spacing: 1px; }
        .auth-card h2 span { color: var(--volt); }
        .auth-card label { display: block; text-align: left; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-top: 15px; }
        .auth-card input { 
            width: 100%; padding: 12px; margin-top: 5px; background: #000; 
            border: 1px solid var(--border); border-radius: var(--rad); color: #fff; font-family: var(--font-mono); font-size: 13px;
        }
        .auth-card button { 
            width: 100%; padding: 14px; margin-top: 25px; background: var(--volt); border: none; 
            font-weight: 800; cursor: pointer; border-radius: var(--rad); color: #000; text-transform: uppercase; font-family: var(--font-mono); transition: 0.2s;
        }
        .auth-card button:hover { background: #fff; }

        /* HUD NAV */
        .hud { 
            height: 64px; background: var(--bg-panel); border-bottom: 1px solid var(--border); 
            display: flex; align-items: center; padding: 0 20px; gap: 20px; z-index: 3000; flex-shrink: 0; 
        }
        .logo { font-family: 'Orbitron'; font-size: 20px; font-weight: 900; color: #fff; }
        .logo span { color: var(--volt); }

        .kpi-board { display: flex; gap: 0; background: #000; border: 1px solid var(--border); overflow: hidden; border-radius: var(--rad); }
        .kpi-card { padding: 6px 15px; border-right: 1px solid var(--border); min-width: 110px; }
        .kpi-lbl { font-size: 9px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; display: block; }
        .kpi-val { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: #fff; }
        .kpi-val.highlight { color: var(--volt); }

        .palette-container { display: flex; align-items: center; flex-grow: 1; overflow-x: auto; gap: 6px; padding: 0 10px; border-left: 1px solid var(--border); margin-left: 10px; }
        .palette-item { 
            padding: 5px 12px; border-radius: var(--rad); font-size: 10px; font-weight: 600; cursor: pointer; 
            border: 1px solid var(--border); background: var(--bg-base); color: var(--text-muted); display: flex; align-items: center; gap: 8px; transition: 0.1s;
        }
        .palette-item.active { border-color: var(--volt); color: #fff; background: var(--volt-dim); }
        .btn-add { width: 26px; height: 26px; border-radius: var(--rad); background: var(--border); border: none; color: #fff; cursor: pointer; font-family: var(--font-mono); }

        .controls { display: flex; gap: 6px; align-items: center; }
        .btn { background: #000; border: 1px solid var(--border); padding: 7px 12px; font-size: 10px; 
               font-weight: 700; cursor: pointer; border-radius: var(--rad); color: var(--text-muted); transition: 0.1s; font-family: var(--font-mono); }
        .btn:hover { border-color: var(--text-main); color: #fff; }
        .btn.active { background: var(--volt); color: #000; border-color: var(--volt); }
        .btn.primary { color: var(--volt); border-color: var(--volt); }
        .btn.danger { color: var(--danger); }

        /* VIEW NAVIGATION */
        .nav-tabs { display: flex; background: var(--bg-panel); border-bottom: 1px solid var(--border); padding: 0 20px; gap: 1px; }
        .nav-tab { padding: 10px 20px; font-size: 11px; font-family: var(--font-mono); cursor: pointer; color: var(--text-muted); transition: 0.1s; }
        .nav-tab.active { background: var(--bg-base); color: var(--volt); border-bottom: 2px solid var(--volt); }

        /* CONTENT LAYERS */
        .main-container { flex: 1; position: relative; overflow: hidden; }
        .view-layer { position: absolute; inset: 0; display: none; overflow: auto; padding: 20px; }
        .view-layer.active { display: block; }

        /* TERMINAL GRID */
        table { border-collapse: separate; border-spacing: 0; width: max-content; background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--rad); overflow: hidden; }
        th, td { border: 1px solid var(--border); text-align: center; }
        #gridHead th { position: sticky; top: 0; background: #0a0a0a; font-size: 9px; font-weight: 700; color: var(--text-muted); z-index: 100; text-transform: uppercase; }
        #gridHead tr:nth-child(1) th { height: 26px; background: #000; color: var(--volt); border-bottom: 1px solid var(--border-focus); }
        td:first-child { position: sticky; left: 0; z-index: 80; background: #0f172a; width: 150px !important; text-align: left; padding-left: 12px; font-weight: 700; border-right: 1px solid var(--border-focus); color: #fff; font-family: var(--font-mono); font-size: 11px; }
        
        .project-cell { height: 40px; cursor: crosshair; font-size: 9px; font-weight: 700; text-transform: uppercase; color: #fff; transition: 0s; }
        .project-cell:hover { outline: 1px solid #fff; z-index: 10; }
        .monday-start { border-left: 2px solid var(--volt) !important; }
        .day-num { font-family: var(--font-mono); font-size: 14px; font-weight: 600; color: #fff; }
        .day-short { font-size: 8px; color: var(--text-muted); }

        .stat-row td { background: #0a0a0a !important; color: var(--text-//muted); font-family: var(--font-mono); font-size: 10px; }

        /* TO-DO SYSTEM */
        .task-wrapper { max-width: 800px; margin: 0 auto; }
        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .task-header h2 { font-family: var(--font-mono); font-size: 18px; color: #fff; text-transform: uppercase; }
        .task-input-group { display: flex; gap: 5px; margin-bottom: 20px; }
        .task-input-group input { flex: 1; padding: 12px; background: #000; border: 1px solid var(--border); color: #fff; font-family: var(--font-mono); font-size: 13px; outline: none; }
        .task-input-group input:focus { border-color: var(--volt); }
        .task-input-group button { background: var(--volt); border: none; padding: 0 20px; cursor: pointer; font-weight: 800; font-family: var(--font-mono); color: #000; }
        
        .task-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border); }
        .task-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-panel); color: #fff; font-size: 13px; font-family: var(--font-mono); }
        .task-item:hover { background: var(--bg-elevated); }
        .task-item.done { opacity: 0.3; }
        .task-item.done span { text-decoration: line-through; }
        .task-item input[type="checkbox"] { cursor: pointer; accent-color: var(--volt); }
        .task-item span { flex: 1; }
        .task-item .del-task { color: var(--danger); cursor: pointer; font-size: 10px; opacity: 0.5; }
        .task-item .del-task:hover { opacity: 1; }

        /* BUS TOGGLES */
        .bus-ctrl { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .toggle-btn { width: 16px; height: 16px; border-radius: 2px; border: 1px solid var(--border); background: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.1s; }
        .toggle-btn.active { background: var(--volt); border-color: var(--volt); color: #000; }
        .toggle-btn.active::after { content: '✓'; font-size: 10px; font-weight: 900; }
        .toggle-btn.inactive { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
        .toggle-btn.inactive::after { content: '✕'; font-size: 10px; font-weight: 900; }

        /* MODALS */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 5000; display: none; backdrop-filter: blur(5px); }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg-panel); border: 1px solid var(--border); padding: 30px; display: none; z-index: 5001; width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,1); }
        .modal.show { opacity: 1; }
        .modal h2 { margin: 0 0 20px 0; font-family: var(--font-mono); font-size: 14px; color: var(--volt); text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .modal label { display: block; font-size: 9px; color: var(--text-muted); text-transform: uppercase; margin-top: 15px; font-family: var(--font-mono); }
        .modal input { width: 100%; padding: 10px; background: #000; border: 1px solid var(--border); color: #fff; font-family: var(--font-mono); margin-top: 5px; }
        .m-btns { display: flex; gap: 10px; margin-top: 25px; }
        .m-btn { flex: 1; padding: 10px; border: 1px solid var(--border); background: transparent; color: #fff; cursor: pointer; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; }
        .m-btn.save { background: var(--volt); color: #000; border-color: var(--volt); font-weight: 800; }

        .toast-stack { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 5px; }
        .toast { background: #000; border: 1px solid var(--border); color: #fff; padding: 8px 15px; font-size: 11px; font-family: var(--font-mono); opacity: 0; transition: 0.2s; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
        <h2>SOL<span>PRO</span></h2>
        <p style="font-//size:10px; color:var(--text-muted); font-family:var(--font-mono); margin-bottom:20px;">SESSION_AUTH_REQUIRED</p>
        <label>Operator ID</label>
        <input type="email" id="loginEmail" placeholder="email@solpro.at">
        <label>Passkey</label>
        <input type="password" id="loginPass" placeholder="••••••••">
        <button id="loginBtn" onclick="handleLogin()">Initialize Session</button>
        <div id="authStatus" style="margin-top:15px; font-size:10px; font-family:var(--font-mono); color:var(--danger);"></div>
    </div>
</div>

<div class="accent-line"></div>

<div class="hud">
    <div class="brand">
        <div class="logo">SOL<span>PRO</span></div>
    </div>
    <div class="kpi-board">
        <div class="kpi-card"><span class="kpi-lbl">Capacity</span><span class="kpi-val" id="kpiCapRate">0%</span></div>
        <div class="kpi-card"><span class="kpi-lbl">Days</span><span class="kpi-val" id="kpiTotalDays">0 T</span></div>
        <div class="kpi-card"><span class="kpi-lbl">Vol.</span><span class="kpi-val highlight" id="kpiTotalKwp">0 <small>kWp</small></span></div>
    </div>
    <div class="palette-container" id="paletteUI"></div>
    <div class="controls">
        <button class="btn" id="userBtn" style="display:none" onclick="openUserManagement()">ADMIN</button>
        <button class="btn" onclick="refreshAllData()">SYNC</button>
        <button class="btn primary" id="lockStateBtn" onclick="toggleSystemLock()">PLAN_MODE</button>
        <button class="btn danger" onclick="handleLogout()">EXIT</button>
    </div>
</div>

<div class="nav-tabs">
    <div class="nav-tab active" id="tab-planner" onclick="switchView('planner')">[ PLANNER ]</div>
    <div class="nav-tab" id="tab-tasks" onclick="switchView('tasks')">[ TASK_MANAGER ]</div>
</div>

<div class="main-container">
    <div id="view-planner" class="view-layer active">
        <table id="theTable"><thead id="gridHead"></thead><tbody id="gridBody"></tbody></table>
    </div>
    <div id="view-tasks" class="view-layer">
        <div class="task-wrapper">
            <div class="task-header">
                <h2 style="font-family:var(--font-mono);">Operational_Tasks</h2>
                <div id="taskCount" style="font-family:var(--font-mono); font-size:12px; color:var(--volt);">0 Active</div>
            </div>
            <div class="todo-input-group">
                <input type="text" id="todoInput" placeholder="Add task to terminal...">
                <button onclick="addTodo()">ADD</button>
            </div>
            <div id="todoList" class="task-list"></div>
        </div>
    </div>
</div>

<div id="actionGridCtx" style="display:none; position:fixed; z-index:9000; background:var(--bg-panel); border:1px solid var(--border-focus); border-radius:0; padding:5px; width:200px; box-shadow:0 10px 30px rgba(0,0,0,0.8);"></div>
<div class="overlay" id="p_overlay" onclick="closeModals()"></div>

<div class="modal" id="paletteModal">
    <h2 id="pModalTitle">PROJECT_CONFIG</h2>
    <label>IDENTIFIER</label><input type="text" id="palNameInput">
    <label>kWp_LOAD</label><input type="number" id="palKwpInput">
    <label>COLOR_TAG</label><input type="color" id="palColorInput" style="height:40px;">
    <input type="hidden" id="palEditId">
    <div class="m-btns">
        <button class="m-btn m-save" onclick="savePaletteItem()">COMMIT</button>
        <button class="m-btn m-cancel" onclick="closeModals()">ABORT</button>
    </div>
    <button class="m-btn" id="palDelBtn" onclick="deletePaletteItem()" style="display:none; width:100%; margin-top:10px; background:transparent; color:var(--danger); border:1px solid var(--danger); text-align:center;">PURGE_RECORD</button>
</div>

<div class="modal" id="userModal">
    <h2>USER_MGMT</h2>
    <div id="userList" style="max-height:280px; overflow-y:auto; margin-top:10px;"></div>
    <div class="m-btns">
        <button class="m-btn m-cancel" onclick="closeModals()">CLOSE</button>
    </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script>
    /* ==========================================
       SUPABASE CORE SETUP
       ========================================== */
    const SUPABASE_URL = "https://iuxklqcpexoziqxrohwa.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VteOTQ6g28z9Dvo-QUG8jw_hehaZpWu";
    const solproSupa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let userRole = 'viewer';
    let projects = [], plannerGrid = {}, deactivatedBuses = [], todos = [];
    let activeProjectId = "ERASER", isDrawing = false, selectedCells = [], isAppLockedForEditing = false;
    const baseFlottenListe = ["SOL 2", "SOL 3", "SOL 4", "SOL 12", "SOL 16"];
    const managementFarben = ["#1e3a8a","#0284c7","#059669","#ca8a04","#b91c1c","#6d28d9","#0f766e","#a21caf","#4f46e5","#b45309","#4338ca","#064e3b"];

    // ==========================================
    // AUTHENTICATION
    // ==========================================
    async function handleLogin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPass').value;
        const status = document.getElementById('authStatus');
        const btn = document.getElementById('loginBtn');

        if(!email || !password) return (status.innerText = "ERR: MISSING_CREDENTIALS");
        btn.innerText = "VERIFYING..."; btn.disabled = true;

        try {
            const { data, error } = await solproSupa.auth.signInWithPassword({ email, password });
            if (error) throw error;
            currentUser = data.user;
            await fetchUserRole();
            document.getElementById('authOverlay').style.display = 'none';
            startApp();
        } catch (e) {
            status.innerText = "ERR: " + e.message.toUpperCase();
        } finally {
            btn.innerText = "INITIATE SESSION"; btn.disabled = false;
        }
    }

    async function fetchUserRole() {
        const { data } = await solproSupa.from('profiles').select('role').eq('id', currentUser.id).single();
        if (data) userRole = data.role;
        else {
            await solproSupa.from('profiles').insert([{ id: currentUser.id, email: currentUser.email, role: 'viewer' }]);
            userRole = 'viewer';
        }
        if(userRole === 'admin') document.getElementById('userBtn').style.display = 'block';
    }

    function handleLogout() { solproSupa.auth.signOut(); window.location.reload(); }

    // ==========================================
    // TO-DO ENGINE
    // ==========================================
    async function loadTodos() {
        const { data } = await solproSupa.from('todos').select('*').eq('user_id', currentUser.id).order('id', { ascending: false });
        todos = data || [];
        renderTodos();
    }

    async function addTodo() {
        const input = document.getElementById('todoInput');
        const task = input.value.trim();
        if(!task) return;

        const { data, error } = await solproSupa.from('todos').insert([{ 
            task: task, user_id: currentUser.id, is_completed: false 
        }]).select().single();

        if(error) return showToast("ERR_SAVE", "error");
        input.value = ""; todos.unshift(data); renderTodos();
    }

    async function toggleTodo(id, currentStatus) {
        await solproSupa.from('todos').update({ is_completed: !currentStatus }).eq('id', id);
        await loadTodos();
    }

    async function deleteTodo(id) {
        await solproSupa.from('todos').delete().eq('id', id);
        await loadTodos();
    }

    function renderTodos() {
        const list = document.getElementById('todoList');
        list.innerHTML = '';
        todos.forEach(t => {
            const div = document.createElement('div');
            div.className = `todo-item ${t.is_completed ? 'done' : ''}`;
            div.innerHTML = `
                <input type="checkbox" ${t.is_//completed ? 'checked' : ''} onclick="toggleTodo('${t.id}', ${t.is_completed})">
                <span>${t.task}</span>
                <div class="del-todo" onclick="deleteTodo('${t.id}')">DEL</div>
            `;
            list.appendChild(div);
        });
        document.getElementById('taskCount').innerText = `${todos.filter(t=>!t.is_completed).length} ACTIVE`;
    }

    // ==========================================
    // PERMISSIONS
    // ==========================================
    const canPlan = () => (userRole === 'admin' || userRole === 'editor');
    const canDelete = () => (userRole === 'admin');

    // ==========================================
    // APP CORE
    // ==========================================
    async function startApp() {
        buildGrid();
        await refreshAllData();
        await loadTodos();
        renderProjectsToTopPalette();
        setupMouseDragPainting();
        setupGlobalUiHandlers();
        
        if(userRole === 'viewer') {
            isAppLockedForEditing = true;
            document.getElementById('lockStateBtn').className = 'btn readonly';
            document.getElementById('lockStateBtn').innerText = 'READ_ONLY';
        }
    }

    async function refreshAllData() {
        try {
            const { data: pData } = await solproSupa.from('projects').select('*');
            projects = pData || [];
            const { data: gData } = await solproSupa.from('planner_grid').select('*');
            plannerGrid = {};
            (gData || []).forEach(row => { plannerGrid[row.cell_id] = row.project_id; });
            const { data: fData } = await solproSupa.from('fleet_status').select('*');
            deactivatedBuses = (fData || []).filter(row => row.is_offline).map(row => row.bus_id);
            
            fullGridRepaintUI_Logic();
            renderProjectsToTopPalette();
            showToast("SYS_SYNC_OK", "success");
        } catch (e) { showToast("ERR_SYNC", "error"); }
    }

    function buildGrid() {
        const thead = document.getElementById('gridHead'); const tbody = document.getElementById('gridBody');
        let currentDay = new Date(2026, 7, 17); const endDate = new Date(2026, 11, 31); const dateArray = [];
        while(currentDay <= endDate) { if(currentDay.getDay()!==0 && currentDay.getDay()!==6) dateArray.push(new Date(currentDay)); currentDay.setDate(currentDay.getDate()+1); }
        
        let trMonat = `<tr><th rowspan="3" class="fixed-corner" style="border-right:1px solid var(--border-focus);"><div class="logo" style="font-size:14px;">SOL<span>PRO</span></div></th>`;
        let trKW = `<tr>`, trTage = `<tr>`;
        let lastM=-1, mSpans=[], lastKW=-1, kwSpans=[];
        dateArray.forEach(d => {
            let m=d.getMonth(), kw=getKalenderWocheMath(d);
            if(m!==lastM){ mSpans.push({label:d.toLocaleString('de-DE',{month:'short'}).toUpperCase(), count:1}); lastM=m; } else mSpans[mSpans.length-1].count++;
            if(kw!==lastKW){ kwSpans.push({label:'W'+kw, count:1}); lastKW=kw; } else kwSpans[kwSpans.length-1].count++;
        });
        mSpans.forEach(ms => trMonat += `<th colspan="${ms.count}">${ms.label}</th>`);
        kwSpans.forEach(ks => trKW += `<th colspan="${ks.count}">${ks.label}</th>`);
        dateArray.forEach(d => {
            let iso = d.toISOString().split('T')[0];
            trTage += `<th id="th-${iso}" class="${d.getDay()===1?'monday-start':''}"><div class="day-num">${d.getDate()}</div><div class="day-short">${d.toLocaleString('de-DE',{weekday:'short'})}</div></th>`;
        });
        thead.innerHTML = trMonat + `</tr>` + trKW + `</tr>` + trTage + `</tr>`;
        baseFlottenListe.forEach(w => {
            let sf = w.replace(/\s+/g,'_');
            let rw = `<tr id="row_${sf}" class="worker-row is-active"><td><div class="bus-ctrl" style="display:flex; justify-content:space-between; align-items:center;"><span>${w}</span><button class="toggle-btn ${deactivatedBuses.includes(sf)?'inactive':'active'}" onclick="toggleBusState('${sf}')"></button></div></td>`;
            dateArray.forEach(d => {
                let iso = d.toISOString().split('T')[0];
                rw += `<td id="CELL_${sf}_${iso}" class="project-cell${(d.getDay()===1?' monday-start':'')}" data-date-ts="${d.getTime()}"></td>`;
            });
            tbody.insertAdjacentHTML('beforeend', rw + `</tr>`);
        });
        let fRow = `<tr class="stat-row"><td>AGGREGATE</td>`;
        dateArray.forEach(d => fRow += `<td id="COUNT_${d.toISOString().split('T')[0]}">0</td>`);
        tbody.insertAdjacentHTML('beforeend', fRow + `</tr>`);
    }

    function toggleBusState(sid) {
        if(!canPlan()) return showToast('ERR_AUTH', 'error');
        if(isAppLockedForEditing) return showToast('Sperre aktiv', 'warn');
        const isNowOffline = !deactivatedBuses.includes(sid);
        if(isNowOffline) { deactivatedBuses.push(sid); document.getElementById('row_'+sid).classList.replace('is-active','is-offline'); }
        else { deactivatedBuses=deactivatedBuses.filter(v=>v!==sid); document.getElementById('row_'+sid).classList.replace('is-offline','is-active'); }
        solproSupa.from('fleet_status').upsert({ bus_id: sid, is_offline: isNowOffline });
        fullGridRepaintUI_Logic();
    }

    function setupMouseDragPainting() {
        document.addEventListener('mousedown', e => {
            if (e.target.classList.contains('project-cell') && e.button === 0) {
                if(isAppLockedForEditing || !canPlan()) return;
                isDrawing = true; selectedCells = [e.target.id]; e.target.classList.add('selecting'); e.target.style.outline = "1px solid #fff";
            }
        });
        document.addEventListener('mouseover', e => { 
            if(isDrawing && e.target.classList.contains('project-cell') && !selectedCells.includes(e.target.id)) { 
                selectedCells.push(e.target.id); e.target.classList.add('selecting'); e.target.style.outline = "1px solid #fff";
            } 
        });
        document.addEventListener('mouseup', e => { 
            if(isDrawing && e.button === 0 && selectedCells.length > 0) { verarbeiteMalerZugAufGrid(); } 
            document.querySelectorAll('.selecting').forEach(nd => { nd.classList.remove('selecting'); nd.style.outline=""; }); isDrawing = false; 
        });
    }

    async function verarbeiteMalerZugAufGrid() {
        for(let cid of selectedCells) {
            if(activeProjectId === "ERASER") {
                delete plannerGrid[cid];
                await solproSupa.from('planner_grid').delete().eq('cell_id', cid);
            } else {
                plannerGrid[cid] = activeProjectId;
                await solproSupa.from('planner_grid').upsert({ cell_id: cid, project_id: activeProjectId });
            }
        }
        fullGridRepaintUI_Logic(); renderProjectsToTopPalette(); selectedCells = [];
    }

    function renderProjectsToTopPalette() {
        let container = document.getElementById('paletteUI');
        if(!container) return;
        container.innerHTML = canPlan() ? `<button class="btn-add" onclick="oeffneProjectCreatorModal()">+</button>` : '';
        projects.forEach(p => {
            let counts = Object.keys(plannerGrid).filter(k => plannerGrid[k] === p.id).length;
            let el = document.createElement('div');
            el.className = `palette-item ${activeProjectId === p.id ? 'active' : ''}`;
            el.innerHTML = `<div class="palette-color-dot" style="background:${p.color}; width:6px; height:6px; border-radius:0;"></div><b>${p.name}</b> <span style="opacity:0.5;">${counts}T</span>`;
            el.onclick = () => { activeProjectId = p.id; renderProjectsToTopPalette(); };
            // Edit on right click
            el.oncontextmenu = (e) => { 
                e.preventDefault(); 
                if(!canPlan()) return;
                document.getElementById('palEditId').value = p.id; 
                document.getElementById('palNameInput').value = p.name; 
                document.getElementById('palKwpInput').value = p.kwp || 0; 
                document.getElementById('palColorInput').value = p.color; 
                document.getElementById('palDelBtn').style.display = canDelete() ? "block" : "none"; 
                document.getElementById('pModalTitle').innerText = "EDIT_CONFIG"; 
                openPaletteModal(); 
            };
            container.appendChild(el);
        });
        [{ id: 'ERASER', label: 'ERASER', c: '#fff' }, { id: 'SYS_VACATION', label: 'OFFLINE', c: '#D4FF00' }].forEach(t => {
            let el = document.createElement('div'); el.className = `palette-item ${(activeProjectId === t.id ? 'active' : '')}`; 
            el.innerHTML = `<div class="palette-color-dot" style="background:${t.c}; width:6px; height:6px; border-radius:0;"></div><b>${t.label}</b>`;
            el.onclick = () => { activeProjectId = t.id; renderProjectsToTopPalette(); };
            container.appendChild(el);
        });
    }

    function oeffneProjectCreatorModal() {
        if(!canPlan()) return showToast('ERR_AUTH', 'error');
        if(isAppLockedForEditing) return;
        document.getElementById('pModalTitle').innerText = "NEW_PROJECT"; 
        document.getElementById('palEditId').value = ""; 
        document.getElementById('palNameInput').value = ""; 
        document.getElementById('palKwpInput').value = ""; 
        document.getElementById('palDelBtn').style.display = 'none';
        openPaletteModal();
    }

    async function savePaletteItem() {
        let name = document.getElementById('palNameInput').value.trim(); 
        let kwp = parseFloat(document.getElementById('palKwpInput').value) || 0;
        let id = document.getElementById('palEditId').value;
        if(!name) return showToast('ERR_DATA_MISSING', 'error');
        
        let projData = { name, kwp, color: document.getElementById('palColorInput').value };
        if(id) {
            projData.id = id;
            await solproSupa.from('projects').upsert(projData);
        } else {
            const { data } = await solproSupa.from('projects').insert([projData]).select().single();
            projects.push(data);
            activeProjectId = data.id;
        }
        closeModals(); await refreshAllData(); renderProjectsToTopPalette();
    }

    async function deletePaletteItem() {
        if(!canDelete()) return;
        let id = document.getElementById('palEditId').value; 
        await solproSupa.from('projects').delete().eq('id', id);
        await solproSupa.from('planner_grid').delete().eq('project_id', id);
        closeModals(); await refreshAllData(); renderProjectsToTopPalette();
    }

    async function openUserManagement() {
        if(userRole !== 'admin') return;
        const { data: users } = await solproSupa.from('profiles').select('*');
        const userListDiv = document.getElementById('userList');
        userListDiv.innerHTML = '';
        users.forEach(u => {
            const row = document.createElement('div');
            row.className = 'user-row';
            row.innerHTML = `<span style="font-family:var(--font-mono);">${u.email}</span><select onchange="updateUserRole('${u.id}', this.value)">
                <option value="viewer" ${u.role === 'viewer' ? 'selected' : ''}>VIEWER</option>
                <option value="editor" ${u.role === 'editor' ? 'selected' : ''}>EDITOR</option>
                <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>ADMIN</option>
            </select>`;
            userListDiv.appendChild(row);
        });
        document.getElementById('p_overlay').style.display = 'block';
        document.getElementById('userModal').style.display = 'block';
        setTimeout(() => document.getElementById('userModal').classList.add('show'), 10);
    }

    async function updateUserRole(userId, newRole) {
        await solproSupa.from('profiles').update({ role: newRole }).eq('id', userId);
        showToast(`ROLE_UPDATE_OK`, "success");
    }

    function setupGlobalUiHandlers() {
        document.addEventListener('click', e => { if(!e.target.closest('.menu-wrap')) closeMenus(); });
    }
    function closeModals() {
        document.querySelectorAll('.modal').forEach(m => { m.classList.remove('show'); setTimeout(()=>m.style.display='none', 200); });
        document.getElementById('p_overlay').style.//display = 'none';
    }
    function openPaletteModal() {
        document.getElementById('p_overlay').style.display = 'block';
        const m = document.getElementById('paletteModal');
        // Fix: manual show
        m.style.display = 'block';
        setTimeout(() => m.classList.add('show'), 10);
    }
    function toggleSystemLock() {
        if(!canPlan()) return;
        isAppLockedForEditing = !isAppLockedForEditing; 
        let btn = document.getElementById('lockStateBtn');
        if(isAppLockedForEditing){ btn.className = 'btn readonly'; btn.innerText = 'READ_ONLY'; }
        else { btn.className = 'btn primary'; btn.innerText = 'PLAN_MODE'; }
    }
    function fullGridRepaintUI_Logic() {
        document.querySelectorAll('.project-cell').forEach(c => { c.style.backgroundColor="transparent"; c.innerText=""; });
        Object.keys(plannerGrid).forEach(k => {
            let p = projects.find(x=>x.id===plannerGrid[k]); let cell = document.getElementById(k);
            if(!cell) return;
            if(plannerGrid[k] === "SYS_VACATION") { cell.style.background="repeating-linear-gradient(45deg, #0a0a0a, #0a0a0a 8px, #000 8px, #000 16px)"; cell.innerText="OFF"; cell.style.color = "var(--text-muted)"; return; }
            if(p) { cell.style.backgroundColor=p.color; cell.innerText=p.name; cell.style.color="#000"; }
        });
        evalDashboardMathemations();
    }
    function evalDashboardMathemations() {
        let netWork=0, lost=0, maxPossible=0;
        let activeBuses = baseFlottenListe.length - deactivatedBuses.length;
        document.querySelectorAll('[id^="COUNT_"]').forEach(f => {
            let dt = f.id.replace('COUNT_','');
            let dayLost=0, dayWork=0;
            Object.keys(plannerGrid).forEach(k => { if(k.includes(dt) && !deactivatedBuses.some(b=>k.includes(b))) { if(plannerGrid[k] === "SYS_VACATION") dayLost++; else dayWork++; } });
            let capThisDay = activeBuses - dayLost; netWork += dayWork; lost += dayLost; maxPossible += (capThisDay > 0 ? capThisDay : 0);
            f.innerText = dayWork + "/" + (capThisDay > 0 ? capThisDay : 0);
            f.style.color = (capThisDay > 0 && dayWork >= capThisDay) ? "var(--volt)" : "var(--text-muted)";
        });
        let rate = maxPossible > 0 ? Math.round((netWork/maxPossible)*100) : 0;
        document.getElementById('kpiCapRate').innerText = rate + "%";
        document.getElementById('kpiTotalDays').innerText = netWork + " T";
        let totalKwp = 0;
        new Set(Object.values(plannerGrid)).forEach(pid => {
            let p = projects.find(x => x.id === pid);
            if(p) totalKwp += (p.kwp || 0);
        });
        document.getElementById('kpiTotalKwp').innerHTML = totalKwp + " <small>KWP</small>";
    }
    function getKalenderWocheMath(d){ let x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()+4-(x.getDay()||7)); return Math.ceil((((x-new Date(x.getFullYear(),0,1))/86400000)+1)/7); }
    function showToast(msg, type) {
        const stack = document.getElementById('toastStack');
        const t = document.createElement('div'); t.className = `toast`; t.style.borderColor = type === 'success' ? 'var(--volt)' : 'var(--danger)';
        t.innerText = msg; stack.appendChild(t);
        requestAnimationFrame(()=>t.classList.add('show'));
        setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 300); }, 3000);
    }
    function switchView(view) {
        document.querySelectorAll('.view-layer').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`view-${view}`).classList.add('active');
        document.getElementById(`tab-${view}`).classList.add('active');
    }
    function handleLogout() { solproSupa.auth.signOut(); window.location.reload(); }
</script>
