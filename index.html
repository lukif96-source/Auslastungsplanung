<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12110F">
<title>SOLPRO · Suite v2</title>

<style>
:root {
  --cream: #F7F4EE; --cream-deep: #EDE9DF; --ink: #12110F; --ink-mid: #3a3730;
  --ink-muted: #8a8478; --lime: #B8D84B; --lime-dk: #8faa2c; --lime-glow: rgba(184,216,75,0.22);
  --gold: #D4A017; --danger: #C8303A; --danger-bg: rgba(200,48,58,0.08);
  --success: #1A7A4A; --warn: #B86A10; --info: #2563eb;
  --glass-bg: rgba(247,244,238,0.55); --glass-bg-heavy: rgba(247,244,238,0.82);
  --glass-border: rgba(255,255,255,0.70);
  --glass-shadow: 0 8px 32px rgba(18,17,15,0.12), 0 1.5px 0 rgba(255,255,255,0.6) inset;
  --glass-shadow-lg: 0 20px 60px rgba(18,17,15,0.18), 0 1.5px 0 rgba(255,255,255,0.55) inset;
  --blur: 18px; --radius: 12px; --radius-sm: 7px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;user-select:none}
body{background-image:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(184,216,75,0.12) 0%,transparent 70%),radial-gradient(ellipse 60% 40% at 100% 100%,rgba(212,160,23,0.07) 0%,transparent 60%)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}

#loader{position:fixed;inset:0;z-index:99999;background:rgba(18,17,15,0.75);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px}
#loader.show{display:flex}
.spinner{width:48px;height:48px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--lime);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.topbar{position:relative;z-index:200;flex-shrink:0;min-height:60px;background:var(--glass-bg-heavy);border-bottom:1px solid var(--glass-border);display:flex;align-items:center;padding:0 20px;gap:12px}
.logo{font-size:20px;font-weight:800;letter-spacing:-.5px;color:var(--ink);white-space:nowrap}
.logo span{color:var(--lime-dk)}
.topbar-spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:30px;font-size:11px;font-weight:600;cursor:pointer}
.user-avatar{width:24px;height:24px;border-radius:50%;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}

.tab-nav{position:relative;z-index:190;flex-shrink:0;display:flex;background:var(--glass-bg);border-bottom:1px solid var(--glass-border);overflow-x:auto}
.tab{padding:12px 16px;font-size:11px;font-weight:700;cursor:pointer;color:var(--ink-muted);border-bottom:2.5px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap}
.tab.active{color:var(--ink);border-color:var(--lime-dk)}

.app-main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow:auto;padding:20px}
.view.active{display:block}

.container{max-width:1200px;margin:0 auto}
h1{font-size:24px;font-weight:800;margin-bottom:20px}

.card{background:var(--glass-bg-heavy);border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--glass-shadow)}

.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:10px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 12px;border:1.5px solid var(--cream-deep);border-radius:var(--radius-sm);background:rgba(255,255,255,0.7);font-size:14px;color:var(--ink);outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--lime-dk);box-shadow:0 0 0 3px var(--lime-glow)}

.btn{background:var(--glass-bg);border:1px solid var(--glass-border);padding:10px 16px;font-size:11px;font-weight:700;border-radius:var(--radius-sm);color:var(--ink);text-transform:uppercase;letter-spacing:.3px;cursor:pointer}
.btn:hover{background:var(--cream-deep)}
.btn.primary{background:var(--ink);color:var(--lime);border-color:var(--ink)}
.btn.primary:hover{background:var(--ink-mid)}

.auth-overlay{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(18,17,15,0.6);backdrop-filter:blur(24px)}
.auth-card{background:var(--glass-bg-heavy);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow-lg);backdrop-filter:blur(var(--blur));border-radius:20px;padding:36px 32px;width:400px}
.auth-logo{font-size:32px;font-weight:800;letter-spacing:-1px;margin-bottom:4px}
.auth-logo span{color:var(--lime-dk)}
.auth-sub{font-size:11px;color:var(--ink-muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:28px}
.auth-tabs{display:flex;gap:0;margin-bottom:18px;background:var(--cream-deep);border-radius:8px;padding:3px}
.auth-tab{flex:1;padding:9px;border-radius:6px;font-size:11px;font-weight:700;color:var(--ink-muted);background:transparent;border:none;cursor:pointer;letter-spacing:.3px;text-transform:uppercase}
.auth-tab.active{background:var(--ink);color:var(--lime)}
.auth-field-lbl{font-size:10px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.5px;display:block;text-align:left;margin-bottom:5px;margin-top:14px}
.auth-input{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--cream-deep);background:rgba(255,255,255,0.7);font-size:13px;font-weight:500;color:var(--ink);outline:none}
.auth-input:focus{border-color:var(--lime-dk);box-shadow:0 0 0 3px var(--lime-glow)}
.auth-btn{width:100%;margin-top:22px;padding:14px;background:var(--ink);color:var(--lime);border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:800;cursor:pointer}
.auth-btn:hover{background:var(--ink-mid)}
.auth-status{margin-top:12px;font-size:11px;color:var(--danger);min-height:16px}
.auth-status.success{color:var(--success)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.grid-item{background:var(--glass-bg-heavy);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;transition:transform .15s}
.grid-item:hover{transform:translateY(-2px)}

#authOverlay{display:flex}
.topbar, .tab-nav, .app-main{display:none}
</style>
</head>
<body>

<!-- AUTH -->
<div id="authOverlay" class="auth-overlay">
  <div class="auth-card">
    <div class="auth-logo">SOL<span>PRO</span></div>
    <div class="auth-sub">Suite v2</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="authTabLogin">Anmelden</button>
      <button class="auth-tab" id="authTabSignup">Registrieren</button>
    </div>

    <div id="authLogin">
      <label class="auth-field-lbl">E-Mail</label>
      <input class="auth-input" type="email" id="authEmail" placeholder="deine@email.at">
      <label class="auth-field-lbl">Passwort</label>
      <input class="auth-input" type="password" id="authPassword" placeholder="••••••••">
      <button class="auth-btn" id="authLoginBtn">Anmelden</button>
      <div class="auth-status" id="authStatus"></div>
    </div>

    <div id="authSignup" style="display:none">
      <label class="auth-field-lbl">Name</label>
      <input class="auth-input" type="text" id="authSignupName" placeholder="Dein Name">
      <label class="auth-field-lbl">E-Mail</label>
      <input class="auth-input" type="email" id="authSignupEmail" placeholder="deine@email.at">
      <label class="auth-field-lbl">Passwort</label>
      <input class="auth-input" type="password" id="authSignupPassword" placeholder="••••••••">
      <button class="auth-btn" id="authSignupBtn">Registrieren</button>
      <div class="auth-status" id="authStatusSignup"></div>
    </div>
  </div>
</div>

<div id="loader"><div class="spinner"></div><div>Lade Suite…</div></div>

<!-- TOP BAR -->
<div class="topbar" id="topbar">
  <div class="logo">SOL<span>PRO</span></div>
  <div class="topbar-spacer"></div>
  <div class="user-chip" id="userChip">
    <div class="user-avatar" id="userAvatar">U</div>
    <span id="userName">User</span>
  </div>
  <button class="btn" onclick="logout()">Logout</button>
</div>

<!-- TABS -->
<div class="tab-nav" id="tabNav">
  <div class="tab active" onclick="switchTab('home')">📅 Startseite</div>
  <div class="tab" onclick="switchTab('projects')">📋 Projekte</div>
  <div class="tab" onclick="switchTab('customers')">👥 Kunden</div>
</div>

<!-- MAIN -->
<div class="app-main">
  <div id="view-home" class="view active">
    <div class="container">
      <h1>Willkommen in SOLPRO Suite</h1>
      <div class="card">
        <h2>System-Status</h2>
        <p>✅ Supabase Verbindung aktiv</p>
        <p>✅ Datenbank erreichbar</p>
        <p id="statusMsg"></p>
      </div>
    </div>
  </div>

  <div id="view-projects" class="view">
    <div class="container">
      <h1>Projekte</h1>
      <button class="btn primary" onclick="addProject()">+ Neues Projekt</button>
      <div id="projectsList" class="grid" style="margin-top:20px"></div>
    </div>
  </div>

  <div id="view-customers" class="view">
    <div class="container">
      <h1>Kunden</h1>
      <button class="btn primary" onclick="addCustomer()">+ Neuer Kunde</button>
      <div id="customersList" class="grid" style="margin-top:20px"></div>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://iuxklqcpexoziqxrohwa.supabase.co';
const API_KEY = 'sb_publishable_VteOTQ6g28z9Dvo-QUG8jw_hehaZpWu';

let currentUser = null;

// Auth Tab Switching
document.getElementById('authTabLogin').onclick = () => {
  document.getElementById('authTabLogin').classList.add('active');
  document.getElementById('authTabSignup').classList.remove('active');
  document.getElementById('authLogin').style.display = '';
  document.getElementById('authSignup').style.display = 'none';
};

document.getElementById('authTabSignup').onclick = () => {
  document.getElementById('authTabSignup').classList.add('active');
  document.getElementById('authTabLogin').classList.remove('active');
  document.getElementById('authLogin').style.display = 'none';
  document.getElementById('authSignup').style.display = '';
};

// LOGIN
document.getElementById('authLoginBtn').onclick = async () => {
  const email = document.getElementById('authEmail').value.trim();
  const pw = document.getElementById('authPassword').value;
  const status = document.getElementById('authStatus');
  
  if (!email || !pw) {
    status.textContent = 'E-Mail und Passwort erforderlich';
    return;
  }
  
  status.textContent = 'Anmelden…';
  status.className = 'auth-status';
  
  try {
    // Einfache Mock-Auth für Demo
    currentUser = { id: 'demo-' + Date.now(), email, name: email.split('@')[0] };
    status.textContent = '';
    status.className = 'auth-status success';
    showApp();
  } catch (e) {
    status.textContent = 'Anmeldefehler: ' + e.message;
  }
};

// SIGNUP
document.getElementById('authSignupBtn').onclick = async () => {
  const name = document.getElementById('authSignupName').value.trim();
  const email = document.getElementById('authSignupEmail').value.trim();
  const pw = document.getElementById('authSignupPassword').value;
  const status = document.getElementById('authStatusSignup');
  
  if (!name || !email || !pw) {
    status.textContent = 'Alle Felder erforderlich';
    return;
  }
  
  if (pw.length < 6) {
    status.textContent = 'Passwort min. 6 Zeichen';
    return;
  }
  
  status.textContent = 'Registriere…';
  status.className = 'auth-status';
  
  try {
    currentUser = { id: 'demo-' + Date.now(), email, name };
    status.textContent = '';
    status.className = 'auth-status success';
    showApp();
  } catch (e) {
    status.textContent = 'Registrierungsfehler: ' + e.message;
  }
};

function showApp() {
  document.getElementById('authOverlay').style.display = 'none';
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('tabNav').style.display = 'flex';
  document.getElementById('userName').textContent = currentUser.name;
  document.getElementById('userAvatar').textContent = currentUser.name[0].toUpperCase();
  document.getElementById('statusMsg').innerHTML = `<strong>Benutzer:</strong> ${currentUser.email}`;
  loadProjects();
  loadCustomers();
}

function logout() {
  currentUser = null;
  document.getElementById('authOverlay').style.display = 'flex';
  document.getElementById('topbar').style.display = 'none';
  document.getElementById('tabNav').style.display = 'none';
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
}

async function loadProjects() {
  try {
    const response = await fetch(`${API_URL}/rest/v1/projects?select=*`, {
      headers: { 'apikey': API_KEY }
    });
    const projects = await response.json();
    const list = document.getElementById('projectsList');
    list.innerHTML = projects.map(p => `
      <div class="grid-item">
        <strong>${p.name || 'Projekt'}</strong>
        <p>${p.status || 'Keine Info'}</p>
      </div>
    `).join('');
  } catch (e) {
    console.error('Fehler beim Laden:', e);
  }
}

async function loadCustomers() {
  try {
    const response = await fetch(`${API_URL}/rest/v1/customers?select=*`, {
      headers: { 'apikey': API_KEY }
    });
    const customers = await response.json();
    const list = document.getElementById('customersList');
    list.innerHTML = customers.map(c => `
      <div class="grid-item">
        <strong>${c.name || 'Kunde'}</strong>
        <p>${c.email || 'Keine Email'}</p>
      </div>
    `).join('');
  } catch (e) {
    console.error('Fehler beim Laden:', e);
  }
}

function addProject() {
  alert('Neues Projekt hinzufügen (Demo)');
}

function addCustomer() {
  alert('Neuer Kunde hinzufügen (Demo)');
}
</script>

</body>
</html>
