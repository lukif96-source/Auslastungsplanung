        .btn.btn-danger { background: #fff; border-color: var(--border); color: var(--slate-700); }

        .overlay { position: fixed; inset: 0; background: rgba(10,14,26,0.55); backdrop-filter: blur(2px); z-index: 5000; display: none; }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(.97); opacity: 0; background: #fff; padding: 24px; border-radius: 14px; display: none; z-index: 5001; width: 300px; box-shadow: 0 20px 50px rgba(10,14,26,0.35); transition: transform .15s ease-out, opacity .15s ease-out; }

        while(currentDay <= endDate) { if(currentDay.getDay()!==0 && currentDay.getDay()!==6) dateArray.push(new Date(currentDay)); currentDay.setDate(currentDay.getDate()+1); }
        let trMonat = `<tr><th rowspan="3" class="fixed-corner"><div class="logo">SOL<span>PRO</span></div></th>`;
        let trKW = `<tr>`, trTage = `<tr>`;
        let lastM=-1, mSpans=[], lastKW=-1, kwSpans=[];
        dateArray.forEach(d => {
            let m=d.getMonth(), kw=getKalenderWocheMath(d);
            if(m!==lastM){ mSpans.push({label:d.toLocaleString('de-DE',{month:'long'}).toUpperCase(), count:1}); lastM=m; } else mSpans[mSpans.length-1].count++;
            if(kw!==lastKW){ kwSpans.push({label:'KW '+kw, count:1}); lastKW=kw; } else kwSpans[kwSpans.length-1].count++;
        });
        mSpans.forEach(ms => trMonat += `<th colspan="${ms.count}">${ms.label}</th>`);
        kwSpans.forEach(ks => trKW += `<th colspan="${ks.count}">${ks.label}</th>`);
        dateArray.forEach(d => {
            let iso = d.toISOString().split('T')[0];
            trTage += `<th id="th-${iso}" class="${d.getDay()===1?'monday-start':''}"><div class="day-num">${d.getDate()}</div><div class="day-short">${d.toLocaleString('de-DE',{weekday:'short'})}</div></th>`;
        });
        thead.innerHTML = trMonat + `</tr>` + trKW + `</tr>` + trTage + `</tr>`;
        baseFlottenListe.forEach(w => {
            let sf = w.replace(/\s+/g,'_');
            let rw = `<tr id="row_${sf}" class="worker-row is-active"><td><div class="worker-controls"><span>${w}</span><button title="Ausfall" onclick="toggleBusState('${sf}')" class="toggle-btn"></button></div></td>`;
            dateArray.forEach(d => {
                let iso = d.toISOString().split('T')[0];
                rw += `<td id="CELL_${sf}_${iso}" class="project-cell${(d.getDay()===1?' monday-start':'')}" data-date-ts="${d.getTime()}"></td>`;
            });
            tbody.insertAdjacentHTML('beforeend', rw + `</tr>`);
        });
        let fRow = `<tr class="stat-row"><td>LEISTUNG</td>`;
        dateArray.forEach(d => fRow += `<td id="COUNT_${d.toISOString().split('T')[0]}">0</td>`);
        tbody.insertAdjacentHTML('beforeend', fRow + `</tr>`);
        
        loadDataFromBrowser(); 
        await loadDataFromCloud();
        
        renderProjectsToTopPalette(); setupMouseDragPainting(); setupGlobalUiHandlers();
        updateAutosaveIndicator();
        window.addEventListener('beforeunload', e => {
            if(hatUngesicherteAenderungen()) { e.preventDefault(); e.returnValue = ''; return ''; }
        });
    }

    async function loadDataFromCloud() {
        try {
            const response = await fetch(JSONBIN_URL, {
                headers: { 'X-Master-Key': API_KEY }
            });
            const data = await response.json();
            const cloudDb = data.record;
            if(cloudDb && cloudDb.dbP) {
                projects = cloudDb.dbP;
                plannerGrid = cloudDb.dbGrid;
                deactivatedBuses = cloudDb.dbOff;
                
                localStorage.setItem("SOLPRO_EXEC_DB_5", JSON.stringify({ dbP: projects, dbGrid: plannerGrid, dbOff: deactivatedBuses }));
                fullGridRepaintUI_Logic();
                renderProjectsToTopPalette();
                showToast('Cloud-Daten synchronisiert', 'success');
            }
        } catch (e) {
            console.error("Cloud Load Error:", e);
            showToast('Cloud-Verbindung fehlgeschlagen', 'warn');
        }
    }

    async function syncToCloud() {
        const dataToSave = { dbP: projects, dbGrid: plannerGrid, dbOff: deactivatedBuses };
        try {
            await fetch(JSONBIN_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(dataToSave)
            });
            markiereAlsGesichert();
        } catch (e) {
            console.error("Cloud Save Error:", e);
            showToast('Cloud-Speicher Fehler!', 'error');
        }
    }

    function toggleSystemLock() {
        isAppLockedForEditing = !isAppLockedForEditing; let btn = document.getElementById('lockStateBtn');
        if(isAppLockedForEditing){ document.body.classList.add('read-only-mode'); btn.className='btn mode-switch readonly'; btn.innerText='🔒 Nur Lesen'; }
        else { document.body.classList.remove('read-only-mode'); btn.className='btn mode-switch planning'; btn.innerText='✏️ Planen'; }
    }

    function toggleBusState(sid) {
       if(isAppLockedForEditing) return showToast('Zuerst Sperre lösen', 'warn');
       if(deactivatedBuses.includes(sid)) { deactivatedBuses=deactivatedBuses.filter(v=>v!==sid); document.getElementById('row_'+sid).classList.replace('is-offline','is-active'); }
       else { deactivatedBuses.push(sid); document.getElementById('row_'+sid).classList.replace('is-active','is-offline'); }
       syncLocalSystemSpeichern(); fullGridRepaintUI_Logic();
    }

    function setupMouseDragPainting() {
        document.addEventListener('mousedown', e => {
            if (e.target.classList.contains('project-cell') && e.button === 2) {
                if(isAppLockedForEditing) return; e.preventDefault(); selectedCellDomID = e.target.id;
                bautHtmlFurDasActionContextMenu(); let cm=document.getElementById('actionGridCtx'); cm.style.display="block"; cm.style.left=e.clientX+"px"; cm.style.top=e.clientY+"px"; return;
            }
            if (e.target.classList.contains('project-cell') && e.button === 0) {
                if(isAppLockedForEditing || !activeProjectId) return;
                isDrawing = true; selectedCells = [e.target.id]; e.target.classList.add('selecting');
            }
        });
        document.addEventListener('mouseover', e => { if(isDrawing && e.target.classList.contains('project-cell') && !selectedCells.includes(e.target.id)) { selectedCells.push(e.target.id); e.target.classList.add('selecting'); } });
        document.addEventListener('mouseup', e => { if(isDrawing && e.button === 0 && selectedCells.length > 0) { verarbeiteMalerZugAufGrid(); } document.querySelectorAll('.selecting').forEach(nd => nd.classList.remove('selecting')); isDrawing = false; });
        document.addEventListener('contextmenu', e => { if (e.target.classList.contains('project-cell')) e.preventDefault(); });
    }

    function setupGlobalUiHandlers() {
        document.addEventListener('click', e => {
            if(!e.target.closest('.menu-wrap')) closeMenus();
            if(!e.target.closest('#actionGridCtx')) document.getElementById('actionGridCtx').style.display = 'none';
            if(!e.target.closest('#palCtxMenu') && !e.target.closest('.palette-item')) document.getElementById('palCtxMenu').style.display = 'none';
        });
        document.addEventListener('keydown', e => { if(e.key === 'Escape') { closeMenus(); closePaletteModal(); document.getElementById('actionGridCtx').style.display='none'; document.getElementById('palCtxMenu').style.display='none'; } });
    }

    function verarbeiteMalerZugAufGrid() {
        selectedCells.forEach(cid => {
             if(activeProjectId === "ERASER") delete plannerGrid[cid];
             else if(activeProjectId === "SYS_VACATION") plannerGrid[cid] = "SYS_VACATION";
             else plannerGrid[cid] = activeProjectId;
        });
        syncLocalSystemSpeichern(); fullGridRepaintUI_Logic(); renderProjectsToTopPalette(); selectedCells = [];
    }

    function bautHtmlFurDasActionContextMenu() {
        let ActionPanel = document.getElementById('actionGridCtx');
        let prj = projects.find(p => p.id === activeProjectId);
        let content = `
            ${(activeProjectId !== 'ERASER' && activeProjectId !== 'SYS_VACATION' && prj)
            ? `<button onclick="fireAction('FILL_PROJECT')"><span>🚀</span> <b style="color:${prj.color};">Woche ${prj.name} zuweisen</b></button><hr>` : ''}
            <button onclick="fireAction('FILL_URLAUB')"><span>🌴</span> Ganze KW auf Urlaub</button>
            <hr>
            <button onclick="fireAction('DELETE_WEEK')" class="danger-text"><span>🔥</span> Woche löschen</button>
            <button onclick="fireAction('DELETE_CELL')" class="danger-text"><span>🗑️</span> Tag löschen</button>
        `;
        ActionPanel.innerHTML = content;
    }

    function fireAction(cmd) {
        document.getElementById('actionGridCtx').style.display = 'none';
        if(!selectedCellDomID) return;
        if(cmd === 'DELETE_CELL') { delete plannerGrid[selectedCellDomID]; syncLocalSystemSpeichern(); fullGridRepaintUI_Logic(); renderProjectsToTopPalette(); return; }
        let parts = selectedCellDomID.split('_');
        let targetDateStr = parts.pop(); parts.shift();
        let targetBusID = parts.join('_');
        let targetKW = getKalenderWocheMath(new Date(targetDateStr));
        document.querySelectorAll(`.project-cell`).forEach(cell => {
            if(cell.id.includes(targetBusID)) {
                let cellKW = getKalenderWocheMath(new Date(Number(cell.getAttribute('data-date-ts'))));
                if(cellKW === targetKW) {
                    if(cmd === 'DELETE_WEEK') delete plannerGrid[cell.id];
                    if(cmd === 'FILL_URLAUB') plannerGrid[cell.id] = "SYS_VACATION";
                    if(cmd === 'FILL_PROJECT' && activeProjectId) plannerGrid[cell.id] = activeProjectId;
                }
            }
        });
        syncLocalSystemSpeichern(); fullGridRepaintUI_Logic(); renderProjectsToTopPalette();
    }

    function renderProjectsToTopPalette() {
        let container = document.getElementById('paletteUI');
        container.innerHTML = `<button class="btn-add" onclick="oeffneProjectCreatorModal()">+</button>`;
        projects.forEach(p => {
            let counts = Object.keys(plannerGrid).filter(k => plannerGrid[k] === p.id).length;
            let el = document.createElement('div');
            el.className = `palette-item ${activeProjectId === p.id ? 'active' : ''}`;
            el.style.backgroundColor = p.color; el.style.color = getLesbareTextfarbe(p.color);
            el.innerHTML = `<b>${p.name}</b> <span class="chip-days">${counts} T</span>`;
            el.onclick = () => { activeProjectId = p.id; renderProjectsToTopPalette(); };
            el.onmouseenter = () => { highlightTimer = setTimeout(()=>{ document.body.classList.add('spotlight-active'); Object.keys(plannerGrid).forEach(k=>{ if(plannerGrid[k]===p.id) document.getElementById(k)?.classList.add('spotlight-highlight'); }); }, 200); };
            el.onmouseleave = () => { clearTimeout(highlightTimer); document.body.classList.remove('spotlight-active'); document.querySelectorAll('.spotlight-highlight').forEach(n=>n.classList.remove('spotlight-highlight')); };
            el.oncontextmenu = (e) => { e.preventDefault(); e.stopPropagation(); if(isAppLockedForEditing) return; document.getElementById('palCtxMenu').style.display="block"; document.getElementById('palCtxMenu').style.left=e.clientX+"px"; document.getElementById('palCtxMenu').style.top=e.clientY+"px"; contextCtxMenuPID = p.id; };
            container.appendChild(el);
        });
        container.insertAdjacentHTML('beforeend', '<div class="palette-separator"></div>');
        [{ id: 'ERASER', label: '🧼 Radierer', cls: 'sys-eraser' }, { id: 'SYS_VACATION', label: '🌴 Urlaub', cls: 'sys-urlaub' }].forEach(t => {
            let el = document.createElement('div'); el.className = `palette-item tool-item ${t.cls} ${(activeProjectId === t.id ? 'active' : '')}`; el.innerText = t.label; el.onclick = () => { activeProjectId = t.id; renderProjectsToTopPalette(); };
            container.appendChild(el);
        });
    }

    function syncLocalSystemSpeichern() {
        localStorage.setItem("SOLPRO_EXEC_DB_5", JSON.stringify({ dbP: projects, dbGrid: plannerGrid, dbOff: deactivatedBuses }));
        localStorage.setItem("SOLPRO_LAST_CHANGE_TS", String(Date.now()));
        evalDashboardMathemations(); 
        updateAutosaveIndicator();
        syncToCloud(); // Sende Daten live in die Cloud
    }

    function hatUngesicherteAenderungen() {
        const changeTs = Number(localStorage.getItem("SOLPRO_LAST_CHANGE_TS") || 0);
        const backupTs = Number(localStorage.getItem("SOLPRO_LAST_BACKUP_TS") || 0);
        const hasData = projects.length > 0 || Object.keys(plannerGrid).length > 0 || deactivatedBuses.length > 0;
        return hasData && changeTs > backupTs;
    }
    function markiereAlsGesichert() { localStorage.setItem("SOLPRO_LAST_BACKUP_TS", String(Date.now())); updateAutosaveIndicator(); }
    function updateAutosaveIndicator() {
        const ind = document.getElementById('autosaveIndicator'); if(!ind) return;
        const pending = hatUngesicherteAenderungen();
        ind.classList.toggle('pending', pending);
        const now = new Date();
        const hh = String(now.getHours()).padStart(2,'0'), mm = String(now.getMinutes()).padStart(2,'0');
        document.getElementById('autosaveText').innerText = pending ? `Synchronisiere...` : `Cloud: ${hh}:${mm}`;
        document.getElementById('exportMenuBtn')?.classList.toggle('has-pending', pending);
    }
    function loadDataFromBrowser() {
        let raw = localStorage.getItem("SOLPRO_EXEC_DB_5");
        if(raw){ try { let data = JSON.parse(raw); projects = data.dbP || []; plannerGrid = data.dbGrid || {}; deactivatedBuses = data.dbOff || []; deactivatedBuses.forEach(b=> document.getElementById('row_'+b)?.classList.replace('is-active', 'is-offline')); fullGridRepaintUI_Logic(); } catch(e){} }
    }
    function fullGridRepaintUI_Logic() {
        document.querySelectorAll('.project-cell').forEach(c => { c.style.backgroundColor=""; c.style.color=""; c.innerText=""; c.title=""; c.classList.remove('grid-sys-vacation'); });
        Object.keys(plannerGrid).forEach(k => {
            let p = projects.find(x=>x.id===plannerGrid[k]); let cell = document.getElementById(k);
            if(!cell) { delete plannerGrid[k]; return; }
            if(plannerGrid[k] === "SYS_VACATION") { cell.classList.add('grid-sys-vacation'); cell.innerText="AUSFALL"; cell.title="Urlaub/Wartung"; return; }
            if(p) { cell.style.backgroundColor=p.color; cell.style.color=getLesbareTextfarbe(p.color); cell.innerText=p.name; cell.title=p.name; }
            else delete plannerGrid[k];
        }); evalDashboardMathemations();
    }

    function evalDashboardMathemations() {
        let netWork=0, lost=0, maxPossible=0;
        let activeBuses = baseFlottenListe.length - deactivatedBuses.length;
        document.querySelectorAll('[id^="COUNT_"]').forEach(f => {
            let dt = f.id.replace('COUNT_','');
            let dayLost=0, dayWork=0;
            Object.keys(plannerGrid).forEach(k => { if(k.includes(dt) && !deactivatedBuses.some(b=>k.includes(b))) { if(plannerGrid[k] === "SYS_VACATION") dayLost++; else dayWork++; } });
            let capThisDay = activeBuses - dayLost; netWork += dayWork; lost += dayLost; maxPossible += (capThisDay > 0 ? capThisDay : 0);
            if(capThisDay <= 0) { f.innerText="-"; f.style.color='gray'; }
            else { f.innerText = dayWork + " / " + capThisDay; f.style.color = dayWork >= capThisDay ? '#f87171' : '#34d399'; }
        });
        let rate = maxPossible > 0 ? Math.round((netWork/maxPossible)*100) : 0;
        document.getElementById('kpiCapRate').innerHTML = rate + "<span>%</span>";
        let bar = document.getElementById('kpiBarLine'); bar.style.width = rate + "%";
        document.getElementById('kpiGBlock').className = 'kpi-card ' + (rate >= 85 ? 'critical' : (rate >= 50 ? 'warn' : ''));
        document.getElementById('kpiTotalDays').innerHTML = netWork + " <span>T</span>";
        document.getElementById('kpiLostDays').innerHTML = lost + " <span>T</span>";

        // kWp Volumen Summe
        let totalKwp = 0;
        let uniqueProjectIds = new Set(Object.values(plannerGrid));
        uniqueProjectIds.forEach(pid => {
            if(pid !== "SYS_VACATION") {
                let p = projects.find(x => x.id === pid);
                if(p) totalKwp += (p.kwp || 0);
            }
        });
        document.getElementById('kpiTotalKwp').innerHTML = totalKwp + " <small>kWp</small>";
    }

    function exportDataJSON() {
        closeMenus();
        let data = localStorage.getItem("SOLPRO_EXEC_DB_5") || '{"dbP":[],"dbGrid":{},"dbOff":[]}';
        let stamp = new Date().toISOString().split('T')[0];

    function importDataJSON(e) {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = res => {
            try {
                let parsed = JSON.parse(res.target.result);
                if(!parsed || !Array.isArray(parsed.dbP) || typeof parsed.dbGrid !== 'object' || !Array.isArray(parsed.dbOff)) throw new Error('Ungültige Struktur');
                if(!confirm(`Backup enthält ${parsed.dbP.length} Projekte und ${Object.keys(parsed.dbGrid).length} Planungs-Einträge.\nDie aktuelle Planung wird ersetzt. Fortfahren?`)) { e.target.value=''; return; }
                localStorage.setItem("SOLPRO_EXEC_DB_5", res.target.result);
                localStorage.setItem("SOLPRO_LAST_CHANGE_TS", String(Date.now()));
                localStorage.setItem("SOLPRO_LAST_BACKUP_TS", String(Date.now()));
                showToast('Backup geladen – Seite wird neu geladen…', 'success');
                setTimeout(()=>window.location.reload(), 700);
            } catch(err) { showToast('Ungültige JSON-Datei', 'error'); }
            e.target.value = '';
        };
        reader.readAsText(file);
    }

    function exportToExcel() {
        closeMenus();
        if(typeof XLSX === 'undefined') { showToast('Excel-Bibliothek nicht verfügbar', 'error'); return; }
        const wsProjekte = XLSX.utils.json_to_sheet(projects.map(p => ({ ID: p.id, Name: p.name, Leistung: p.kwp, Farbe: p.color })));
        const planRows = [];
        Object.keys(plannerGrid).forEach(k => {
            const val = plannerGrid[k];
            const parts = k.split('_'); parts.shift();
            const date = parts.pop();
            const busSlug = parts.join('_');
            const isVac = val === 'SYS_VACATION';
            const proj = isVac ? null : projects.find(p => p.id === val);
            planRows.push({ Fahrzeug: busSlug.replace(/_/g,' '), Datum: date, Typ: isVac ? 'URLAUB' : 'PROJEKT', ProjektID: isVac ? '' : val, Projekt: isVac ? 'AUSFALL' : (proj ? proj.name : 'Unbekannt'), kWp: isVac ? 0 : (proj ? proj.kwp : 0) });
        });
        planRows.sort((a,b) => a.Fahrzeug.localeCompare(b.Fahrzeug) || a.Datum.localeCompare(b.Datum));
        const wsPlan = XLSX.utils.json_to_sheet(planRows);
        const wsAusfall = XLSX.utils.json_to_sheet(deactivatedBuses.map(b => ({ Fahrzeug: b.replace(/_/g,' ') })));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, wsProjekte, 'Projekte');
        XLSX.utils.book_append_sheet(wb, wsPlan, 'Planung');
        XLSX.utils.book_append_sheet(wb, wsAusfall, 'Ausfall_Fahrzeuge');
        const stamp = new Date().toISOString().split('T')[0];
        XLSX.writeFile(wb, `SOLPRO_Bericht_${stamp}.xlsx`);
        markiereAlsGesichert();
        showToast('Excel-Bericht exportiert', 'success');
    }

    function normalizeExcelDate(val) {
        if(val instanceof Date) { const y=val.getFullYear(), m=String(val.getMonth()+1).padStart(2,'0'), d=String(val.getDate()).padStart(2,'0'); return `${y}-${m}-${d}`; }
        if(typeof val === 'number' && window.XLSX && XLSX.SSF) { const dc = XLSX.SSF.parse_date_code(val); if(dc) return `${dc.y}-${String(dc.m).padStart(2,'0')}-${String(dc.d).padStart(2,'0')}`; }
        return String(val).trim().split('T')[0];
    }

    function importDataExcel(e) {
        const file = e.target.files[0]; if(!file) return;
        if(typeof XLSX === 'undefined') { showToast('Excel-Bibliothek nicht verfügbar', 'error'); e.target.value=''; return; }
        const reader = new FileReader();
        reader.onload = res => {
            try {
                const wb = XLSX.read(res.target.result, { type: 'binary', cellDates: true });
                const projSheet = wb.Sheets['Projekte'];
                const planSheet = wb.Sheets['Planung'];
                if(!projSheet || !planSheet) throw new Error('Tabellenblätter "Projekte" und "Planung" erforderlich');
                const projRows = XLSX.utils.sheet_to_json(projSheet);
                const planRows = XLSX.utils.sheet_to_json(planSheet);
                const ausfallSheet = wb.Sheets['Ausfall_Fahrzeuge'];
                const ausfallRows = ausfallSheet ? XLSX.utils.sheet_to_json(ausfallSheet) : [];

                if(!confirm(`Import gefunden: ${projRows.length} Projekte, ${planRows.length} Planungs-Einträge.\nDie aktuelle Planung wird ersetzt. Fortfahren?`)) { e.target.value=''; return; }

                const newProjects = projRows.filter(r => r.ID && r.Name).map(r => ({ id: String(r.ID), name: String(r.Name), color: r.Farbe || managementFarben[Math.floor(Math.random()*managementFarben.length)], kwp: r.Leistung || 0 }));
                const newGrid = {}; let skipped = 0;
                planRows.forEach(r => {
                    if(!r.Fahrzeug || !r.Datum) { skipped++; return; }
                    const busSlug = String(r.Fahrzeug).trim().replace(/\s+/g,'_');
                    const dateStr = normalizeExcelDate(r.Datum);
                    const cellId = `CELL_${busSlug}_${dateStr}`;
                    if(!document.getElementById(cellId)) { skipped++; return; }
                    const typ = String(r.Typ || '').toUpperCase();
                    if(typ.includes('URLAUB')) newGrid[cellId] = 'SYS_VACATION';
                    else if(r.ProjektID) newGrid[cellId] = String(r.ProjektID);
                    else skipped++;
                });
                const newOff = ausfallRows.map(r => r.Fahrzeug ? String(r.Fahrzeug).trim().replace(/\s+/g,'_') : null).filter(Boolean);

                localStorage.setItem("SOLPRO_EXEC_DB_5", JSON.stringify({ dbP: newProjects, dbGrid: newGrid, dbOff: newOff }));
                localStorage.setItem("SOLPRO_LAST_CHANGE_TS", String(Date.now()));
                localStorage.setItem("SOLPRO_LAST_BACKUP_TS", String(Date.now()));
                showToast(`Excel importiert${skipped ? ` (${skipped} Zeilen übersprungen)` : ''} – Seite wird neu geladen…`, skipped ? 'warn' : 'success');
                setTimeout(()=>window.location.reload(), 900);
            } catch(err) {
                showToast('Ungültige JSON-Datei', 'error'); }
            }
            e.target.value = '';
        };
        reader.readAsBinaryString(file);
    }

    function setView(m, b){ document.body.className=`view-${m}${isAppLockedForEditing ? ' read-only-mode' : ''}`; document.querySelectorAll('.controls .btn:not(.mode-switch)').forEach(x=>x.classList.remove('active')); b.classList.add(); }
    function getKalenderWocheMath(d){ let x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()+4-(x.getDay()||7)); return Math.ceil((((x-new Date(x.getFullYear(),0,1))/86400000)+1)/7); }
    function getLesbareTextfarbe(h){ h=h.replace('#',''); return (((parseInt(h.substr(0,2),16)*299)+(parseInt(h.substr(2,2),16)*587)+(parseInt(h.substr(4,2),16)*114))/1000)>=128?'#111':'#fff'; }
    function nuclearSystemReset() { if(isAppLockedForEditing) return; if(confirm("ALARM! Alles löschen?")) if(prompt("LÖSCHEN")==="LÖSCHEN") { localStorage.removeItem("SOLPRO_EXEC_DB_5"); window.location.reload(); } }
    init();
</script>
