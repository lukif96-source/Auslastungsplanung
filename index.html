<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLPRO | Executive V6.4 Enterprise</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap');

        :root {
            --sol-lime: #a4c639; --sol-lime-dk: #86a62d; --ink: #0a0e1a;
            --slate-900: #0c1526; --slate-800: #182238; --slate-700: #3c4a63;
            --slate-500: #64748b; --slate-200: #e2e8f0; --slate-100: #f3f5f8;
            --bg: #f7f8fa; --border: #e3e7ed; --danger: #e0483e; --danger-bg: #fdeceb;
            --success: #1f9d63; --success-bg: #e9f8f0; --warn: #d3960f; --warn-bg: #fdf3e0;
            --radius: 10px; --radius-sm: 6px; --font-mono: 'JetBrains Mono', monospace;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; margin: 0;
            overflow: hidden; display: flex; flex-direction: column; height: 100vh; user-select: none;
        }

        /* AUTH OVERLAYS */
        .auth-overlay {
            position: fixed; inset: 0; background: var(--slate-900); z-index: 10000;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px);
        }
        .auth-card {
            background: #fff; padding: 30px; border-radius: 15px; width: 380px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center;
        }
        .auth-card h2 { font-family: 'Orbitron'; margin-bottom: 20px; color: var(--slate-900); }
        .auth-card input { 
            width: 100%; padding: 12px; margin: 10px 0; border: 1px solid var(--border); 
            border-radius: var(--radius-sm); font-size: 14px; 
        }
        .auth-card button { 
            width: 100%; padding: 14px; margin-top: 20px; background: var(--sol-lime); border: none; 
            font-weight: 900; cursor: pointer; border-radius: var(--radius-sm); color: var(--ink);
            text-transform: uppercase; transition: 0.2s;
        }
        .auth-card button:hover { background: var(--sol-lime-dk); }

        /* HUD & Layout */
        .accent-line { height: 3px; background: linear-gradient(90deg, var(--sol-lime), #6fae1f, var(--slate-900) 140%); flex-shrink: 0; }
        .hud { height: 84px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 16px; box-shadow: 0 2px 12px rgba(10,14,26,0.05); z-index: 3000; flex-shrink: 0; }
        .brand-container { display: flex; flex-direction: column; flex-shrink: 0; }
        .logo { font-family: 'Orbitron'; font-size: 24px; font-weight: 900; color: var(--ink); line-height: 1; letter-spacing: 0.5px; }
        .logo span { color: var(--sol-lime-dk); }
        .tagline { font-size: 8px; letter-spacing: 3px; color: #9aa3af; font-weight: 700; margin-top: 5px; }

        .kpi-board { display: flex; gap: 8px; border-left: 1px solid var(--border); padding-left: 16px; flex-shrink: 0; }
        .kpi-card { background: var(--slate-100); padding: 6px 14px; border-radius: var(--radius-sm); min-width: 110px; border: 1px solid var(--border); position: relative; overflow: hidden; }
        .kpi-lbl { font-size: 8px; font-weight: 800; text-transform: uppercase; color: var(--slate-700); display: flex; align-items: center; gap: 4px; }
        .kpi-val { font-family: var(--font-mono); font-size: 18px; font-weight: 800; display: block; }
        .kpi-bar-track { height: 3px; width: 100%; background: var(--slate-200); border-radius: 3px; margin-top: 4px; overflow: hidden; }
        .kpi-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--sol-lime-dk), var(--sol-lime)); transition: width .6s ease; }

        .palette-container { display: flex; align-items: center; flex-grow: 1; overflow-x: auto; gap: 6px; padding: 5px 2px; }
        .palette-item { padding: 7px 14px; border-radius: 30px; font-size: 11px; font-weight: 800; cursor: pointer; border: 2px solid var(--border); background: #fff; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
        .palette-item.active { border-color: var(--ink); box-shadow: 0 3px 8px rgba(10,14,26,.15); }
        .btn-add { width: 32px; height: 32px; border-radius: 50%; background: var(--sol-lime); border: none; font-size: 18px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink); }

        .controls { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
        .btn { background: #fff; border: 1px solid var(--border); padding: 9px 13px; font-size: 10px; font-weight: 700; cursor: pointer; border-radius: var(--radius-sm); text-transform: uppercase; color: var(--ink); }
        .btn.active { background: var(--ink); color: #fff; }
        .btn.mode-switch { background: var(--success-bg); color: var(--success); border-color: #a7e2c3; }
        .btn.readonly { background: var(--danger-bg); color: var(--danger); border-color: #f3b7b2; }

        .viewport { flex: 1; overflow: auto; position: relative; }
        table { border-collapse: collapse; table-layout: fixed; width: max-content; }
        th, td { border: 1px solid var(--border); text-align: center; }
        #gridHead th { position: sticky; top: 0; background: #f1f5f9; font-size: 10px; font-weight: 800; color: var(--slate-700); z-index: 100; }
        #gridHead tr:nth-child(1) th { height: 30px; background: var(--slate-900); color: var(--sol-lime); }
        td:first-child { position: sticky; left: 0; z-index: 80; background: #fff; width: 150px !important; text-align: left; padding-left: 15px; font-weight: 800; border-right: 3px solid var(--slate-900); }
        .project-cell { height: 55px; cursor: crosshair; font-size: 10px; font-weight: 800; text-transform: uppercase; }

        .overlay { position: fixed; inset: 0; background: rgba(10,14,26,0.55); backdrop-filter: blur(2px); z-index: 5000; display: none; }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(.97); opacity: 0; background: #fff; padding: 24px; border-radius: 14px; display: none; z-index: 5001; width: 400px; box-shadow: 0 20px 50px rgba(10,14,26,0.35); transition: 0.2s; }
        .modal.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .modal h2 { margin-top: 0; font-size: 16px; border-bottom: 2px solid var(--sol-lime); padding-bottom: 10px; }
        .modal label { display: block; font-size: 10px; font-weight: 800; color: var(--slate-500); text-transform: uppercase; margin-top: 12px; }
        .modal input, .modal select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-top: 5px; }
        .m-btns { display: flex; gap: 8px; margin-top: 20px; }
        .m-btn { flex: 1; padding: 10px; border: none; font-weight: 700; border-radius: var(--radius-sm); cursor: pointer; }
        .m-save { background: var(--ink); color: #fff; }
        .m-cancel { background: var(--slate-100); color: var(--slate-700); }

        .user-row { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--border); gap: 10px; }
        .user-row span { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }

        .toast-stack { position: fixed; bottom: 18px; right: 18px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast { background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; opacity: 0; transition: 0.3s; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
        <h2>SOL<span>PRO</span> LOGIN</h2>
        <label>E-Mail</label>
        <input type="email" id="loginEmail" placeholder="name@firma.de">
        <label>Passwort</label>
        <input type="password" id="loginPass" placeholder="••••••••">
        <button id="loginBtn" onclick="handleLogin()">Einloggen</button>
        <div id="authStatus" class="status-msg" style="margin-top:15px; font-size:12px;"></div>
    </div>
</div>

<div class="accent-line"></div>
<div class="readonly-banner" id="readonlyBanner" style="display:none; background: var(--danger-bg); color: var(--danger); text-align:center; padding: 5px; font-size: 11px; font-weight: 800;">🔒 NUR-LESE-MODUS — PLANUNG GESPERRT</div>

<div class="hud">
    <div class="brand-container"><div class="logo">SOL<span>PRO</span></div><div class="tagline">EXECUTIVE SUITE</div></div>
    <div class="kpi-board">
        <div class="kpi-card"><span class="kpi-lbl">CAP %</span><span class="kpi-val" id="kpiCapRate">0%</span><div class="kpi-bar-track"><div class="kpi-bar" id="kpiBarLine"></div></div></div>
        <div class="kpi-card"><span class="kpi-lbl">Tage</span><span class="kpi-val" id="kpiTotalDays">0 T</span></div>
        <div class="kpi-card"><span class="kpi-lbl">kWp</span><span class="kpi-val" id="kpiTotalKwp">0 <small>kWp</small></span></div>
    </div>
    <div class="palette-container" id="paletteUI"></div>
    <div class="controls">
        <button class="btn" id="userBtn" style="display:none" onclick="openUserManagement()">⚙️ Nutzer</button>
        <button class="btn" onclick="refreshAllData()">🔄 Sync</button>
        <button class="btn mode-switch planning" id="lockStateBtn" onclick="toggleSystemLock()">✏️ Planen</button>
        <div class="seg-group">
            <button class="btn" onclick="setView('woche', this)">W</button>
            <button class="btn active" onclick="setView('monat', this)">M</button>
            <button class="btn" onclick="setView('jahr', this)">J</button>
        </div>
        <button class="btn btn-danger" onclick="handleLogout()">🚪 Logout</button>
    </div>
</div>

<div class="viewport" id="scrollPort"><table id="theTable"><thead id="gridHead"></thead><tbody id="gridBody"></tbody></table></div>

<div id="actionGridCtx" style="display:none; position:fixed; z-index:9000; background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:5px; width:200px;"></div>
<div class="overlay" id="p_overlay" onclick="closeModals()"></div>

<!-- Modals -->
<div class="modal" id="paletteModal">
    <h2>Projekt Details</h2>
    <label>Name</label><input type="text" id="palNameInput">
    <label>kWp</label><input type="number" id="palKwpInput">
    <label>Farbe</label><input type="color" id="palColorInput" style="height:40px">
    <input type="hidden" id="palEditId">
    <div class="m-btns">
        <button class="m-btn m-save" onclick="savePaletteItem()">Sichern</button>
        <button class="m-btn m-cancel" onclick="closeModals()">Abbrechen</button>
    </div>
    <button class="m-btn m-delete" id="palDelBtn" onclick="deletePaletteItem()" style="display:none; width:100%; margin-top:10px; background:var(--danger-bg); color:var(--danger);">Projekt löschen</button>
</div>

<div class="modal" id="userModal">
    <h2>Nutzerverwaltung (Admin)</h2>
    <div id="userList" style="max-height:300px; overflow-y:auto;"></div>
    <div class="m-btns">
        <button class="m-btn m-cancel" onclick="closeModals()">Schließen</button>
    </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script>
    /* ==========================================
       SUPABASE CONFIG
       ========================================== */
    const SUPABASE_URL = "https://iuxklqcpexoziqxrohwa.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VteOTQ6g28z9Dvo-QUG8jw_hehaZpWu";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let userRole = 'viewer';
    let projects = [], plannerGrid = {}, deactivatedBuses = [];
    let activeProjectId = "ERASER", isDrawing = false, selectedCells = [], isAppLockedForEditing = false;
    const baseFlottenListe = ["SOL 2", "SOL 3", "SOL 4", "SOL 12", "SOL 16"];
    const managementFarben = ["#1e3a8a","#0284c7","#059669","#ca8a04","#b91c1c","#6d28d9","#0f766e","#a21caf","#4f46e5","#b45309","#4338ca","#064e3b"];

    // ==========================================
    // AUTHENTICATION
    // ==========================================
    async function handleLogin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPass').value;
        const status = document.getElementById('authStatus');
        const btn = document.getElementById('loginBtn');

        if(!email || !password) return (status.innerText = "Bitte alle Felder ausfüllen");
        
        btn.innerText = "Lade...";
        btn.disabled = true;

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) throw error;

            currentUser = data.user;
            await fetchUserRole();
            
            document.getElementById('authOverlay').style.display = 'none';
            startApp();
        } catch (e) {
            status.innerText = "❌ Fehler: " + e.message;
            status.style.color = "var(--danger)";
        } finally {
            btn.innerText = "Einloggen";
            btn.disabled = false;
        }
    }

    async function fetchUserRole() {
        const { data, error } = await supabaseClient.from('profiles').select('role').eq('id', currentUser.id).single();
        if (data) {
            userRole = data.role;
        } else {
            await supabaseClient.from('profiles').insert([{ id: currentUser.id, email: currentUser.email, role: 'viewer' }]);
            userRole = 'viewer';
        }
        if(userRole === 'admin') document.getElementById('userBtn').style.display = 'block';
    }

    function handleLogout() {
        supabaseClient.auth.signOut();
        window.location.reload();
    }

    // ==========================================
    // PERMISSIONS
    // ==========================================
    const canPlan = () => (userRole === 'admin' || userRole === 'editor');
    const canDelete = () => (userRole === 'admin');
    const canManageUsers = () => (userRole === 'admin');

    // ==========================================
    // APP CORE
    // ==========================================
    async function startApp() {
        buildGrid();
        await refreshAllData();
        renderProjectsToTopPalette();
        setupMouseDragPainting();
        setupGlobalUiHandlers();
        
        if(userRole === 'viewer') {
            isAppLockedForEditing = true;
            document.body.classList.add('read-only-mode');
            document.getElementById('lockStateBtn').className = 'btn mode-switch readonly';
            document.getElementById('lockStateBtn').innerText = '🔒 Nur Lesen';
            document.getElementById('readonlyBanner').style.display = 'block';
        }
    }

    async function refreshAllData() {
        try {
            const { data: pData } = await supabaseClient.from('projects').select('*');
            projects = pData || [];
            const { data: gData } = await supabaseClient.from('planner_grid').select('*');
            plannerGrid = {};
            (gData || []).forEach(row => { plannerGrid[row.cell_id] = row.project_id; });
            const { data: fData } = await supabaseClient.from('fleet_status').select('*');
            deactivatedBuses = (fData || []).filter(row => row.is_offline).map(row => row.bus_id);
            
            fullGridRepaintUI_Logic();
            renderProjectsToTopPalette();
            showToast("Cloud-Synchronisation erfolgreich", "success");
        } catch (e) { showToast("Sync-Fehler: " + e.message, "error"); }
    }

    function buildGrid() {
        const thead = document.getElementById('gridHead'); const tbody = document.getElementById('gridBody');
        let currentDay = new Date(2026, 7, 17); const endDate = new Date(2026, 11, 31); const dateArray = [];
        while(currentDay <= endDate) { if(currentDay.getDay()!==0 && currentDay.getDay()!==6) dateArray.push(new Date(currentDay)); currentDay.setDate(currentDay.getDate()+1); }
        
        let trMonat = `<tr><th rowspan="3" class="fixed-corner"><div class="logo">SOL<span>PRO</span></div></th>`;
        let trKW = `<tr>`, trTage = `<tr>`;
        let lastM=-1, mSpans=[], lastKW=-1, kwSpans=[];
        dateArray.forEach(d => {
            let m=d.getMonth(), kw=getKalenderWocheMath(d);
            if(m!==lastM){ mSpans.push({label:d.toLocaleString('de-DE',{month:'long'}).toUpperCase(), count:1}); lastM=m; } else mSpans[mSpans.length-1].count++;
            if(kw!==lastKW){ kwSpans.push({label:'KW '+kw, count:1}); lastKW=kw; } else kwSpans[kwSpans.length-1].count++;
        });
        mSpans.forEach(ms => trMonat += `<th colspan="${ms.count}">${ms.label}</th>`);
        kwSpans.forEach(ks => trKW += `<th colspan="${ks.count}">${ks.label}</th>`);
        dateArray.forEach(d => {
            let iso = d.toISOString().split('T')[0];
            trTage += `<th id="th-${iso}" class="${d.getDay()===1?'monday-start':''}"><div class="day-num">${d.getDate()}</div><div class="day-short">${d.toLocaleString('de-DE',{weekday:'short'})}</div></th>`;
        });
        thead.innerHTML = trMonat + `</tr>` + trKW + `</tr>` + trTage + `</tr>`;
        baseFlottenListe.forEach(w => {
            let sf = w.replace(/\s+/g,'_');
            let rw = `<tr id="row_${sf}" class="worker-row is-active"><td><div class="worker-controls"><span>${w}</span><button title="Ausfall" onclick="toggleBusState('${sf}')" class="toggle-btn"></button></div></td>`;
            dateArray.forEach(d => {
                let iso = d.toISOString().split('T')[0];
                rw += `<td id="CELL_${sf}_${iso}" class="project-cell${(d.getDay()===1?' monday-start':'')}" data-date-ts="${d.getTime()}"></td>`;
            });
            tbody.insertAdjacentHTML('beforeend', rw + `</tr>`);
        });
        let fRow = `<tr class="stat-row"><td>LEISTUNG</td>`;
        dateArray.forEach(d => fRow += `<td id="COUNT_${d.toISOString().split('T')[0]}">0</td>`);
        tbody.insertAdjacentHTML('beforeend', fRow + `</tr>`);
    }

    async function toggleBusState(sid) {
        if(!canPlan()) return showToast("Keine Berechtigung!", "error");
        if(isAppLockedForEditing) return showToast('Zuerst Sperre lösen', 'warn');
        const isNowOffline = !deactivatedBuses.includes(sid);
        if(isNowOffline) { deactivatedBuses.push(sid); document.getElementById('row_'+sid).classList.replace('is-active','is-offline'); }
        else { deactivatedBuses=deactivatedBuses.filter(v=>v!==sid); document.getElementById('row_'+sid).classList.replace('is-offline','is-active'); }
        await supabaseClient.from('fleet_status').upsert({ bus_id: sid, is_offline: isNowOffline });
        fullGridRepaintUI_Logic();
    }

    function setupMouseDragPainting() {
        document.addEventListener('mousedown', e => {
            if (e.target.classList.contains('project-cell') && e.button === 0) {
                if(isAppLockedForEditing || !canPlan()) return;
                isDrawing = true; selectedCells = [e.target.id]; e.target.classList.add('selecting');
            }
        });
        document.addEventListener('mouseover', e => { if(isDrawing && e.target.classList.contains('project-cell') && !selectedCells.includes(e.target.id)) { selectedCells.push(e.target.id); e.target.classList.add('selecting'); } });
        document.addEventListener('mouseup', e => { if(isDrawing && e.button === 0 && selectedCells.length > 0) { verarbeiteMalerZugAufGrid(); } document.querySelectorAll('.selecting').forEach(nd => nd.classList.remove('selecting')); isDrawing = false; });
    }

    async function verarbeiteMalerZugAufGrid() {
        for(let cid of selectedCells) {
            if(activeProjectId === "ERASER") {
                delete plannerGrid[cid];
                await supabaseClient.from('planner_grid').delete().eq('cell_id', cid);
            } else {
                plannerGrid[cid] = activeProjectId;
                await supabaseClient.from('planner_grid').upsert({ cell_id: cid, project_id: activeProjectId });
            }
        }
        fullGridRepaintUI_Logic(); renderProjectsToTopPalette(); selectedCells = [];
    }

    function renderProjectsToTopPalette() {
        let container = document.getElementById('paletteUI');
        if(!container) return;
        container.innerHTML = canPlan() ? `<button class="btn-add" onclick="oeffneProjectCreatorModal()">+</button>` : '';
        projects.forEach(p => {
            let counts = Object.keys(plannerGrid).filter(k => plannerGrid[k] === p.id).length;
            let el = document.createElement('div');
            el.className = `palette-item ${activeProjectId === p.id ? 'active' : ''}`;
            el.style.backgroundColor = p.color; el.style.color = getLesbareTextfarbe(p.color);
            el.innerHTML = `<b>${p.name}</b> <span class="chip-days">${counts} T</span>`;
            el.onclick = () => { activeProjectId = p.id; renderProjectsToTopPalette(); };
            container.appendChild(el);
        });
        container.insertAdjacentHTML('beforeend', '<div class="palette-separator"></div>');
        [{ id: 'ERASER', label: '🧼 Radierer', cls: 'sys-eraser' }, { id: 'SYS_VACATION', label: '🌴 Urlaub', cls: 'sys-urlaub' }].forEach(t => {
            let el = document.createElement('div'); el.className = `palette-item tool-item ${t.cls} ${(activeProjectId === t.id ? 'active' : '')}`; el.innerText = t.label; el.onclick = () => { activeProjectId = t.id; renderProjectsToTopPalette(); };
            container.appendChild(el);
        });
    }

    function oeffneProjectCreatorModal() {
        if(!canPlan()) return showToast('Keine Berechtigung!', 'error');
        if(isAppLockedForEditing) return showToast('Zuerst Sperre lösen', 'warn');
        document.getElementById('pModalTitle').innerText = "Neues Projekt"; document.getElementById('palEditId').value = ""; document.getElementById('palNameInput').value = ""; document.getElementById('palKwpInput').value = ""; 
        openPaletteModal();
    }

    async function savePaletteItem() {
        let name = document.getElementById('palNameInput').value.trim(); 
        let kwp = parseFloat(document.getElementById('palKwpInput').value) || 0;
        let id = document.getElementById('palEditId').value;
        if(!name) return showToast('Bitte einen Namen eingeben', 'error');
        
        let projData = { name, kwp, color: document.getElementById('palColorInput').value };
        if(id) {
            projData.id = id;
            await supabaseClient.from('projects').upsert(projData);
        } else {
            const { data } = await supabaseClient.from('projects').insert([projData]).select().single();
            projects.push(data);
            activeProjectId = data.id;
        }
        closeModals(); await refreshAllData(); renderProjectsToTopPalette();
    }

    async function openUserManagement() {
        if(!canManageUsers()) return;
        const { data: users } = await supabaseClient.from('profiles').select('*');
        const userListDiv = document.getElementById('userList');
        userListDiv.innerHTML = '';
        users.forEach(u => {
            const row = document.createElement('div');
            row.className = 'user-row';
            row.innerHTML = `<span>${u.email}</span><select onchange="updateUserRole('${u.id}', this.value)">
                <option value="viewer" ${u.role === 'viewer' ? 'selected' : ''}>Viewer</option>
                <option value="editor" ${u.role === 'editor' ? 'selected' : ''}>Editor</option>
                <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
            </select>`;
            userListDiv.appendChild(row);
        });
        document.getElementById('p_overlay').style.display = 'block';
        document.getElementById('userModal').style.display = 'block';
        setTimeout(() => document.getElementById('userModal').classList.add('show'), 10);
    }

    async function updateUserRole(userId, newRole) {
        await supabaseClient.from('profiles').update({ role: newRole }).eq('id', userId);
        showToast(`Rolle aktualisiert`, "success");
    }

    function setupGlobalUiHandlers() {
        document.addEventListener('click', e => { if(!e.target.closest('.menu-wrap')) closeMenus(); });
    }
    function closeModals() {
        document.querySelectorAll('.modal').forEach(m => { m.classList.remove('show'); setTimeout(()=>m.style.display='none', 200); });
        document.getElementById('p_overlay').style.display = 'none';
    }
    function openPaletteModal() {
        document.getElementById('p_overlay').style.display = 'block';
        const m = document.getElementById('paletteModal');
        m.style.display = 'block';
        setTimeout(() => m.classList.add('show'), 10);
    }
    function toggleSystemLock() {
        if(!canPlan()) return;
        isAppLockedForEditing = !isAppLockedForEditing; 
        let btn = document.getElementById('lockStateBtn');
        if(isAppLockedForEditing){ document.body.classList.add('read-only-mode'); btn.className = 'btn mode-switch readonly'; btn.innerText = '🔒 Nur Lesen'; }
        else { document.body.classList.remove('read-only-mode'); btn.className = 'btn mode-switch planning'; btn.innerText = '✏️ Planen'; }
    }
    function fullGridRepaintUI_Logic() {
        document.querySelectorAll('.project-cell').forEach(c => { c.style.backgroundColor=""; c.style.color=""; c.innerText=""; });
        Object.keys(plannerGrid).forEach(k => {
            let p = projects.find(x=>x.id===plannerGrid[k]); let cell = document.getElementById(k);
            if(!cell) return;
            if(plannerGrid[k] === "SYS_VACATION") { cell.style.background="repeating-linear-gradient(45deg, #f8fafc, #f8fafc 8px, #cbd5e1 8px, #cbd5e1 16px)"; cell.innerText="AUSFALL"; return; }
            if(p) { cell.style.backgroundColor=p.color; cell.style.color=getLesbareTextfarbe(p.color); cell.innerText=p.name; }
        });
        evalDashboardMathemations();
    }
    function evalDashboardMathemations() {
        let netWork=0, lost=0, maxPossible=0;
        let activeBuses = baseFlottenListe.length - deactivatedBuses.length;
        document.querySelectorAll('[id^="COUNT_"]').forEach(f => {
            let dt = f.id.replace('COUNT_','');
            let dayLost=0, dayWork=0;
            Object.keys(plannerGrid).forEach(k => { if(k.includes(dt) && !deactivatedBuses.some(b=>k.includes(b))) { if(plannerGrid[k] === "SYS_VACATION") dayLost++; else dayWork++; } });
            let capThisDay = activeBuses - dayLost; netWork += dayWork; lost += dayLost; maxPossible += (capThisDay > 0 ? capThisDay : 0);
            f.innerText = dayWork + " / " + (capThisDay > 0 ? capThisDay : 0);
        });
        let rate = maxPossible > 0 ? Math.round((netWork/maxPossible)*100) : 0;
        document.getElementById('kpiCapRate').innerText = rate + "%";
        document.getElementById('kpiBarLine').style.width = rate + "%";
        document.getElementById('kpiTotalDays').innerText = netWork + " T";
        let totalKwp = 0;
        new Set(Object.values(plannerGrid)).forEach(pid => {
            let p = projects.find(x => x.id === pid);
            if(p) totalKwp += (p.kwp || 0);
        });
        document.getElementById('kpiTotalKwp').innerHTML = totalKwp + " <small>kWp</small>";
    }
    function getKalenderWocheMath(d){ let x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()+4-(x.getDay()||7)); return Math.ceil((((x-new Date(x.getFullYear(),0,1))/86400000)+1)/7); }
    function getLesbareTextfarbe(h){ h=h.replace('#',''); return (((parseInt(h.substr(0,2),16)*299)+(parseInt(h.substr(2,2),16)*587)+(parseInt(h.substr(4,2),16)*114))/1000)>=128?'#111':'#fff'; }
    function showToast(msg, type) {
        const stack = document.getElementById('toastStack');
        const t = document.createElement('div'); t.className = `toast`; t.style.backgroundColor = type === 'success' ? 'var(--success)' : (type === 'error' ? 'var(--danger)' : 'var(--ink)');
        t.innerText = msg; stack.appendChild(t);
        requestAnimationFrame(()=>t.classList.add('show'));
        setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 300); }, 3000);
    }
    function setView(m, b){ document.body.className=`view-${m}`; document.querySelectorAll('.controls .btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); }
    function closeMenus() { document.querySelectorAll('.dropdown-menu').forEach(m=>m.classList.remove('open')); }
    function handleLogout() { supabaseClient.auth.signOut(); window.location.reload(); }

    // STARTUP
    window.addEventListener('DOMContentLoaded', () => {
        // Die Login Card ist bereits im HTML sichtbar
    });
</script>
