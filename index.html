<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLPRO | Executive Fintech Suite V8.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap');

        :root {
            --bg-dark: #070a11;
            --panel-bg: #0d1322;
            --panel-border: rgba(255, 255, 255, 0.08);
            --panel-border-glow: rgba(164, 198, 57, 0.25);
            --sol-lime: #a4c639;
            --sol-lime-glow: rgba(164, 198, 57, 0.4);
            --cyan-accent: #38bdf8;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --text-dim: #94a3b8;
            --danger: #f43f5e;
            --danger-bg: rgba(244, 63, 94, 0.12);
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.12);
            --warn: #f59e0b;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', -apple-system, blinkmacsystemfont, sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; }
        
        body {
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-sans);
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        /* AUTH OVERLAY */
        .auth-overlay {
            position: fixed; inset: 0; background: rgba(7, 10, 17, 0.92); z-index: 10000;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(20px);
        }
        .auth-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 44px; border-radius: var(--radius-lg); width: 400px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 40px rgba(164, 198, 57, 0.05); text-align: center;
        }
        .auth-card h2 { font-family: 'Orbitron'; margin-bottom: 24px; color: #fff; font-size: 26px; letter-spacing: 1px; }
        .auth-card h2 span { color: var(--sol-lime); }
        .auth-card label { display: block; text-align: left; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.2px; margin-top: 16px; }
        .auth-card input { 
            width: 100%; padding: 14px 16px; margin-top: 6px; background: rgba(0,0,0,0.4); 
            border: 1px solid var(--panel-border); border-radius: var(--radius-md); color: #fff; font-size: 14px; font-family: var(--font-sans);
            transition: all 0.2s;
        }
        .auth-card input:focus { outline: none; border-color: var(--sol-lime); box-shadow: 0 0 12px var(--sol-lime-glow); }
        .auth-card button { 
            width: 100%; padding: 15px; margin-top: 28px; background: var(--sol-lime); border: none; 
            font-weight: 800; cursor: pointer; border-radius: var(--radius-md); color: #000; font-size: 13px;
            text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s;
        }
        .auth-card button:hover { background: #b8dc3f; transform: translateY(-1px); box-shadow: 0 6px 20px var(--sol-lime-glow); }

        /* HUD TOP NAVBAR */
        .accent-line { height: 2px; background: linear-gradient(90deg, var(--sol-lime), var(--cyan-accent), transparent); flex-shrink: 0; }
        .hud { 
            height: 76px; background: rgba(13, 19, 34, 0.85); backdrop-filter: blur(16px); 
            border-bottom: 1px solid var(--panel-border); display: flex; align-items: center; 
            padding: 0 24px; gap: 20px; z-index: 3000; flex-shrink: 0; 
        }
        .brand-container { display: flex; flex-direction: column; flex-shrink: 0; }
        .logo { font-family: 'Orbitron'; font-size: 22px; font-weight: 900; color: #fff; line-height: 1; letter-spacing: 1px; }
        .logo span { color: var(--sol-lime); }
        .tagline { font-size: 8px; letter-spacing: 3px; color: var(--text-muted); font-weight: 700; margin-top: 4px; }

        .kpi-board { display: flex; gap: 12px; border-left: 1px solid var(--panel-border); padding-left: 20px; flex-shrink: 0; }
        .kpi-card { 
            background: rgba(255,255,255,0.02); padding: 8px 16px; border-radius: var(--radius-md); min-width: 110px; 
            border: 1px solid var(--panel-border); transition: all 0.2s; 
        }
        .kpi-card:hover { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.04); }
        .kpi-lbl { font-size: 9px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }
        .kpi-val { font-family: var(--font-mono); font-size: 18px; font-weight: 700; color: #fff; margin-top: 2px; display: block; }
        .kpi-bar-track { height: 3px; width: 100%; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 6px; overflow: hidden; }
        .kpi-bar { height: 100%; width: 0%; background: var(--sol-lime); transition: width .5s ease; }

        .palette-container { display: flex; align-items: center; flex-grow: 1; overflow-x: auto; gap: 8px; padding: 4px; }
        .palette-item { 
            padding: 8px 16px; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; 
            border: 1px solid var(--panel-border); background: rgba(255,255,255,0.03); white-space: nowrap; 
            display: flex; align-items: center; gap: 8px; transition: all 0.2s; color: #fff;
        }
        .palette-item:hover { border-color: rgba(255,255,255,0.3); transform: translateY(-1px); }
        .palette-item.active { border-color: var(--sol-lime); box-shadow: 0 0 15px var(--sol-lime-glow); }
        .btn-add { 
            width: 32px; height: 32px; border-radius: 50%; background: var(--sol-lime); border: none; 
            font-size: 18px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #000; transition: all 0.2s; 
        }
        .btn-add:hover { transform: rotate(90deg) scale(1.1); box-shadow: 0 0 15px var(--sol-lime-glow); }

        .controls { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .btn { 
            background: rgba(255,255,255,0.04); border: 1px solid var(--panel-border); padding: 9px 14px; font-size: 11px; 
            font-weight: 700; cursor: pointer; border-radius: var(--radius-md); text-transform: uppercase; color: var(--text-main); transition: all 0.2s; letter-spacing: 0.5px;
        }
        .btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }
        .btn.active { background: #fff; color: #000; border-color: #fff; }
        .btn.mode-switch { background: var(--success-bg); color: var(--success); border-color: rgba(16, 185, 129, 0.3); }
        .btn.readonly { background: var(--danger-bg); color: var(--danger); border-color: rgba(244, 63, 94, 0.3); }
        .btn-danger { color: var(--danger); }
        .btn-danger:hover { background: var(--danger-bg); border-color: var(--danger); }

        .seg-group { display: flex; gap: 2px; background: rgba(0,0,0,0.4); padding: 3px; border-radius: var(--radius-md); border: 1px solid var(--panel-border); }

        /* MAIN LAYOUT */
        .main-wrapper { display: flex; flex: 1; overflow: hidden; }
        .viewport { flex: 1; overflow: auto; position: relative; padding: 16px; }

        /* MATRIX TABLE GRID */
        table { border-collapse: separate; border-spacing: 0; width: max-content; background: var(--panel-bg); border-radius: var(--radius-lg); border: 1px solid var(--panel-border); overflow: hidden; }
        th, td { border-bottom: 1px solid var(--panel-border); border-right: 1px solid var(--panel-border); text-align: center; }
        #gridHead th { position: sticky; top: 0; background: #0f172a; font-size: 10px; font-weight: 800; color: var(--text-dim); z-index: 100; text-transform: uppercase; letter-spacing: 1px; }
        #gridHead tr:nth-child(1) th { height: 32px; background: #090e17; color: var(--sol-lime); border-bottom: 1px solid var(--panel-border); }
        td:first-child { position: sticky; left: 0; z-index: 80; background: #0f172a; width: 160px !important; text-align: left; padding-left: 18px; font-weight: 700; border-right: 2px solid var(--cyan-accent); color: #fff; font-size: 12px; }
        
        .project-cell { height: 52px; cursor: crosshair; font-size: 10px; font-weight: 800; text-transform: uppercase; transition: all 0.1s; color: #fff; }
        .project-cell:hover { filter: brightness(1.25); outline: 1px solid rgba(255,255,255,0.4); z-index: 10; }
        .monday-start { border-left: 2px solid var(--cyan-accent) !important; }
        .day-num { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: #fff; }
        .day-short { font-size: 8px; color: var(--text-muted); font-weight: 700; }

        .stat-row td { background: #090e17 !important; color: #fff; font-weight: 800; padding: 10px; font-family: var(--font-mono); font-size: 11px; }
        .stat-row td:first-child { color: var(--sol-lime) !important; font-family: var(--font-sans); }

        /* CONTROL CENTER SIDEBAR */
        .sidebar { 
            width: 340px; background: var(--panel-bg); border-left: 1px solid var(--panel-border); 
            display: flex; flex-direction: column; z-index: 2000;
        }
        .sidebar-header { padding: 20px 24px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h3 { margin: 0; font-family: 'Orbitron'; font-size: 13px; color: #fff; letter-spacing: 1px; }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 24px; }

        /* TO-DO SYSTEM */
        .todo-input-group { display: flex; gap: 8px; margin-bottom: 20px; }
        .todo-input-group input { 
            flex: 1; padding: 11px 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--panel-border); 
            border-radius: var(--radius-md); font-size: 12px; color: #fff; font-family: var(--font-sans);
        }
        .todo-input-group input:focus { outline: none; border-color: var(--sol-lime); }
        .todo-input-group button { background: var(--sol-lime); border: none; padding: 0 16px; border-radius: var(--radius-md); cursor: pointer; font-weight: 800; color: #000; }

        .todo-item { 
            display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: rgba(255,255,255,0.02); 
            border: 1px solid var(--panel-border); border-radius: var(--radius-md); margin-bottom: 8px; transition: all 0.2s; border-left: 3px solid var(--sol-lime);
        }
        .todo-item:hover { background: rgba(255,255,255,0.05); transform: translateX(-3px); }
        .todo-item.done { opacity: 0.4; border-left-color: var(--text-muted); }
        .todo-item.done span { text-decoration: line-through; }
        .todo-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--sol-lime); }
        .todo-item span { flex: 1; font-size: 12px; font-weight: 500; color: var(--text-main); }
        .todo-item .del-todo { color: var(--danger); cursor: pointer; font-weight: 800; font-size: 12px; opacity: 0.6; transition: opacity 0.2s; }
        .todo-item .del-todo:hover { opacity: 1; }

        /* MODALS & PANELS */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(10px); z-index: 5000; display: none; }
        .modal { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(.95); opacity: 0; 
            background: var(--panel-bg); border: 1px solid var(--panel-border); padding: 32px; border-radius: var(--radius-lg); 
            display: none; z-index: 5001; width: 420px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); transition: all 0.2s ease-out; 
        }
        .modal.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .modal h2 { margin-top: 0; font-family: 'Orbitron'; font-size: 16px; border-bottom: 1px solid var(--panel-border); padding-bottom: 16px; color: #fff; letter-spacing: 1px; }
        .modal label { display: block; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 16px; }
        .modal input, .modal select { 
            width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--panel-border); 
            border-radius: var(--radius-md); margin-top: 6px; color: #fff; font-family: var(--font-sans); font-size: 13px;
        }
        .m-btns { display: flex; gap: 10px; margin-top: 28px; }
        .m-btn { flex: 1; padding: 12px; border: none; font-weight: 800; border-radius: var(--radius-md); cursor: pointer; transition: all 0.2s; font-size: 12px; text-transform: uppercase; }
        .m-save { background: var(--sol-lime); color: #000; }
        .m-save:hover { background: #b8dc3f; }
        .m-cancel { background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid var(--panel-border); }

        .user-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--panel-border); }
        .user-row span { font-size: 12px; font-weight: 600; color: #fff; }
        .user-row select { padding: 6px; background: #000; color: #fff; border: 1px solid var(--panel-border); border-radius: 4px; font-size: 11px; }

        .toast-stack { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast { 
            background: var(--panel-bg); color: #fff; border: 1px solid var(--panel-border); padding: 12px 20px; 
            border-radius: var(--radius-md); font-size: 12px; font-weight: 600; opacity: 0; transform: translateY(15px); transition: all 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

<!-- AUTH OVERLAY -->
<div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
        <h2>SOL<span>PRO</span></h2>
        <p style="font-size:12px; color:var(--text-muted); margin-top:-15px; margin-bottom:25px;">EXECUTIVE FINTECH SUITE</p>
        <label>E-Mail Adresse</label>
        <input type="email" id="loginEmail" placeholder="name@firma.de">
        <label>Passwort</label>
        <input type="password" id="loginPass" placeholder="••••••••">
        <button id="loginBtn" onclick="handleLogin()">Authentifizieren</button>
        <div id="authStatus" style="margin-top:16px; font-size:12px; font-weight:600;"></div>
    </div>
</div>

<div class="accent-line"></div>

<!-- TOP NAV HUD -->
<div class="hud">
    <div class="brand-container">
        <div class="logo">SOL<span>PRO</span></div>
        <div class="tagline">FINTECH EDITION</div>
    </div>
    
    <div class="kpi-board">
        <div class="kpi-card"><span class="kpi-lbl">Kapazität</span><span class="kpi-val" id="kpiCapRate">0%</span><div class="kpi-bar-track"><div class="kpi-bar" id="kpiBarLine"></div></div></div>
        <div class="kpi-card"><span class="kpi-lbl">Netto Tage</span><span class="kpi-val" id="kpiTotalDays">0 T</span></div>
        <div class="kpi-card"><span class="kpi-lbl">Volumen</span><span class="kpi-val" id="kpiTotalKwp">0 <small style="font-size:10px;">kWp</small></span></div>
    </div>

    <div class="palette-container" id="paletteUI"></div>

    <div class="controls">
        <button class="btn" id="userBtn" style="display:none" onclick="openUserManagement()">⚙️ Admin</button>
        <button class="btn" onclick="refreshAllData()">🔄 Sync</button>
        <button class="btn mode-switch planning" id="lockStateBtn" onclick="toggleSystemLock()">✏️ Planen</button>
        <div class="seg-group">
            <button class="btn" onclick="setView('woche', this)">W</button>
            <button class="btn active" onclick="setView('monat', this)">M</button>
            <button class="btn" onclick="setView('jahr', this)">J</button>
        </div>
        <button class="btn btn-danger" onclick="handleLogout()">Logout</button>
    </div>
</div>

<!-- MAIN VIEWPORT -->
<div class="main-wrapper">
    <div class="viewport" id="scrollPort">
        <table id="theTable"><thead id="gridHead"></thead><tbody id="gridBody"></tbody></table>
    </div>
    
    <!-- FINTECH CONTROL CENTER SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>Control Center</h3>
            <span style="font-size:10px; color:var(--sol-lime); font-weight:800; background:rgba(164,198,57,0.1); padding:3px 8px; border-radius:10px;">LIVE</span>
        </div>
        <div class="sidebar-content">
            <div style="margin-bottom: 28px;">
                <h4 style="font-family:'Orbitron'; font-size:11px; text-transform:uppercase; color:var(--text-muted); margin-bottom:14px; letter-spacing:1px;">🎯 Aufgaben & To-Dos</h4>
                <div class="todo-input-group">
                    <input type="text" id="todoInput" placeholder="Neue Aufgabe eintragen...">
                    <button onclick="addTodo()">+</button>
                </div>
                <div id="todoList"></div>
            </div>
            
            <hr style="border:none; border-top:1px solid var(--panel-border); margin:24px 0;">
            
            <div>
                <h4 style="font-family:'Orbitron'; font-size:11px; text-transform:uppercase; color:var(--text-muted); margin-bottom:14px; letter-spacing:1px;">System Status</h4>
                <div style="font-size:11px; color:var(--text-dim); line-height:1.8; font-family:var(--font-mono);">
                    Rolle: <b id="userRoleDisp" style="color:#fff;">...</b><br>
                    Account: <span id="userEmailDisp" style="color:#fff;">...</span><br>
                    Database: <span style="color:var(--success);">Encrypted SQL</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="actionGridCtx" style="display:none; position:fixed; z-index:9000; background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:var(--radius-md); padding:8px; width:220px; box-shadow:0 10px 30px rgba(0,0,0,0.5);"></div>
<div class="overlay" id="p_overlay" onclick="closeModals()"></div>

<!-- MODALS -->
<div class="modal" id="paletteModal">
    <h2 id="pModalTitle">Projekt Konfiguration</h2>
    <label>Projekt Name</label><input type="text" id="palNameInput">
    <label>Leistung (kWp)</label><input type="number" id="palKwpInput">
    <label>Farbe</label><input type="color" id="palColorInput" style="height:44px;">
    <input type="hidden" id="palEditId">
    <div class="m-btns">
        <button class="m-btn m-save" onclick="savePaletteItem()">Speichern</button>
        <button class="m-btn m-cancel" onclick="closeModals()">Abbrechen</button>
    </div>
    <button class="m-btn" id="palDelBtn" onclick="deletePaletteItem()" style="display:none; width:100%; margin-top:12px; background:var(--danger-bg); color:var(--danger); border:1px solid var(--danger);">Projekt Löschen</button>
</div>

<div class="modal" id="userModal">
    <h2>Nutzerverwaltung</h2>
    <div id="userList" style="max-height:280px; overflow-y:auto; margin-top:12px;"></div>
    <div class="m-btns">
        <button class="m-btn m-cancel" onclick="closeModals()">Schließen</button>
    </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script>
    /* ==========================================
       SUPABASE CORE SETUP
       ========================================== */
    const SUPABASE_URL = "https://iuxklqcpexoziqxrohwa.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VteOTQ6g28z9Dvo-QUG8jw_hehaZpWu";
    const solproSupa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let userRole = 'viewer';
    let projects = [], plannerGrid = {}, deactivatedBuses = [], todos = [];
    let activeProjectId = "ERASER", isDrawing = false, selectedCells = [], isAppLockedForEditing = false;
    const baseFlottenListe = ["SOL 2", "SOL 3", "SOL 4", "SOL 12", "SOL 16"];
    const managementFarben = ["#1e3a8a","#0284c7","#059669","#ca8a04","#b91c1c","#6d28d9","#0f766e","#a21caf","#4f46e5","#b45309","#4338ca","#064e3b"];

    // ==========================================
    // AUTHENTICATION
    // ==========================================
    async function handleLogin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPass').value;
        const status = document.getElementById('authStatus');
        const btn = document.getElementById('loginBtn');

        if(!email || !password) return (status.innerText = "Bitte Felder ausfüllen");
        btn.innerText = "Verbinde..."; btn.disabled = true;

        try {
            const { data, error } = await solproSupa.auth.signInWithPassword({ email, password });
            if (error) throw error;
            currentUser = data.user;
            await fetchUserRole();
            document.getElementById('authOverlay').style.display = 'none';
            startApp();
        } catch (e) {
            status.innerText = "❌ Fehler: " + e.message;
            status.style.color = "var(--danger)";
        } finally {
            btn.innerText = "Authentifizieren"; btn.disabled = false;
        }
    }

    async function fetchUserRole() {
        const { data } = await solproSupa.from('profiles').select('role').eq('id', currentUser.id).single();
        if (data) userRole = data.role;
        else {
            await solproSupa.from('profiles').insert([{ id: currentUser.id, email: currentUser.email, role: 'viewer' }]);
            userRole = 'viewer';
        }
        document.getElementById('userRoleDisp').innerText = userRole.toUpperCase();
        document.getElementById('userEmailDisp').innerText = currentUser.email;
        if(userRole === 'admin') document.getElementById('userBtn').style.display = 'block';
    }

    function handleLogout() { solproSupa.auth.signOut(); window.location.reload(); }

    // ==========================================
    // TO-DO ENGINE
    // ==========================================
    async function loadTodos() {
        const { data } = await solproSupa.from('todos').select('*').eq('user_id', currentUser.id).order('id', { ascending: false });
        todos = data || [];
        renderTodos();
    }

    async function addTodo() {
        const input = document.getElementById('todoInput');
        const task = input.value.trim();
        if(!task) return;

        const { data, error } = await solproSupa.from('todos').insert([{ 
            task: task, user_id: currentUser.id, is_completed: false 
        }]).select().single();

        if(error) return showToast("Fehler beim Speichern", "error");
        input.value = ""; todos.unshift(data); renderTodos();
    }

    async function toggleTodo(id, currentStatus) {
        await solproSupa.from('todos').update({ is_completed: !currentStatus }).eq('id', id);
        await loadTodos();
    }

    async function deleteTodo(id) {
        await solproSupa.from('todos').delete().eq('id', id);
        await loadTodos();
    }

    function renderTodos() {
        const list = document.getElementById('todoList');
        list.innerHTML = '';
        todos.forEach(t => {
            const div = document.createElement('div');
            div.className = `todo-item ${t.is_completed ? 'done' : ''}`;
            div.innerHTML = `
                <input type="checkbox" ${t.is_completed ? 'checked' : ''} onclick="toggleTodo('${t.id}', ${t.is_completed})">
                <span>${t.task}</span>
                <div class="del-todo" onclick="deleteTodo('${t.id}')">✕</div>
            `;
            list.appendChild(div);
        });
    }

    // ==========================================
    // PERMISSIONS GUARD
    // ==========================================
    const canPlan = () => (userRole === 'admin' || userRole === 'editor');
    const canDelete = () => (userRole === 'admin');

    // ==========================================
    // APP CORE
    // ==========================================
    async function startApp() {
        buildGrid();
        await refreshAllData();
        await loadTodos();
        renderProjectsToTopPalette();
        setupMouseDragPainting();
        setupGlobalUiHandlers();
        
        if(userRole === 'viewer') {
            isAppLockedForEditing = true;
            document.body.classList.add('read-only-mode');
            document.getElementById('lockStateBtn').className = 'btn mode-switch readonly';
            document.getElementById('lockStateBtn').innerText = '🔒 Nur Lesen';
        }
    }

    async function refreshAllData() {
        try {
            const { data: pData } = await solproSupa.from('projects').select('*');
            projects = pData || [];
            const { data: gData } = await solproSupa.from('planner_grid').select('*');
            plannerGrid = {};
            (gData || []).forEach(row => { plannerGrid[row.cell_id] = row.project_id; });
            const { data: fData } = await solproSupa.from('fleet_status').select('*');
            deactivatedBuses = (fData || []).filter(row => row.is_offline).map(row => row.bus_id);
            
            fullGridRepaintUI_Logic();
            renderProjectsToTopPalette();
            showToast("System Synchronisiert", "success");
        } catch (e) { showToast("Sync Fehler: " + e.message, "error"); }
    }

    function buildGrid() {
        const thead = document.getElementById('gridHead'); const tbody = document.getElementById('gridBody');
        let currentDay = new Date(2026, 7, 17); const endDate = new Date(2026, 11, 31); const dateArray = [];
        while(currentDay <= endDate) { if(currentDay.getDay()!==0 && currentDay.getDay()!==6) dateArray.push(new Date(currentDay)); currentDay.setDate(currentDay.getDate()+1); }
        
        let trMonat = `<tr><th rowspan="3" class="fixed-corner"><div class="logo">SOL<span>PRO</span></div></th>`;
        let trKW = `<tr>`, trTage = `<tr>`;
        let lastM=-1, mSpans=[], lastKW=-1, kwSpans=[];
        dateArray.forEach(d => {
            let m=d.getMonth(), kw=getKalenderWocheMath(d);
            if(m!==lastM){ mSpans.push({label:d.toLocaleString('de-DE',{month:'long'}).toUpperCase(), count:1}); lastM=m; } else mSpans[mSpans.length-1].count++;
            if(kw!==lastKW){ kwSpans.push({label:'KW '+kw, count:1}); lastKW=kw; } else kwSpans[kwSpans.length-1].count++;
        });
        mSpans.forEach(ms => trMonat += `<th colspan="${ms.count}">${ms.label}</th>`);
        kwSpans.forEach(ks => trKW += `<th colspan="${ks.count}">${ks.label}</th>`);
        dateArray.forEach(d => {
            let iso = d.toISOString().split('T')[0];
            trTage += `<th id="th-${iso}" class="${d.getDay()===1?'monday-start':''}"><div class="day-num">${d.getDate()}</div><div class="day-short">${d.toLocaleString('de-DE',{weekday:'short'})}</div></th>`;
        });
        thead.innerHTML = trMonat + `</tr>` + trKW + `</tr>` + trTage + `</tr>`;
        baseFlottenListe.forEach(w => {
            let sf = w.replace(/\s+/g,'_');
            let rw = `<tr id="row_${sf}" class="worker-row is-active"><td><div class="worker-controls"><span>${w}</span></div></td>`;
            dateArray.forEach(d => {
                let iso = d.toISOString().split('T')[0];
                rw += `<td id="CELL_${sf}_${iso}" class="project-cell${(d.getDay()===1?' monday-start':'')}" data-date-ts="${d.getTime()}"></td>`;
            });
            tbody.insertAdjacentHTML('beforeend', rw + `</tr>`);
        });
        let fRow = `<tr class="stat-row"><td>LEISTUNG</td>`;
        dateArray.forEach(d => fRow += `<td id="COUNT_${d.toISOString().split('T')[0]}">0</td>`);
        tbody.insertAdjacentHTML('beforeend', fRow + `</tr>`);
    }

    function setupMouseDragPainting() {
        document.addEventListener('mousedown', e => {
            if (e.target.classList.contains('project-cell') && e.button === 0) {
                if(isAppLockedForEditing || !canPlan()) return;
                isDrawing = true; selectedCells = [e.target.id]; e.target.classList.add('selecting');
            }
        });
        document.addEventListener('mouseover', e => { if(isDrawing && e.target.classList.contains('project-cell') && !selectedCells.includes(e.target.id)) { selectedCells.push(e.target.id); e.target.classList.add('selecting'); } });
        document.addEventListener('mouseup', e => { if(isDrawing && e.button === 0 && selectedCells.length > 0) { verarbeiteMalerZugAufGrid(); } document.querySelectorAll('.selecting').forEach(nd => nd.classList.remove('selecting')); isDrawing = false; });
    }

    async function verarbeiteMalerZugAufGrid() {
        for(let cid of selectedCells) {
            if(activeProjectId === "ERASER") {
                delete plannerGrid[cid];
                await solproSupa.from('planner_grid').delete().eq('cell_id', cid);
            } else {
                plannerGrid[cid] = activeProjectId;
                await solproSupa.from('planner_grid').upsert({ cell_id: cid, project_id: activeProjectId });
            }
        }
        fullGridRepaintUI_Logic(); renderProjectsToTopPalette(); selectedCells = [];
    }

    function renderProjectsToTopPalette() {
        let container = document.getElementById('paletteUI');
        if(!container) return;
        container.innerHTML = canPlan() ? `<button class="btn-add" onclick="oeffneProjectCreatorModal()">+</button>` : '';
        projects.forEach(p => {
            let counts = Object.keys(plannerGrid).filter(k => plannerGrid[k] === p.id).length;
            let el = document.createElement('div');
            el.className = `palette-item ${activeProjectId === p.id ? 'active' : ''}`;
            el.style.backgroundColor = p.color; el.style.color = getLesbareTextfarbe(p.color);
            el.innerHTML = `<b>${p.name}</b> <span style="opacity:0.7;">${counts}T</span>`;
            el.onclick = () => { activeProjectId = p.id; renderProjectsToTopPalette(); };
            container.appendChild(el);
        });
        [{ id: 'ERASER', label: '🧼 Radierer' }, { id: 'SYS_VACATION', label: '🌴 Ausfall' }].forEach(t => {
            let el = document.createElement('div'); el.className = `palette-item ${(activeProjectId === t.id ? 'active' : '')}`; el.innerText = t.label; el.onclick = () => { activeProjectId = t.id; renderProjectsToTopPalette(); };
            container.appendChild(el);
        });
    }

    function oeffneProjectCreatorModal() {
        if(!canPlan()) return showToast('Keine Berechtigung!', 'error');
        document.getElementById('pModalTitle').innerText = "Neues Projekt"; document.getElementById('palEditId').value = ""; document.getElementById('palNameInput').value = ""; document.getElementById('palKwpInput').value = ""; 
        openPaletteModal();
    }

    async function savePaletteItem() {
        let name = document.getElementById('palNameInput').value.trim(); 
        let kwp = parseFloat(document.getElementById('palKwpInput').value) || 0;
        let id = document.getElementById('palEditId').value;
        if(!name) return showToast('Bitte einen Namen eingeben', 'error');
        
        let projData = { name, kwp, color: document.getElementById('palColorInput').value };
        if(id) {
            projData.id = id;
            await solproSupa.from('projects').upsert(projData);
        } else {
            const { data } = await solproSupa.from('projects').insert([projData]).select().single();
            projects.push(data);
            activeProjectId = data.id;
        }
        closeModals(); await refreshAllData(); renderProjectsToTopPalette();
    }

    async function openUserManagement() {
        if(userRole !== 'admin') return;
        const { data: users } = await solproSupa.from('profiles').select('*');
        const userListDiv = document.getElementById('userList');
        userListDiv.innerHTML = '';
        users.forEach(u => {
            const row = document.createElement('div');
            row.className = 'user-row';
            row.innerHTML = `<span>${u.email}</span><select onchange="updateUserRole('${u.id}', this.value)">
                <option value="viewer" ${u.role === 'viewer' ? 'selected' : ''}>Viewer</option>
                <option value="editor" ${u.role === 'editor' ? 'selected' : ''}>Editor</option>
                <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
            </select>`;
            userListDiv.appendChild(row);
        });
        document.getElementById('p_overlay').style.display = 'block';
        document.getElementById('userModal').style.display = 'block';
        setTimeout(() => document.getElementById('userModal').classList.add('show'), 10);
    }

    async function updateUserRole(userId, newRole) {
        await solproSupa.from('profiles').update({ role: newRole }).eq('id', userId);
        showToast(`Rolle aktualisiert`, "success");
    }

    function setupGlobalUiHandlers() {
        document.addEventListener('click', e => { if(!e.target.closest('.menu-wrap')) closeMenus(); });
    }
    function closeModals() {
        document.querySelectorAll('.modal').forEach(m => { m.classList.remove('show'); setTimeout(()=>m.style.display='none', 200); });
        document.getElementById('p_overlay').style.display = 'none';
    }
    function openPaletteModal() {
        document.getElementById('p_overlay').style.display = 'block';
        const m = document.getElementById('paletteModal');
        m.style.display = 'block';
        setTimeout(() => m.classList.add('show'), 10);
    }
    function toggleSystemLock() {
        if(!canPlan()) return;
        isAppLockedForEditing = !isAppLockedForEditing; 
        let btn = document.getElementById('lockStateBtn');
        if(isAppLockedForEditing){ document.body.classList.add('read-only-mode'); btn.className = 'btn mode-switch readonly'; btn.innerText = '🔒 Nur Lesen'; }
        else { document.body.classList.remove('read-only-mode'); btn.className = 'btn mode-switch planning'; btn.innerText = '✏️ Planen'; }
    }
    function fullGridRepaintUI_Logic() {
        document.querySelectorAll('.project-cell').forEach(c => { c.style.backgroundColor=""; c.style.color=""; c.innerText=""; });
        Object.keys(plannerGrid).forEach(k => {
            let p = projects.find(x=>x.id===plannerGrid[k]); let cell = document.getElementById(k);
            if(!cell) return;
            if(plannerGrid[k] === "SYS_VACATION") { cell.style.background="repeating-linear-gradient(45deg, #1e293b, #1e293b 8px, #0f172a 8px, #0f172a 16px)"; cell.innerText="AUSFALL"; return; }
            if(p) { cell.style.backgroundColor=p.color; cell.style.color=getLesbareTextfarbe(p.color); cell.innerText=p.name; }
        });
        evalDashboardMathemations();
    }
    function evalDashboardMathemations() {
        let netWork=0, lost=0, maxPossible=0;
        let activeBuses = baseFlottenListe.length - deactivatedBuses.length;
        document.querySelectorAll('[id^="COUNT_"]').forEach(f => {
            let dt = f.id.replace('COUNT_','');
            let dayLost=0, dayWork=0;
            Object.keys(plannerGrid).forEach(k => { if(k.includes(dt) && !deactivatedBuses.some(b=>k.includes(b))) { if(plannerGrid[k] === "SYS_VACATION") dayLost++; else dayWork++; } });
            let capThisDay = activeBuses - dayLost; netWork += dayWork; lost += dayLost; maxPossible += (capThisDay > 0 ? capThisDay : 0);
            f.innerText = dayWork + " / " + (capThisDay > 0 ? capThisDay : 0);
        });
        let rate = maxPossible > 0 ? Math.round((netWork/maxPossible)*100) : 0;
        document.getElementById('kpiCapRate').innerText = rate + "%";
        document.getElementById('kpiBarLine').style.width = rate + "%";
        document.getElementById('kpiTotalDays').innerText = netWork + " T";
        let totalKwp = 0;
        new Set(Object.values(plannerGrid)).forEach(pid => {
            let p = projects.find(x => x.id === pid);
            if(p) totalKwp += (p.kwp || 0);
        });
        document.getElementById('kpiTotalKwp').innerHTML = totalKwp + " <small style='font-size:10px;'>kWp</small>";
    }
    function getKalenderWocheMath(d){ let x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()+4-(x.getDay()||7)); return Math.ceil((((x-new Date(x.getFullYear(),0,1))/86400000)+1)/7); }
    function getLesbareTextfarbe(h){ h=h.replace('#',''); return (((parseInt(h.substr(0,2),16)*299)+(parseInt(h.substr(2,2),16)*587)+(parseInt(h.substr(4,2),16)*114))/1000)>=128?'#000':'#fff'; }
    function showToast(msg, type) {
        const stack = document.getElementById('toastStack');
        const t = document.createElement('div'); t.className = `toast`; t.style.borderColor = type === 'success' ? 'var(--success)' : (type === 'error' ? 'var(--danger)' : 'var(--panel-border)');
        t.innerText = msg; stack.appendChild(t);
        requestAnimationFrame(()=>t.classList.add('show'));
        setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 300); }, 3000);
    }
    function setView(m, b){ document.body.className=`view-${m}`; document.querySelectorAll('.controls .btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); }
    function closeMenus() { document.querySelectorAll('.dropdown-menu').forEach(m=>m.classList.remove('open')); }
</script>
