<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-device, initial-scale=1.0">
    <title>SOLPRO | TERMINAL V10.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis. constantly/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg-black: #000000;
            --bg-panel: #0a0a0a;
            --panel-border: #1a1a1a;
            --accent-lime: #D4FF00; /* Aggressives Fintech Neon */
            --text-main: #ffffff;
            --text-dim: #666666;
            --danger: #ff3366;
            --success: #00ff41;
            --font-mono: 'JetBrains Mono', monospace;
            --rad: 0px; /* Brutalist: Zero rounding */
        }

        * { box-sizing: border-box; }
        body {
            background: var(--bg-black); color: var(--text-main);
            font-family: 'Inter', sans-serif; margin: 0;
            overflow: hidden; display: flex; flex-direction: column; height: 100vh;
        }

        /* --- AUTH OVERLAY --- */
        #authOverlay {
            position: fixed; inset: 0; background: #000; z-index: 10000;
            display: flex; align-items: center; justify-content: center;
        }
        .auth-card {
            background: #000; border: 1px solid var(--accent-lime);
            padding: 40px; width: 360px; text-align: center;
        }
        .auth-card h2 { font-family: 'Orbitron'; margin: 0 0 20px 0; letter-spacing: 2px; }
        .auth-card label { display: block; text-align: left; font-size: 10px; color: var(--accent-lime); margin-top: 15px; font-family: var(--font-mono); }
        .auth-card input { 
            width: 100%; padding: 12px; margin-top: 5px; background: #111; 
            border: 1px solid var(--panel-border); color: #fff; font-family: var(--font-mono);
        }
        .auth-card button { 
            width: 100%; padding: 14px; margin-top: 25px; background: var(--accent-lime); 
            border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; font-family: var(--font-mono);
        }

        /* --- HUD & NAVIGATION --- */
        .hud { 
            height: 70px; background: #000; border-bottom: 1px solid var(--panel-border);
            display: flex; align-items: center; padding: 0 20px; gap: 25px; flex-shrink: 0;
        }
        .logo { font-family: 'Orbitron'; font-size: 22px; font-weight: 900; letter-spacing: -1px; }
        .logo span { color: var(--accent-lime); }

        .kpi-board { display: flex; gap: 0; border: 1px solid var(--panel-border); }
        .kpi-card { padding: 6px 15px; min-width: 110px; background: #000; border-right: 1px solid var(--panel-border); }
        .kpi-card:last-child { border-right: none; }
        .kpi-lbl { font-size: 9px; color: var(--text-dim); text-transform: uppercase; display: block; }
        .kpi-val { font-family: var(--font-mono); font-size: 16px; color: #fff; font-weight: 700; }
        .kpi-val.highlight { color: var(--accent-lime); }

        .palette-container { display: flex; align-items: center; flex-grow: 1; overflow-x: auto; gap: 6px; }
        .palette-item { 
            padding: 6px 12px; border: 1px solid var(--panel-border); background: #111; 
            font-size: 10px; font-weight: 700; color: #aaa; cursor: pointer; white-space: nowrap;
        }
        .palette-item.active { border-color: var(--accent-lime); color: #fff; }

        .controls { display: flex; gap: 8px; }
        .btn { background: #000; border: 1px solid var(--panel-border); padding: 8px 12px; font-size: 10px; font-weight: 700; cursor: pointer; color: #fff; font-family: var(--font-mono); text-transform: uppercase; }
        .btn:hover { border-color: var(--accent-lime); color: var(--accent-lime); }
        .btn.active { background: var(--accent-lime); color: #000; border-color: var(--accent-lime); }
        .btn.danger { color: var(--danger); border-color: var(--danger); }

        /* TABS */
        .nav-tabs { display: flex; background: #000; border-bottom: 1px solid var(--panel-border); }
        .nav-tab { padding: 12px 30px; font-size: 11px; font-family: var(--font-mono); cursor: pointer; color: var(--text-muted); }
        .nav-tab.active { color: var(--accent-lime); border-bottom: 2px solid var(--accent-lime); }

        /* MAIN CONTENT */
        .main-container { flex: 1; display: flex; overflow: hidden; }
        .viewport { flex: 1; overflow: auto; padding: 20px; }
        .sidebar { width: 300px; background: var(--bg-panel); border-left: 1px solid var(--panel-border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--panel-border); font-family: 'Orbitron'; font-size: 13px; }
        .sidebar-content { flex: 1; padding: 20px; overflow-y: auto; }

        /* TASK LIST STYLE */
        .todo-input-group { display: flex; gap: 5px; margin-bottom: 20px; }
        .todo-input-group input { flex: 1; background: #000; border: 1px solid var(--panel-border); color: #fff; padding: 10px; font-family: var(--font-mono); font-size: 12px; outline: none; }
        .todo-input-group button { background: var(--accent-lime); border: none; padding: 0 15px; cursor: pointer; font-weight: 800; font-family: var(--font-mono); }
        .todo-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: #1a1a1a; border: 1px solid var(--panel-border); margin-bottom: 5px; }
        .todo-item.done { opacity: 0.3; }
        .todo-item span { flex: 1; font-size: 12px; }
        .todo-item input[type="checkbox"] { accent-color: var(--accent-lime); }
        .del-task { color: var(--danger); cursor: pointer; font-size: 10px; }

        /* GRID STYLE */
        table { border-collapse: collapse; width: max-content; background: var(--bg-panel); border: 1px solid var(--panel-border); }
        th, td { border: 1px solid var(--panel-border); padding: 10px; font-family: var(--font-mono); font-size: 11px; }
        th { background: #000; color: var(--text-muted); text-transform: uppercase; font-size: 10px; }
        td:first-child { position: sticky; left: 0; z-index: 80; background: #111; font-weight: 700; color: #fff; width: 150px; border-right: 2px solid var(--accent-lime); }
        .project-cell { height: 40px; cursor: crosshair; font-weight: 700; text-transform: uppercase; }
        .stat-row td { background: #000 !important; font-weight: 800; color: var(--accent-lime); }

        /* MODALS */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 5000; display: none; }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg-panel); border: 1px solid var(--accent-lime); padding: 30px; z-index: 5001; width: 380px; display: none; }
        .modal.show { display: block; }
        .modal h2 { font-family: 'Orbitron'; margin: 0 0 20px 0; font-size: 15px; border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; }
        .modal label { display: block; font-size: 10px; color: var(--text-muted); margin-top: 15px; font-weight: 700; }
        .modal input { width: 100%; padding: 10px; background: #000; border: 1px solid var(--panel-border); color: #fff; font-family: var(--font-mono); margin-top: 5px; }
        .m-btns { display: flex; gap: 10px; margin-top: 25px; }
        .m-btn { flex: 1; padding: 10px; border: none; cursor: pointer; font-family: var(--font-mono); font-weight: 700; }
        .m-save { background: var(--accent-lime); color: #000; }
        .m-cancel { background: transparent; color: #fff; border: 1px solid var(--panel-border); }

        /* TOASTS */
        .toast-stack { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: #000; border: 1px solid var(--accent-lime); color: #fff; padding: 12px 20px; font-size: 12px; font-family: var(--font-mono); opacity: 0; transition: 0.3s; }
        .toast.show { opacity: 1; }
        .toast.err { border-color: var(--danger); }

        .sel-highlight { outline: 1px solid var(--accent-lime); outline-offset: -1px; background: var(--volt-dim); }
    </style>
</head>
<body>

<!-- AUTH LAYER -->
<div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
        <h2>SOL<span>PRO</span></h2>
        <p style="font-size:10px; color:var(--text-muted); font-family:var(--font-mono);">AUTHENTICATION_PROTOCOL_V10</p>
        <label>OPERATOR_ID</label>
        <input type="email" id="loginEmail" placeholder="user@solpro.at">
        <label>PASSKEY</label>
        <input type="password" id="loginPass" placeholder="••••••••">
        <button id="loginBtn" onclick="handleLogin()">Access System</button>
        <div id="authStatus" style="margin-top:15px; font-size:10px; color:var(--danger); font-family:var(--font-mono);"></div>
    </div>
</div>

<!-- MAIN INTERFACE -->
<div class="accent-line"></div>
<div class="hud">
    <div class="brand"><div class="logo">SOL<span>PRO</span></div></div>
    <div class="kpi-board">
        <div class="kpi-card"><span class="kpi-lbl">UTILIZATION</span><span class="kpi-val" id="kpiCapRate">0%</span></div>
        <div class="kpi-card"><span class="kpi-lbl">TOTAL_DAYS</span><span class="kpi-val" id="kpiTotalDays">0 T</span></div>
        <div class="kpi-card"><span class="kpi-lbl">VOLUME</span><span class="kpi-val highlight" id="kpiTotalKwp">0 <small>kWp</small></span></div>
    </div>
    <div class="palette-container" id="paletteUI"></div>
    <div class        ="controls">
        <button class="btn" id="userBtn" style="display:none" onclick="openUserManagement()">USER_MGT</button>
        <button class="btn" onclick="refreshAllData()">SYNC</button>
        <button class="btn primary" id="lockStateBtn" onclick="toggleSystemLock()">PLAN_MODE</button>
        <button class="btn danger" onclick="handleLogout()">LOGOUT</button>
    </div>
</div>

<div class="nav-tabs">
    <div class="nav-tab active" id="tab-planner" onclick="switchView('planner')">[ PLANNER ]</div>
    <div class="nav-tab" id="tab-tasks" onclick="switchView('tasks')">[ TASKS ]</div>
</div>

<div class="main-wrapper">
    <div class="viewport" id="view-planner">
        <table id="theTable"><thead id="gridHead"></thead><tbody id="gridBody"></tbody></table>
    </div>
    <div class="viewport" id="view-tasks" style="display:none;">
        <div style="max-width:600px; margin: 0 auto;">
            <h2 style="font-family:var(--font-mono); font-size:16px; color:#fff; text-transform:uppercase;">Command_Tasks</h2>
            <div class="todo-input-group">
                <input type="text" id="todoInput" placeholder="Enter task command...">
                <button onclick="addTodo()">ADD</button>
            </div>
            <div id="todoList"></div>
        </div>
    </div>
    <div class="sidebar">
        <div class="sidebar-header"><h3>SYSTEM_LOG</h3></div>
        <div class="sidebar-content" style="font-size:10px; font-family:var(--font-mono); color:var(--text-muted); line-height:1.6;">
            OPERATOR: <span id="userEmailDisp" style="color:#fff;">-</span><br>
            ROLE: <span id="userRoleDisp" style="color:var(--accent-lime);">-</span><br>
            STATUS: <span style="color:var(--success);">ONLINE</span>
        </div>
    </div>
</div>

<!-- MODALS & CONTEXT -->
<div id="actionGridCtx" style="display:none; position:fixed; z-index:9000; background:#111; border:1px solid var(--accent-lime); padding:5px; width:180px; box-shadow:0 10px 30px #000;"></div>
<div class="overlay" id="p_overlay" onclick="closeModals()"></div>
<div class="modal" id="paletteModal">
    <h2 id="pModalTitle">PROJ_CFG</h2>
    <label>ID</label><input type="text" id="palNameInput">
    <label>kWp</label><input type="number" id="palKwpInput">
    <label>COLOR</label><input type="color" id="palColorInput" style="height:30px">
    <input type="hidden" id="palEditId">
    <div class="m-btns">
        <button class="m-btn m-save" onclick="savePaletteItem()">COMMIT</button>
        <button class="m-btn m-cancel" onclick="closeModals()">ABORT</button>
    </div>
    <button class="m-btn" id="palDelBtn" onclick="deletePaletteItem()" style="display:none; width:100%; margin-top:10px; background:transparent; color:var(--danger); border:1px solid var(--danger);">PURGE</button>
</div>

<div class="modal" id="userModal">
    <h2>USER_MGT</h2>
    <div id="userList" style="max-height:300px; overflow-y:auto;"></div>
    <div class="m-btns"><button class="m-btn m-cancel" onclick="closeModals()">CLOSE</button></div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script>
    /* ==========================================
       CORE CONFIG
       ========================================== */
    const SUPABASE_URL = "https://iuxklqcpexoziqxrohwa.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VteOTQ6g28z9Dvo-QUG8jw_hehaZpWu";
    const solproSupa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null, userRole = 'viewer';
    let projects = [], plannerGrid = {}, deactivatedBuses = [], todos = [];
    let activeProjectId = "ERASER", isDrawing = false, selectedCells = [], isAppLockedForEditing = false;
    let contextCtxMenuPID = null, selectedCellDomID = null, highlightTimer = null;
    const baseFlottenListe = ["SOL 2", "SOL 3", "SOL 4", "SOL 12", "SOL 16"];
    const managementFarben = ["#1e3a8a","#0284c7","#059669","#ca8a04","#b91c1c","#6d28d9","#0f766e","#a21caf","#4f46e5","#b45309","#4338ca","#064e3b"];

    // ==========================================
    // AUTH LOGIC
    // ==========================================
    async function handleLogin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPass').value;
        const status = document.getElementById('authStatus');
        const btn = document.getElementById('loginBtn');

        if(!email || !password) return (status.innerText = "ERR: MISSING_CREDS");
        btn.innerText = "VERIFYING..."; btn.disabled = true;

        try {
            const { data, error } = await solproSupa.auth.signInWithPassword({ email, password });
            if (error) throw error;
            currentUser = data.user;
            await fetchUserRole();
            document.getElementById('authOverlay').style.display = 'none';
            startApp();
        } catch (e) {
            status.innerText = "ERR: " + e.message.toUpperCase();
            btn.innerText = "LOGIN"; btn.disabled = false;
        }
    }

    async function fetchUserRole() {
        const { data, error } = await solproSupa.from('profiles').select('role').eq('id', currentUser.id).single();
        if (data) userRole = data.role;
        else {
            await solproSupa.from('profiles').insert([{ id: currentUser.id, email: currentUser.email, role: 'viewer' }]);
            userRole = 'viewer';
        }
        document.getElementById('userRoleDisp').innerText = userRole.toUpperCase();
        document.getElementById('userEmailDisp').innerText = currentUser.email.split('@')[0].toUpperCase();
        if(userRole === 'admin') document.getElementById('userBtn').style.display = 'block';
    }

    function handleLogout() { solproSupa.auth.signOut(); window.location.reload(); }

    // ==========================================
    // APP CORE
    // ==========================================
    async function startApp() {
        buildGrid();
        await refreshAllData();
        await loadTodos();
        renderProjectsToTopPalette();
        setupMouseDragPainting();
        setupGlobalUiHandlers();
    }

    async function refreshAllData() {
        try {
            const { data: pData } = await solproSupa.from('projects').select('*');
            projects = pData || [];
            const { data: gData } = await solproSupa.from('planner_grid').select('*');
            plannerGrid = {};
            (gData || []).forEach(row => { plannerGrid[row.cell_id] = row.project_id; });
            const { data: fData } = await solproSupa.from('fleet_status').select('*');
            deactivatedBuses = (fData || []).filter(row => row.is_offline).map(row => row.bus_id);
            
            fullGridRepaintUI_Logic();
            renderProjectsToTopPalette();
            showToast("SYNC_OK", "success");
        } catch (e) { showToast("SYNC_ERR", "error"); }
    }

    async function loadTodos() {
        const { data } = await solproSupa.from('todos').select('*').eq('user_id', currentUser.id).order('id', { ascending: false });
        todos = data || [];
        renderTodos();
    }

    // ==========================================
    // GRID LOGIC
    // ==========================================
    function buildGrid() {
        const thead = document.getElementById('gridHead'); const tbody = document.getElementById('gridBody');
        let currentDay = new Date(2026, 7, 17); const endDate = new Date(2026, 11, 31); const dateArray = [];
        while(currentDay <= endDate) { if(currentDay.getDay()!==0 && currentDay.getDay()!==6) dateArray.push(new Date(currentDay)); currentDay.setDate(currentDay.getDate()+1); }
        
        let trMonat = `<tr><th rowspan="3" class="fixed-corner"><div class="logo" style="font-size:14px;">SOL<span>PRO</span></div></th>`;
        let trKW = `<tr>`, trTage = `<tr>`;
        let lastM=-1, mSpans=[], lastKW=-1, kwSpans=[];
        dateArray.forEach(d => {
            let m=d.getMonth(), kw=getKalenderWocheMath(d);
            if(m!==lastM){ mSpans.push({label:d.toLocaleString('de-DE',{month:'short'}).toUpperCase(), count:1}); lastM=m; } else mSpans[mSpans.length-1].count++;
            if(kw!==lastKW){ kwSpans.push({label:'W'+kw, count:1}); lastKW=kw; } else kwSpans[kwSpans.length-1].count++;
        });
        mSpans.forEach(ms => trMonat += `<th colspan="${ms.count}">${ms.label}</th>`);
        kwSpans.forEach(ks => trKW += `<th colspan="${ks.count}">${ks.label}</th>`);
        dateArray.forEach(d => {
            let iso = d.toISOString().split('T')[0];
            trTage += `<th id="th-${iso}" class="${d.getDay()===1?'monday-start':''}"><div class="day-num">${d.getDate()}</div><div class="day-short">${d.toLocaleString('de-DE',{weekday:'short'})}</div></th>`;
        });
        thead.innerHTML = trMonat + `</tr>` + trKW + `</tr>` + trTage + `</tr>`;

        baseFlottenListe.forEach(w => {
            let sf = w.replace(/\s+/g,'_');
            let rw = `<tr id="row_${sf}" class="worker-row is-active"><td><div class="bus-ctrl" style="display:flex; align-items:center; justify-content:space-between; width:100%; font-family:var(--font-mono); font-size:11px;"><span>${w}</span><button class="toggle-btn ${deactivatedBuses.includes(sf)?'inactive':'active'}" onclick="toggleBusState('${sf}')"></button></div></td>`;
            dateArray.forEach(d => {
                let iso = d.toISOString().split('T')[0];
                rw += `<td id="CELL_${sf}_${iso}" class="project-cell${(d.getDay()===1?' monday-start':'')}" data-date-ts="${d.getTime()}"></td>`;
            });
            tbody.insertAdjacentHTML('beforeend', rw + `</tr>`);
        });
        let fRow = `<tr class="stat-row"><td>AGGREGATE</td>`;
        dateArray.forEach(d => fRow += `<td id="COUNT_${d.toISOString().split('T')[0]}">0</td>`);
        tbody.insertAdjacentHTML('beforeend', fRow + `</tr>`);
    }

    async function toggleBusState(sid) {
        if(userRole === 'viewer') return;
        const isNowOffline = !deactivatedBuses.includes(sid);
        if(isNowOffline) { deactivatedBuses.push(sid); document.getElementById('row_'+sid).classList.replace('is-active','is-offline'); }
        else { deactivatedBuses=deactivatedBuses.filter(v=>v!==sid); document.getElementById('row_'+sid).classList.replace('is-offline','is-active'); }
        await solproSupa.from('fleet_status').upsert({ bus_id: sid, is_offline: isNowOffline });
        fullGridRepaintUI_Logic();
    }

    function setupMouseDragPainting() {
        document.addEventListener('mousedown', e => {
            if (e.target.classList.contains('project-cell') && e.button === 0) {
                if(isAppLockedForEditing || userRole === 'viewer') return;
                isDrawing = true; selectedCells = [e.target.id]; e.target.classList.add('selecting'); e.target.style.outline = "1px solid #fff";
            }
            if (e.target.classList.contains('project-cell') && e.button === 2) {
                if(isAppLockedForEditing || userRole === 'viewer') return; e.preventDefault(); selectedCellDomID = e.target.id;
                bautHtmlFurDasActionContextMenu(); let cm=document.getElementById('actionGridCtx'); cm.style.display="block"; cm.style.left=e.clientX+"px"; cm.style.top=e.clientY+"px";
            }
        });
        document.addEventListener('mouseover', e => { 
            if(isDrawing && e.target.classList.contains('project-cell') && !selectedCells.includes(e.target.id)) { 
                selectedCells.push(e.target.id); e.target.classList.add('selecting'); e.target.style.outline = "1px solid #fff";
            } 
        });
        document.addEventListener('mouseup', e => { 
            if(isDrawing && e.button === 0 && selectedCells.length > 0) { verarbeiteMalerZugAufGrid(); } 
            document.querySelectorAll('.selecting').forEach(nd => { nd.classList.remove('selecting'); nd.style.outline=""; }); isDrawing = false; 
        });
    }

    async function verarbeiteMalerZugAufGrid() {
        for(let cid of selectedCells) {
            if(activeProjectId === "ERASER") {
                delete plannerGrid[cid];
                await solproSupa.from('planner_grid').delete().eq('cell_id', cid);
            } else {
                plannerGrid[cid] = activeProjectId;
                await solproSupa.from('planner_grid').upsert({ cell_id: cid, project_id: activeProjectId });
            }
        }
        fullGridRepaintUI_Logic(); renderProjectsToTopPalette(); selectedCells = [];
    }

    function bautHtmlFurDasActionContextMenu() {
        let ActionPanel = document.getElementById('actionGridCtx');
        let prj = projects.find(p => p.id === activeProjectId);
        let content = `
            ${(activeProjectId !== 'ERASER' && activeProjectId !== 'SYS_VACATION' && prj)
            ? `<button onclick="fireAction('FILL_PROJECT')" style="color:${prj.color};">SET_WEEK [${prj.name}]</button><hr>` : ''}
            <button onclick="fireAction('FILL_URLAUB')">SET_WEEK_OFFLINE</button>
            <hr>
            ${canDelete() ? `<button onclick="fireAction('DELETE_WEEK')" class="danger-text">PURGE_WEEK</button>` : ''}
            ${canDelete() ? `<button onclick="fireAction('DELETE_CELL')" class="danger-text">PURGE_CELL</button>` : ''}
        `;
        ActionPanel.innerHTML = content;
    }

    async function fireAction(cmd) {
        document.getElementById('actionGridCtx').style.display = 'none';
        if(!selectedCellDomID) return;
        
        if(cmd === 'DELETE_CELL') { 
            if(!canDelete()) return showToast("NO_PERM", "error");
            delete plannerGrid[selectedCellDomID]; 
            await solproSupa.from('planner_grid').delete().eq('cell_id', selectedCellDomID);
            fullGridRepaintUI_Logic(); renderProjectsToTopPalette(); return; 
        }
        
        let parts = selectedCellDomID.split('_');
        let targetDateStr = parts.pop(); parts.shift();
        let targetBusID = parts.join('_');
        let targetKW = getKalenderWocheMath(new Date(targetDateStr));

        document.querySelectorAll(`.project-cell`).forEach(async cell => {
            if(cell.id.includes(targetBusID)) {
                let cellKW = getKalenderWocheMath(new Date(Number(cell.getAttribute('data-date-ts'))));
                if(cellKW === targetKW) {
                    if(cmd === 'DELETE_WEEK') { 
                        delete plannerGrid[cell.id]; 
                        await solproSupa.from('planner_grid').delete().eq('cell_id', cell.id);
                    }
                    if(cmd === 'FILL_URLAUB') { 
                        plannerGrid[cell.id] = "SYS_VACATION"; 
                        await solproSupa.from('planner_grid').upsert({ cell_id: cell.id, project_id: "SYS_VACATION" });
                    }
                    if(cmd === 'FILL_PROJECT' && activeProjectId) { 
                        plannerGrid[cell.id] = activeProjectId; 
                        await solproSupa.from('planner_grid').upsert({ cell_id: cell.id, project_id: activeProjectId });
                    }
                }
            }
        });
        fullGridRepaintUI_Logic(); renderProjectsToTopPalette();
    }

    function renderProjectsToTopPalette() {
        let container = document.getElementById('paletteUI');
        if(!container) return;
        container.innerHTML = canPlan() ? `<button class="btn-add" onclick="oeffneProjectCreatorModal()">+</button>` : '';
        projects.forEach(p => {
            let counts = Object.keys(plannerGrid).filter(k => plannerGrid[k] === p.id).length;
            let el = document.createElement('div');
            el.className = `palette-item ${activeProjectId === p.id ? 'active' : ''}`;
            el.innerHTML = `<div class="palette-color-dot" style="background:${p.color};"></div><b>${p.name}</b> <span style="opacity:0.5;">${counts}T</span>`;
            el.onclick = () => { activeProjectId = p.id; renderProjectsToTopPalette(); };
            el.oncontextmenu = (e) => { e.preventDefault(); e.stopPropagation(); if(!canPlan()) return; document.getElementById('palEditId').value = p.id; document.getElementById('palNameInput').value = p.name; document.getElementById('palKwpInput').value = p.kwp || 0; document.getElementById('palColorInput').value = p.color; document.getElementById('palDelBtn').style.display = canDelete() ? "block" : "none"; document.getElementById('pModalTitle').innerText = "EDIT_PROJECT"; openPaletteModal(); };
            container.appendChild(el);
        });
        [{ id: 'ERASER', label: 'ERASER', c: '#fff' }, { id: 'SYS_VACATION', label: 'OFFLINE', c: '#D4FF00' }].forEach(t => {
            let el = document.createElement('div'); el.className = `palette-item ${(activeProjectId === t.id ? 'active' : '')}`; 
            el.innerHTML = `<div class="palette-color-dot" style="background:${t.c};"></div><b>${t.label}</b>`;
            el.onclick = () => { activeProjectId = t.id; renderProjectsToTopPalette(); };
            container.appendChild(el);
        });
    }

    function oeffneProjectCreatorModal() {
        if(!canPlan()) return showToast('ERR_AUTH', 'error');
        if(isAppLockedForEditing) return;
        document.getElementById('pModalTitle').innerText = "NEW_PROJECT"; document.getElementById('palEditId').value = ""; document.getElementById('palNameInput').value = ""; document.getElementById('palKwpInput').value = ""; document.getElementById('palColorInput').value = "#a4c639"; 
        document.getElementById('palDelBtn').style.display = "none";
        openPaletteModal();
    }

    async function savePaletteItem() {
        let name = document.getElementById('palNameInput').value.trim(); 
        let kwp = parseFloat(document.getElementById('palKwpInput').value) || 0;
        let id = document.getElementById('palEditId').value;
        if(!name) return showToast('ERR_MISSING_NAME', 'error');
        
        let projData = { name, kwp, color: document.getElementById('palColorInput').value };
        if(id) {
            projData.id = id;
            await solproSupa.from('projects').upsert(projData);
        } else {
            const { data } = await solproSupa.from('projects').insert([projData]).select().single();
            projects.push(data);
            activeProjectId = data.id;
        }
        closeModals(); await refreshAllData(); renderProjectsToTopPalette();
    }

    async function deletePaletteItem() {
        if(!canDelete()) return;
        let id = document.getElementById('palEditId').value; 
        await solproSupa.from('projects').delete().eq('id', id);
        await solproSupa.from('planner_grid').delete().eq('project_id', id);
        closeModals(); await refreshAllData(); renderProjectsToTopPalette();
    }

    // ==========================================
    // TASK & USER MANAGEMENT
    // ==========================================
    async function addTodo() {
        const input = document.getElementById('todoInput');
        const task = input.value.trim();
        if(!task) return;
        const { data, error } = await solproSupa.from('todos').insert([{ task, user_id: currentUser.id, is_completed: false }]).select().single();
        if(error) return showToast("ERR_SAVE", "error");
        input.value = ""; todos.unshift(data); renderTodos();
    }

    async function toggleTodo(id, status) {
        await solproSupa.from('todos').update({ is_completed: !status }).eq('id', id);
        await loadTodos();
    }

    async function deleteTodo(id) {
        await solproSupa.from('todos').delete().eq('id', id);
        await loadTodos();
    }

    function renderTodos() {
        const list = document.getElementById('todoList');
        list.innerHTML = '';
        todos.forEach(t => {
            const div = document.createElement('div');
            div.className = `todo-item ${t.is_completed ? 'done' : ''}`;
            div.innerHTML = `<input type="checkbox" ${t.is_completed ? 'checked' : ''} onclick="toggleTodo('${t.id}', ${t.is_completed})"><span>${t.task}</span><div class="del-task" onclick="deleteTodo('${t.id}')">DEL</div>`;
            list.appendChild(div);
        });
        document.getElementById('taskCount').innerText = `${todos.filter(t=>!t.is_completed).length} ACTIVE`;
    }

    async function openUserManagement() {
        if(userRole !== 'admin') return;
        const { data } = await solproSupa.from('profiles').select('*');
        const list = document.getElementById('userList');
        list.innerHTML = '';
        data.forEach(u => {
            const row = document.createElement('div');
            row.className = 'user-row';
            row.innerHTML = `<span>${u.email}</span><select onchange="updateUserRole('${u.id}', this.value)">
                <option value="viewer" ${u.role === 'viewer' ? 'selected' : ''}>VIEWER</option>
                <option value="editor" ${u.role === 'editor' ? 'selected' : ''}>EDITOR</option>
                <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>ADMIN</option>
            </select>`;
            list.appendChild(row);
        });
        document.getElementById('p_overlay').style.display = 'block';
        document.getElementById('userModal').style.display = 'block';
        setTimeout(() => document.getElementById('userModal').classList.add('show'), 10);
    }

    async function updateUserRole(userId, newRole) {
        await solproSupa.from('profiles').update({ role: newRole }).eq('id', userId);
        showToast(`ROLE_UPDATED: ${newRole}`, "success");
    }

    // ==========================================
    // SYSTEM UTILS
    // ==========================================
    function toggleSystemLock() {
        if(!canPlan()) return;
        isAppLockedForEditing = !isAppLockedForEditing; 
        let btn = document.getElementById('lockStateBtn');
        if(isAppLockedForEditing){ btn.className = 'btn readonly'; btn.innerText = 'READ_ONLY'; }
        else { btn.className = 'btn primary'; btn.innerText = 'PLAN_MODE'; }
    }

    function setView(view, el) {
        document.querySelectorAll('.view-layer').forEach(v => v.style.display = 'none');
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`view-${view}`).style.display = 'block';
        el.classList.add('active');
    }

    function fullGridRepaintUI_Logic() {
        document.querySelectorAll('.project-cell').forEach(c => { c.style.backgroundColor="transparent"; c.innerText=""; c.style.color="#fff"; });
        Object.keys(plannerGrid).forEach(k => {
            let p = projects.find(x=>x.id===plannerGrid[k]); let cell = document.getElementById(k);
            if(!cell) return;
            if(plannerGrid[k] === "SYS_VACATION") { cell.style.background="repeating-linear-gradient(45deg, #1a1a1a, #1a1a1a 8px, #000 8px, #000 16px)"; cell.innerText="OFF"; cell.style.color="var(--text-muted)"; return; }
            if(p) { cell.style.backgroundColor=p.color; cell.style.color="#000"; cell.innerText=p.name; }
        });
        evalDashboardMathemations();
    }

    function evalDashboardMathemations() {
        let netWork=0, lost=0, maxPossible=0;
        let activeBuses = baseFlottenListe.length - deactivatedBuses.length;
        document.querySelectorAll('[id^="COUNT_"]').forEach(f => {
            let dt = f.id.replace('COUNT_','');
            let dayLost=0, dayWork=0;
            Object.keys(plannerGrid).forEach(k => { if(k.includes(dt) && !deactivatedBuses.some(b=>k.includes(b))) { if(plannerGrid[k] === "SYS_VACATION") dayLost++; else dayWork++; } });
            let capThisDay = activeBuses - dayLost; netWork += dayWork; lost += dayLost; maxPossible += (capThisDay > 0 ? capThisDay : 0);
            f.innerText = dayWork + "/" + (capThisDay > 0 ? capThisDay : 0);
        });
        let rate = maxPossible > 0 ? Math.round((netWork/maxPossible)*100) : 0;
        document.getElementById('kpiCapRate').innerText = rate + "%";
        document.getElementById('kpiTotalDays').innerText = netWork + " T";
        let totalKwp = 0;
        new Set(Object.values(plannerGrid)).forEach(pid => {
            let p = projects.find(x => x.id === pid);
            if(p) totalKwp += (p.kwp || 0);
        });
        document.getElementById('kpiTotalKwp').innerHTML = totalKwp + " <small>kWp</small>";
    }

    function openPaletteModal() {
        document.getElementById('p_overlay').style.display = 'block';
        const m = document.getElementById('paletteModal');
        m.style.display = 'block';
        setTimeout(() => m.classList.add('show'), 10);
    }

    function closeModals() {
        document.querySelectorAll('.modal').forEach(m => { m.classList.remove('show'); m.style.display = 'none'; });
        document.getElementById('p_overlay').style.display = 'none';
    }

    function setupGlobalUiHandlers() {
        document.addEventListener('click', e => { 
            if(!e.target.closest('.menu-wrap') && !e.target.closest('.nav-tab')) {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                document.getElementById('tab-planner').classList.add('active');
                document.getElementById('tab-tasks').classList.remove('active');
                document.getElementById('view-planner').style.display = 'block';
                document.getElementById('view-tasks').style.display = 'none';
            }
            if(!e.target.closest('#actionGridCtx')) document.getElementById('actionGridCtx').style.display = 'none';
        });
    }

    function getKalenderWocheMath(d){ let x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()+4-(x.getDay()||7)); return Math.ceil((((x-new Date(x.getFullYear(),0,1))/86400000)+1)/7); }
    function getLesbareTextfarbe(h){ return "#000"; }
    function showToast(msg, type) {
        const stack = document.getElementById('toastStack');
        const t = document.createElement('div'); t.className = `toast ${type === 'error' ? 'err' : ''}`;
        t.innerText = msg; stack.appendChild(t);
        setTimeout(() => t.classList.add('show'), 10);
        setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
    }
    function nuclearSystemReset() { if(confirm("DATA_PURGE: Wipe all local state?")) { localStorage.clear(); window.location.reload(); } }
    function renderProjectsToTopPalette() { /* already implemented above */ }
    function setupMouseDragPainting() { /* already implemented above */ }

    // START
    window.onload = () => {
        console.log("SOLPRO V10.0 Online.");
    };
    
    // Important: This calls the actually init
    async function startApp_wrapper() {
        await startApp();
    }
    // Call real start
    startApp();

</script>
