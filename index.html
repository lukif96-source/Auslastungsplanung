<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLPRO | Executive Dashboard V10.1</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap');

        :root {
            --bg-dark: #0f172a; /* Sattes Deep-Slate statt Pure Black */
            --panel-bg: #1e293b;
            --panel-border: rgba(255, 255, 255, 0.1);
            --sol-lime: #a4c639; 
            --sol-lime-glow: rgba(164, 198, 57, 0.3);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --danger: #f43f5e;
            --success: #10b981;
            --rad-sm: 6px;
            --rad-md: 12px;
            --font-mono: 'JetBrains Mono', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; }
        body {
            background: var(--bg-dark); color: var(--text-main); font-family: 'Inter', sans-serif;
            margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; user-select: none;
        }

        /* AUTH SYSTEM */
        .auth-overlay {
            position: fixed; inset: 0; background: #020617; z-index: 10000;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(15px);
        }
        .auth-card {
            background: var(--panel-bg); border: 1px solid var(--panel-border);
            padding: 40px; border-radius: 20px; width: 400px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .auth-card h2 { font-family: 'Orbitron'; margin-bottom: 20px; color: #fff; }
        .auth-card input { 
            width: 100%; padding: 12px; margin: 10px 0; background: #000; 
            border: 1px solid var(--panel-border); border-radius: var(--rad-sm); color: #fff; font-size: 14px;
        }
        .auth-card button { 
            width: 100%; padding: 14px; margin-top: 20px; background: var(--sol-lime); border: none; 
            font-weight: 800; cursor: pointer; border-radius: var(--rad-sm); color: #000; text-transform: uppercase;
        }

        /* HUD NAVIGATION */
        .hud { 
            height: 70px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--panel-border); display: flex; align-items: center; 
            padding: 0 20px; gap: 20px; z-index: 3000; flex-shrink: 0; 
        }
        .logo { font-family: 'Orbitron'; font-size: 22px; font-weight: 900; color: #fff; }
        .logo span { color: var(--sol-lime); }

        .kpi-board { display: flex; gap: 10px; border-left: 1px solid var(--panel-border); padding-left: 20px; }
        .kpi-card { background: rgba(255,255,255,0.03); padding: 8px 15px; border-radius: var(--rad-sm); border: 1px solid var(--panel-border); }
        .kpi-lbl { font-size: 9px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
        .kpi-val { font-family: var(--font-mono); font-size: 18px; font-weight: 700; color: #fff; display: block; }

        .palette-container { display: flex; align-items: center; flex-grow: 1; overflow-x: auto; gap: 8px; padding: 0 10px; }
        .palette-item { 
            padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; 
            border: 1px solid var(--panel-border); background: var(--panel-bg); color: #fff; display: flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .palette-item.active { border-color: var(--sol-lime); box-shadow: 0 0 10px var(--sol-lime-glow); }
        .btn-add { width: 30px; height: 30px; border-radius: 50%; background: var(--sol-lime); border: none; font-size: 18px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #000; }

        .controls { display: flex; gap: 8px; align-items: center; }
        .btn { background: transparent; border: 1px solid var(--panel-border); padding: 8px 12px; font-size: 11px; font-weight: 700; cursor: pointer; border-radius: var(--rad-sm); color: var(--text-main); transition: 0.2s; text-transform: uppercase; }
        .btn:hover { background: rgba(255,255,255,0.05); }
        .btn.active { background: var(--sol-lime); color: #000; border-color: var(--sol-lime); }
        .btn.mode-switch { background: var(--success-bg); color: var(--success); border-color: rgba(16, 185, 129, 0.3); }
        .btn.readonly { background: var(--danger-bg); color: var(--danger); border-color: rgba(244, 63, 94, 0.3); }

        /* MAIN VIEWS */
        .main-wrapper { display: flex; flex: 1; overflow: hidden; }
        .viewport { flex: 1; overflow: auto; position: relative; padding: 15px; }
        
        .nav-tabs { display: flex; background: var(--panel-bg); border-bottom: 1px solid var(--border); padding: 0 20px; gap: 2px; }
        .nav-tab { padding: 12px 20px; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--text-muted); transition: 0.2s; }
        .nav-tab.active { background: var(--bg-dark); color: var(--sol-lime); border-bottom: 2px solid var(--sol-lime); }

        /* GRID TABLE */
        table { border-collapse: separate; border-spacing: 0; width: max-content; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: var(--rad-md); overflow: hidden; }
        th, td { border: 1px solid var(--panel-border); text-align: center; }
        #gridHead th { position: sticky; top: 0; background: #0f172a; font-size: 10px; font-weight: 800; color: var(--text-muted); z-index: 100; text-transform: uppercase; }
        td:first-child { position: sticky; left: 0; z-index: 80; background: #1e293b; width: 150px !important; text-align: left; padding-left: 15px; font-weight: 800; border-right: 2px solid var(--sol-lime); color: #fff; font-size: 12px; }
        
        .project-cell { height: 52px; cursor: crosshair; font-size: 10px; font-weight: 800; text-transform: uppercase; transition: 0.1s; color: #fff; }
        .project-cell:hover { filter: brightness(1.2); outline: 1px solid #fff; }
        .monday-start { border-left: 2px solid var(--sol-lime) !important; }

        /* BUS CONTROLS */
        .bus-ctrl { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .toggle-btn { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--border); background: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .toggle-btn.active { background: var(--sol-lime); border-color: var(--sol-lime); color: #000; }
        .toggle-btn.active::after { content: '✓'; font-size: 10px; font-weight: 900; }
        .toggle-btn.inactive { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
        .toggle-btn.inactive::after { content: '✕'; font-size: 10px; font-weight: 900; }

        .stat-row td { background: #0f172a !important; color: var(--text-main); font-family: var(--font-mono); font-size: 11px; }

        /* SIDEBAR & TO-DOS */
        .sidebar { width: 320px; background: var(--panel-bg); border-left: 1px solid var(--panel-border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--panel-border); }
        .sidebar-header h3 { margin: 0; font-family: 'Orbitron'; font-size: 14px; color: #fff; }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 20px; }
        .todo-input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .todo-input-group input { flex: 1; padding: 10px; background: #000; border: 1px solid var(--panel-border); border-radius: var(--rad-sm); color: #fff; font-size: 12px; }
        .todo-input-group button { background: var(--sol-lime); border: none; padding: 0 12px; border-radius: var(--rad-sm); cursor: pointer; font-weight: 800; }
        .todo-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--panel-border); border-radius: var(--rad-sm); margin-bottom: 8px; transition: 0.2s; }
        .todo-item:hover { background: rgba(255,255,255,0.08); }
        .todo-item.done { opacity: 0.4; }
        .todo-item.done span { text-decoration: line-through; }
        .todo-item span { flex: 1; font-size: 12px; color: var(--text-main); }

        /* MODALS */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 5000; display: none; }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--panel-bg); border: 1px solid var(--panel-border); padding: 25px; border-radius: var(--rad-md); display: none; z-index: 5001; width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .modal.show { opacity: 1; }
        .modal h2 { margin-top: 0; font-family: 'Orbitron'; font-size: 16px; border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; color: #fff; }
        .modal label { display: block; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-top: 12px; }
        .modal input { width: 100%; padding: 10px; background: #000; border: 1px solid var(--panel-border); border-radius: var(--rad-sm); margin-top: 5px; color: #fff; }
        .m-btns { display: flex; gap: 10px; margin-top: 20px; }
        .m-btn { flex: 1; padding: 10px; border: none; font-weight: 700; border-radius: var(--rad-sm); cursor: pointer; font-size: 12px; transition: 0.2s; }
        .m-save { background: var(--sol-lime); color: #000; }
        .m-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--panel-border); }

        .toast-stack { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast { background: var(--panel-bg); color: #fff; border: 1px solid var(--//_panel-border); padding: 10px 16px; border-radius: var(--rad-sm); font-size: 12px; opacity: 0; transition: 0.3s; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
        <h2>SOL<span>PRO</span> LOGIN</h2>
        <label>E-Mail</label>
        <input type="email" id="loginEmail" placeholder="name@firma.de">
        <label>Passwort</label>
        <input type="password" id="loginPass" placeholder="••••••••">
        <button id="loginBtn" onclick="handleLogin()">Sitzung Starten</button>
        <div id="authStatus" style="margin-top:15px; font-size:12px; font-weight:600;"></div>
    </div>
</div>

<div class="accent-line"></div>
<div class="hud">
    <div class="brand-container">
        <div class="logo">SOL<span>PRO</span></div>
        <div class="tagline">EXECUTIVE SUITE</div>
    </div>
    <div class="kpi-board">
        <div class="kpi-card"><span class="kpi-lbl">Auslastung</span><span class="kpi-val" id="kpiCapRate">0%</span></div>
        <div class="kpi-card"><span class="kpi-lbl">Netto Tage</span><span class="kpi-val" id="kpiTotalDays">0 T</span></div>
        <div class="kpi-card"><span class="kpi-lbl">Gesamt kWp</span><span class="kpi-val" id="kpiTotalKwp">0 <small>kWp</small></span></div>
    </div>
    <div class="palette-container" id="paletteUI"></div>
    <div class="controls">
        <button class="btn" id="userBtn" style="display:none" onclick="openUserManagement()">⚙️ Nutzer</button>
        <button class="btn" onclick="refreshAllData()">🔄 Sync</button>
        <button class="btn mode-switch planning" id="lockStateBtn" onclick="toggleSystemLock()">✏️ Planen</button>
        <div class="seg-group">
            <button class="btn" onclick="setView('woche', this)">W</button>
            <button class="btn active" onclick="setView('monat', this)">M</button>
            <button class="btn" onclick="setView('jahr', this)">J</button>
        </div>
        <button class="btn btn-danger" onclick="handleLogout()">Logout</button>
    </div>
</div>

<div class="nav-tabs">
    <div class="nav-tab active" id="tab-planner" onclick="switchView('planner')">PLANUNG</div>
    <div class="nav-tab" id="tab-tasks" onclick="switchView('tasks')">AUFGABEN_CENTER</div>
}</div>

<div class="main-wrapper">
    <div class="viewport" id="view-planner" style="display:block">
        <table id="theTable"><thead id="gridHead"></thead><tbody id="gridBody"></tbody></table>
    </div>
    <div class="viewport" id="view-tasks" style="display:none">
        <div style="max-width:800px; margin:0 auto;">
            <h2 style="font-family:'Orbitron'; font-size:20px; color:var(--text-main);">Aufgabenverwaltung</h2>
            <div class="todo-input-group">
                <input type="text" id="todoInput" placeholder="Neue Aufgabe definieren...">
                <button onclick="addTodo()">HINZUFÜGEN</button>
            </div>
            <div id="todoList"></div>
        </div>
    </div>
</div>

<div id="actionGridCtx" style="display:none; position:fixed; z-index:9000; background:var(--panel-bg); border:1px solid var(--//_panel-border); border-radius:var(--rad-sm); padding:8px; width:200px; box-shadow:0 10px 30px rgba(0,0,0,0.5);"></div>
<div class="overlay" id="p_overlay" onclick="closeModals()"></div>

<div class="modal" id="paletteModal">
    <h2 id="pModalTitle">Projekt Einstellungen</h2>
    <label>Projekt Name</label><input type="text" id="palNameInput">
    <label>Leistung (kWp)</label><input type="number" id="palKwpInput">
    <label>Farbe</label><input type="color" id="palColorInput" style="height:40px">
    <input type="hidden" id="palEditId">
    <div class="m-btns">
        <button class="m-btn m-save" onclick="savePaletteItem()">Speichern</button>
        <button class="m-btn m-cancel" onclick="closeModals()">Abbrechen</button>
    </div>
    <button class="m-btn" id="palDelBtn" onclick="delete,deletePaletteItem()" style="display:none; width:100%; margin-top:10px; background:var(--danger-bg); color:var(--danger); border:1px solid var(--danger);">Löschen</button>
</div>

<div class="modal" id="userModal">
    <h2>Nutzerverwaltung (Admin)</h2>
    <div id="userList" style="max-height:300px; overflow-y:auto; margin-top:10px;"></div>
    <div class="m-btns">
        <button class="m-btn m-cancel" onclick="closeModals()">Schließen</button>
    </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script>
    /* ==========================================
       SUPABASE CONFIG
       ========================================== */
    const SUPABASE_URL = "https://iuxklqcpexoziqxrohwa.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VteOTQ6g28z9Dvo-QUG8jw_hehaZpWu";
    const solproSupa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let userRole = 'viewer';
    let projects = [], plannerGrid = {}, deactivatedBuses = [], todos = [];
    let activeProjectId = "ERASER", isDrawing = false, selectedCells = [], isAppLockedForEditing = false;
    const baseFlottenListe = ["SOL 2", "SOL 3", "SOL 4", "SOL 12", "SOL 16"];
    const managementFarben = ["#1e3a8a","#0284c7","#059669","#ca8a04","#b91c1c","#6d28d9","#0f766e","#a21caf","#4f46e5","#b45309","#4338ca","#064e3b"];

    // ==========================================
    // AUTHENTICATION
    // ==========================================
    async function handleLogin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPass').value;
        const status = document.getElementById('authStatus');
        const btn = document.getElementById('loginBtn');

        if(!email || !password) return (status.innerText = "Bitte Felder ausfüllen");
        btn.innerText = "Lade..."; btn.disabled = true;

        try {
            const { data, error } = await solproSupa.auth.signInWithPassword({ email, password });
            if (error) throw error;
            currentUser = data.user;
            await fetchUserRole();
            document.getElementById('authOverlay').style.display = 'none';
            startApp();
        } catch (e) {
            status.innerText = "❌ Fehler: " + e.message;
            status.style.color = "var(--danger)";
        } finally {
            btn.innerText = "Sitzung Starten"; btn.disabled = false;
        }
    }

    async function fetchUserRole() {
        const { data, error } = await solproSupa.from('profiles').select('role').eq('id', currentUser.id).single();
        if (data) userRole = data.role;
        else {
            await solproSupa.from('profiles').insert([{ id: currentUser.id, email: currentUser.email, role: 'viewer' }]);
            userRole = 'viewer';
        }
        if(userRole === 'admin') document.getElementById('userBtn').style.display = 'block';
    }

    function handleLogout() { solproSupa.auth.signOut(); window.location.reload(); }

    // ==========================================
    // TO-DO ENGINE
    // ==========================================
    async function loadTodos() {
        const { data } = await solproSupa.from('todos').select('*').eq('user_id', currentUser.id).order('id', { ascending: false });
        todos = data || [];
        renderTodos();
    }

    async function addTodo() {
        const input = document.getElementById('todoInput');
        const task = input.value.trim();
        if(!task) return;
        const { data, error } = await solproSupa.from('todos').insert([{ task, user_id: currentUser.id, is_completed: false }]).select().single();
        if(error) return showToast("Fehler!", "error");
        input.value = ""; todos.unshift(data); renderTodos();
    }

    async function toggleTodo(id, status) {
        await solproSupa.from('todos').update({ is_completed: !status }).eq('id', id);
        await loadTodos();
    }

    async function deleteTodo(id) {
        await solproSupa.from('todos').delete().eq('id', id);
        await loadTodos();
    }

    function renderTodos() {
        const list = document.getElementById('todoList');
        list.innerHTML = '';
        todos.forEach(t => {
            const div = document.createElement('div');
            div.className = `todo-item ${t.is_completed ? 'done' : ''}`;
            div.innerHTML = `
                <input type="checkbox" ${t.is_completed ? 'checked' : ''} onclick="toggleTodo('${t.id}', ${t.is_completed})">
                <span>${t.task}</span>
                <div class="del-todo" onclick="deleteTodo('${t.id}')">✕</div>
            `;
            list.appendChild(div);
        });
    }

    // ==========================================
    // CORE APP
    // ==========================================
    async function startApp() {
        buildGrid();
        await refreshAllData();
        await loadTodos();
        renderProjectsToTopPalette();
        setupMouseDragPainting();
        setupGlobalUiHandlers();
        
        if(userRole === 'viewer') {
            isAppLockedForEditing = true;
            document.getElementById('lockStateBtn').className = 'btn readonly';
            document.getElementById('lockStateBtn').innerText = '🔒 NUR-LESE-MODUS';
        }
    }

    async function refreshAllData() {
        try {
            const { data: pData } = await solproSupa.from('projects').select('*');
            projects = pData || [];
            const { data: gData } = await solproSupa.from('planner_grid').select('*');
            plannerGrid = {};
            (gData || []).forEach(row => { plannerGrid[row.cell_id] = row.project_id; });
            const { data: fData } = await solproSupa.from('fleet_status').select('*');
            deactivatedBuses = (fData || []).filter(row => row.is_offline).map(row => row.bus_id);
            
            fullGridRepaintUI_Logic();
            renderProjectsToTopPalette();
            showToast("Sync OK", "success");
        } catch (e) { showToast("Fehler", "error"); }
    }

    function buildGrid() {
        const thead = document.getElementById('gridHead'); const tbody = document.getElementById('gridBody');
        let currentDay = new Date(2026, 7, 17); const endDate = new Date(2026, 11, 31); const dateArray = [];
        while(currentDay <= endDate) { if(currentDay.getDay()!==0 && currentDay.getDay()!==6) dateArray.push(new Date(currentDay)); currentDay.setDate(currentDay.getDate()+1); }
        
        let trMonat = `<tr><th rowspan="3" class="fixed-corner"><div class="logo" style="font-size:16px;">SOL<span>PRO</span></div></th>`;
        let trKW = `<tr>`, trTage = `<tr>`;
        let lastM=-1, mSpans=[], lastKW=-1, kwSpans=[];
        dateArray.forEach(d => {
            let m=d.getMonth(), kw=getKalenderWocheMath(d);
            if(m!==lastM){ mSpans.push({label:d.toLocaleString('de-DE',{month:'short'}).toUpperCase(), count:1}); lastM=m; } else mSpans[mSpans.length-1].count++;
            if(kw!==lastKW){ kwSpans.push({label:'KW '+kw, count:1}); lastKW=kw; } else kwSpans[kwSpans.length-1].count++;
        });
        mSpans.forEach(ms => trMonat += `<th colspan="${ms.count}">${ms.label}</th>`);
        kwSpans.forEach(ks => trKW += `<th colspan="${ks.count}">${ms.label}</th>`);
        dateArray.forEach(d => {
            let iso = d.toISOString().split('T')[0];
            trTage += `<th id="th-${iso}" class="${d.getDay()===1?'monday-start':''}"><div class="day-num">${d.getDate()}</div><div class="day-short">${d.toLocaleString('de-DE',{weekday:'short'})}</div></th>`;
        });
        thead.innerHTML = trMonat + `</tr>` + trKW + `</tr>` + trTage + `</tr>`;
        baseFlottenListe.forEach(w => {
            let sf = w.replace(/\s+/g,'_');
            let rw = `<tr id="row_${sf}" class="worker-row is-active"><td><div class="bus-ctrl"><span>${w}</span><button class="toggle-btn ${deactivatedBuses.includes(sf)?'inactive':'active'}" onclick="toggleBusState('${sf}')"></button></div></td>`;
            dateArray.forEach(d => {
                let iso = d.toISOString().split('T')[0];
                rw += `<td id="CELL_${sf}_${iso}" class="project-cell${(d.getDay()===1?' monday-start':'')}" data-date-ts="${d.getTime()}"></td>`;
            });
            tbody.insertAdjacentHTML('beforeend', rw + `</tr>`);
        });
        let fRow = `<tr class="stat-row"><td>LEISTUNG</td>`;
        dateArray.forEach(d => fRow += `<td id="COUNT_${d.toISOString().split, 'T')[0]}">0</td>`);
        tbody.insertAdjacentHTML('beforeend', fRow + `</tr>`);
    }

    function toggleBusState(sid) {
        if(userRole === 'viewer' || isAppLockedForEditing) return showToast('Nicht erlaubt!', 'warn');
        const isNowOffline = !deactivatedBuses.includes(sid);
        if(isNowOffline) { deactivatedBuses.push(sid); document.getElementById('row_'+sid).classList.replace('is-active','is-offline'); }
        else { deactivatedBuses=deactivatedBuses.filter(v=>v!==sid); document.getElementById('row_'+sid).classList.replace('is-offline','is-active'); }
        solproSupa.from('fleet_status').upsert({ bus_id: sid, is_offline: isNowOffline });
        fullGridRepaintUI_Logic();
    }

    function setupMouseDragPainting() {
        document.addEventListener('mousedown', e => {
            if (e.target.classList.contains('project-cell') && e.button === 0) {
                if(isAppLockedForEditing || userRole === 'viewer') return;
