<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLPRO Diagnose - Direct API Test</title>
<style>
body { font-family: monospace; background: #f5f5f5; color: #333; padding: 20px; }
.container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
h1 { color: #12110F; }
.test { margin: 15px 0; padding: 10px; border-left: 4px solid #ccc; }
.test.ok { border-left-color: #1A7A4A; background: #f0fdf4; }
.test.error { border-left-color: #C8303A; background: #fdf2f2; }
.test.loading { border-left-color: #2563eb; background: #f0f9ff; }
.status { font-weight: bold; }
.ok .status { color: #1A7A4A; }
.error .status { color: #C8303A; }
.loading .status { color: #2563eb; }
.message { font-size: 12px; margin-top: 5px; }
button { padding: 10px 20px; margin: 10px 0; cursor: pointer; background: #12110F; color: white; border: none; border-radius: 4px; }
button:hover { background: #3a3730; }
</style>
</head>
<body>

<div class="container">
  <h1>🔧 SOLPRO - Direkter API Test</h1>
  <p>Testet Supabase-Verbindung ohne externe JS-Libs</p>
  
  <div id="results"></div>
  
  <button onclick="runTest()">🔄 Test starten</button>
  <button onclick="document.getElementById('results').innerHTML=''">Löschen</button>
</div>

<script>
const SUPABASE_URL = 'https://iuxklqcpexoziqxrohwa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VteOTQ6g28z9Dvo-QUG8jw_hehaZpWu';

function addResult(title, message, status = 'loading') {
  const div = document.createElement('div');
  div.className = `test ${status}`;
  div.innerHTML = `<span class="status">${status === 'ok' ? '✓' : status === 'error' ? '✗' : '⟳'}</span> <strong>${title}</strong><div class="message">${message}</div>`;
  document.getElementById('results').appendChild(div);
  return div;
}

async function runTest() {
  document.getElementById('results').innerHTML = '';
  
  // Test 1: Supabase URL erreichbar
  let r1 = addResult('API Erreichbarkeit', 'Teste https://iuxklqcpexoziqxrohwa.supabase.co...');
  try {
    const response = await fetch(SUPABASE_URL);
    if (response.ok || response.status === 404) {
      r1.className = 'test ok';
      r1.querySelector('.status').textContent = '✓';
      r1.querySelector('.message').textContent = `✓ Server antwortet (Status: ${response.status})`;
    } else {
      r1.className = 'test error';
      r1.querySelector('.status').textContent = '✗';
      r1.querySelector('.message').textContent = `✗ Server-Fehler: ${response.status}`;
    }
  } catch (e) {
    r1.className = 'test error';
    r1.querySelector('.status').textContent = '✗';
    r1.querySelector('.message').textContent = `✗ Verbindungsfehler: ${e.message}`;
  }
  
  // Test 2: Tabelle "buses" abfragen
  let r2 = addResult('Tabelle: buses', 'Versuche Daten zu laden...');
  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/buses?select=*&limit=1`,
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      }
    );
    const data = await response.json();
    
    if (response.ok) {
      r2.className = 'test ok';
      r2.querySelector('.status').textContent = '✓';
      r2.querySelector('.message').textContent = `✓ Tabelle existiert (${Array.isArray(data) ? data.length : '?'} Zeilen)`;
    } else if (response.status === 401) {
      r2.className = 'test error';
      r2.querySelector('.status').textContent = '✗';
      r2.querySelector('.message').textContent = '✗ Auth-Fehler: API-Key ungültig oder abgelaufen';
    } else if (response.status === 404) {
      r2.className = 'test error';
      r2.querySelector('.status').textContent = '✗';
      r2.querySelector('.message').textContent = '✗ Tabelle existiert nicht (404)';
    } else {
      r2.className = 'test error';
      r2.querySelector('.status').textContent = '✗';
      r2.querySelector('.message').textContent = `✗ Fehler ${response.status}: ${data?.message || JSON.stringify(data)}`;
    }
  } catch (e) {
    r2.className = 'test error';
    r2.querySelector('.status').textContent = '✗';
    r2.querySelector('.message').textContent = `✗ Fehler: ${e.message}`;
  }
  
  // Test 3: Tabelle "profiles"
  let r3 = addResult('Tabelle: profiles', 'Versuche Daten zu laden...');
  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/profiles?select=*&limit=1`,
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      }
    );
    const data = await response.json();
    
    if (response.ok) {
      r3.className = 'test ok';
      r3.querySelector('.status').textContent = '✓';
      r3.querySelector('.message').textContent = `✓ Tabelle existiert (${Array.isArray(data) ? data.length : '?'} Zeilen)`;
    } else if (response.status === 404) {
      r3.className = 'test error';
      r3.querySelector('.status').textContent = '✗';
      r3.querySelector('.message').textContent = '✗ Tabelle existiert nicht (404)';
    } else {
      r3.className = 'test error';
      r3.querySelector('.status').textContent = '✗';
      r3.querySelector('.message').textContent = `✗ Fehler ${response.status}`;
    }
  } catch (e) {
    r3.className = 'test error';
    r3.querySelector('.status').textContent = '✗';
    r3.querySelector('.message').textContent = `✗ Fehler: ${e.message}`;
  }

  // Test 4: Tabelle "projects"
  let r4 = addResult('Tabelle: projects', 'Versuche Daten zu laden...');
  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/projects?select=*&limit=1`,
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      }
    );
    const data = await response.json();
    
    if (response.ok) {
      r4.className = 'test ok';
      r4.querySelector('.status').textContent = '✓';
      r4.querySelector('.message').textContent = `✓ Tabelle existiert (${Array.isArray(data) ? data.length : '?'} Zeilen)`;
    } else if (response.status === 404) {
      r4.className = 'test error';
      r4.querySelector('.status').textContent = '✗';
      r4.querySelector('.message').textContent = '✗ Tabelle existiert nicht (404)';
    } else {
      r4.className = 'test error';
      r4.querySelector('.status').textContent = '✗';
      r4.querySelector('.message').textContent = `✗ Fehler ${response.status}`;
    }
  } catch (e) {
    r4.className = 'test error';
    r4.querySelector('.status').textContent = '✗';
    r4.querySelector('.message').textContent = `✗ Fehler: ${e.message}`;
  }
}

// Auto-run on load
window.addEventListener('load', runTest);
</script>

</body>
</html>
